# ═══════════════════════════════════════════════════════════════════════════
# Grafana Datasource: PostgreSQL
# ═══════════════════════════════════════════════════════════════════════════

apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres-pgvector:5432
    database: ollama_proxy
    user: proxy_user
    secureJsonData:
      password: secure_password_change_me  # Change in production!
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    editable: true

