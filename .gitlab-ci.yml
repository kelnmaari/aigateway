# AI Code Review через Ollama-OpenAI Proxy
# Адаптировано для Go проекта aigateway-desktop

stages:
  - analyze
  - build

variables:
  # Настройки прокси (используйте GitLab CI/CD Variables)
  PROXY_URL: "http://176.53.180.178:8085/v1/chat/completions"
  # PROXY_API_KEY должен быть настроен в Settings → CI/CD → Variables
  
  # Модель для code review
  # Рекомендуемые модели:
  #   🏆 qwen2.5-coder:7b - лучший для Go кода
  #   ⭐ deepseek-coder:6.7b - хороший для анализа
  #   ✅ codellama:7b - универсальный
  REVIEW_MODEL: "gpt-oss-tuned:latest"

# ============================================================================
# AI Code Review для Merge Requests
# ============================================================================
analyze_merge_request:
  stage: analyze
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq bash git
  script:
    - echo "🤖 AI Code Review with Ollama-OpenAI Proxy..."
    - |
      # Получаем изменения MR
      echo "📥 Fetching MR changes..."
      # Пробуем CI_JOB_TOKEN сначала, fallback на GITLAB_API_TOKEN
      API_TOKEN="${GITLAB_API_TOKEN:-$CI_JOB_TOKEN}"
      DIFF_RAW=$(curl -s --header "PRIVATE-TOKEN: $API_TOKEN" \
        "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/changes")
      
      if [ -z "$DIFF_RAW" ] || [ "$DIFF_RAW" = "null" ]; then
        echo "❌ Ошибка: Не удалось получить diff"
        exit 1
      fi
      
      # Извлекаем diff текст (до 100KB для 32k context window)
      DIFF_TEXT=$(echo "$DIFF_RAW" | jq -r '.changes[] | 
        "File: \(.new_path // .old_path)\n" + 
        "Status: \(.new_file // false | if . then "new" else "modified" end)\n" +
        (.diff // "No diff") + "\n---\n"' | head -c 100000 || true)
      
      if [ -z "$DIFF_TEXT" ]; then
        echo "⚠️ Diff пустой, пропускаем review"
        exit 0
      fi
      
      echo "📊 Diff size: $(echo "$DIFF_TEXT" | wc -c) bytes"
      
      # Создаем OpenAI-совместимый запрос
      echo "🧠 Отправка в AI модель ($REVIEW_MODEL)..."
      
      SYSTEM_PROMPT="Ты опытный Go разработчик проводящий code review. Проанализируй изменения и дай ТОП-5 замечаний. Укажи файл и строки для каждого замечания. Фокусируйся на безопасность производительность читаемость Go best practices. Игнорируй мелочи. КРАТКИЙ ответ максимум 3000 символов. Формат ответа Markdown с разделами Положительное Замечания Рекомендации. Отвечай на русском языке кратко."
      
      REQUEST_JSON=$(jq -n \
        --arg model "$REVIEW_MODEL" \
        --arg system "$SYSTEM_PROMPT" \
        --arg user "Проанализируй следующий diff:\n\n$DIFF_TEXT" \
        '{
          "model": $model,
          "messages": [
            {"role": "system", "content": $system},
            {"role": "user", "content": $user}
          ],
          "temperature": 0.3,
          "max_tokens": 1500,
          "stream": false
        }')
      
      # Отправляем в прокси
      RESPONSE=$(curl -s -X POST "$PROXY_URL" \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer $PROXY_API_KEY" \
        -d "$REQUEST_JSON")
      
      # Проверяем ошибки
      ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error.message // empty')
      if [ -n "$ERROR_MSG" ]; then
        echo "❌ Ошибка от proxy: $ERROR_MSG"
        exit 1
      fi
      
      # Извлекаем ответ AI
      AI_RESPONSE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
      
      if [ -z "$AI_RESPONSE" ]; then
        echo "❌ Ошибка: пустой ответ от AI"
        echo "Response: $RESPONSE"
        exit 1
      fi
      
      echo "✅ AI analysis completed"
      
      # Создаем MD файл с полным отчетом
      REPORT_FILE="ai-review-${CI_PIPELINE_ID}.md"
      cat > "$REPORT_FILE" << 'REPORT_EOF'
# 🤖 AI Code Review Report

**Pipeline ID:** ${CI_PIPELINE_ID}
**Model:** ${REVIEW_MODEL}
**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
**MR:** !${CI_MERGE_REQUEST_IID}

---

## 📊 Analysis Summary

**Diff Size:** $(echo "$DIFF_TEXT" | wc -c) bytes
**Response Length:** $(echo "$AI_RESPONSE" | wc -c) characters

---

## 🔍 AI Review

${AI_RESPONSE}

---

*Generated by Ollama-OpenAI Proxy CI/CD Pipeline*
REPORT_EOF
      
      # Подставляем переменные
      eval "cat > \"$REPORT_FILE\" << 'REPORT_EOF'
# 🤖 AI Code Review Report

**Pipeline ID:** ${CI_PIPELINE_ID}
**Model:** ${REVIEW_MODEL}
**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
**MR:** !${CI_MERGE_REQUEST_IID}

---

## 📊 Analysis Summary

**Diff Size:** $(echo "$DIFF_TEXT" | wc -c) bytes
**Response Length:** $(echo "$AI_RESPONSE" | wc -c) characters

---

## 🔍 AI Review

${AI_RESPONSE}

---

*Generated by Ollama-OpenAI Proxy CI/CD Pipeline*
REPORT_EOF"
      
      echo "📄 Report file created: $REPORT_FILE"
      
      # Загружаем файл в GitLab
      echo "📤 Uploading report file to GitLab..."
      UPLOAD_RESULT=$(curl -s --request POST \
        --header "PRIVATE-TOKEN: $API_TOKEN" \
        --form "file=@$REPORT_FILE" \
        "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/uploads")
      
      UPLOAD_MARKDOWN=$(echo "$UPLOAD_RESULT" | jq -r '.markdown // empty')
      UPLOAD_URL=$(echo "$UPLOAD_RESULT" | jq -r '.url // empty')
      
      if [ -n "$UPLOAD_URL" ]; then
        echo "✅ File uploaded: $UPLOAD_URL"
        FULL_REPORT_LINK="[📄 Полный отчет]($CI_SERVER_URL/$CI_PROJECT_PATH$UPLOAD_URL)"
      else
        echo "⚠️ Failed to upload file"
        FULL_REPORT_LINK=""
      fi
      
      # Проверяем длину ответа (GitLab лимит ~64KB на комментарий)
      RESPONSE_LENGTH=$(echo "$AI_RESPONSE" | wc -c)
      echo "📏 Response length: $RESPONSE_LENGTH bytes"
      
      # Если ответ длиннее 60000 символов - разрезаем на части
      MAX_CHUNK_SIZE=50000
      
      if [ "$RESPONSE_LENGTH" -gt "$MAX_CHUNK_SIZE" ]; then
        echo "⚠️ Response too long, splitting into multiple comments..."
        
        # Разрезаем на части по 50KB
        TEMP_FILE=$(mktemp)
        echo "$AI_RESPONSE" > "$TEMP_FILE"
        
        TOTAL_CHUNKS=$(( ($RESPONSE_LENGTH + $MAX_CHUNK_SIZE - 1) / $MAX_CHUNK_SIZE ))
        CHUNK_NUM=1
        
        while [ $CHUNK_NUM -le $TOTAL_CHUNKS ]; do
          CHUNK_START=$(( ($CHUNK_NUM - 1) * $MAX_CHUNK_SIZE ))
          CHUNK_TEXT=$(dd if="$TEMP_FILE" bs=1 skip=$CHUNK_START count=$MAX_CHUNK_SIZE 2>/dev/null || true)
          
          COMMENT_BODY=$(jq -n \
            --arg model "$REVIEW_MODEL" \
            --arg response "$CHUNK_TEXT" \
            --arg pipeline "$CI_PIPELINE_ID" \
            --arg part "$CHUNK_NUM" \
            --arg total "$TOTAL_CHUNKS" \
            --arg report "$FULL_REPORT_LINK" \
            '{body: ("🤖 **AI Code Review** [Part " + $part + "/" + $total + "] (Model: " + $model + ")\n\n" + $response + "\n\n---\n" + $report + " | Pipeline ID: " + $pipeline)}')
          
          echo "💬 Adding comment part $CHUNK_NUM/$TOTAL_CHUNKS..."
          curl -s --request POST \
            --header "PRIVATE-TOKEN: $API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$COMMENT_BODY" \
            "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" > /dev/null
          
          CHUNK_NUM=$(($CHUNK_NUM + 1))
          sleep 1  # Небольшая задержка между комментариями
        done
        
        rm -f "$TEMP_FILE"
        echo "✅ All comment parts added successfully"
      else
        # Ответ влезает в один комментарий
        COMMENT_BODY=$(jq -n \
          --arg model "$REVIEW_MODEL" \
          --arg response "$AI_RESPONSE" \
          --arg pipeline "$CI_PIPELINE_ID" \
          --arg report "$FULL_REPORT_LINK" \
          '{body: ("🤖 **AI Code Review** (Model: " + $model + ")\n\n---\n\n" + $response + "\n\n---\n" + $report + " | *Powered by Ollama-OpenAI Proxy | Review ID: " + $pipeline + "*")}')
        
        echo "💬 Adding comment to MR..."
        COMMENT_RESULT=$(curl -s --request POST \
          --header "PRIVATE-TOKEN: $API_TOKEN" \
          --header "Content-Type: application/json" \
          --data "$COMMENT_BODY" \
          "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes")
        
        COMMENT_ID=$(echo "$COMMENT_RESULT" | jq -r '.id // empty')
        if [ -n "$COMMENT_ID" ]; then
          echo "✅ Comment added successfully (ID: $COMMENT_ID)"
        else
          echo "⚠️ Failed to add comment"
          echo "$COMMENT_RESULT" | jq '.'
        fi
      fi

  artifacts:
    paths:
      - ai-review-*.md
    expire_in: 30 days
    when: always
  rules:
    - if: '$CI_MERGE_REQUEST_IID'  # Только для MR
  allow_failure: true
  timeout: 10m

# ============================================================================
# Go Build (опционально)
# ============================================================================
build:
  stage: build
  image: golang:1.25.3-alpine
  before_script:
    - apk add --no-cache git make
  script:
    - echo "🔨 Building Go project..."
    - make build
  artifacts:
    paths:
      - bin/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'  # Только для main ветки
    - if: '$CI_MERGE_REQUEST_IID'  # И для MR
  allow_failure: false
  timeout: 15m

# ============================================================================
# SETUP INSTRUCTIONS:
# ============================================================================
# 
# 1. Создайте GitLab CI/CD переменные:
#
#    a) PROXY_API_KEY (Required):
#       Settings → CI/CD → Variables → Add Variable
#       Key: PROXY_API_KEY
#       Value: ваш API ключ из Ollama-OpenAI Proxy
#       Flags: [✓] Mask variable, [✓] Protect variable
#
#    b) GITLAB_API_TOKEN (Optional):
#       По умолчанию используется CI_JOB_TOKEN (автоматический).
#       
#       Если CI_JOB_TOKEN не работает (GitLab < 15 или ограниченные права):
#       Создайте Project Access Token:
#         Settings → Access Tokens → Add new token
#         Name: ai-review-token
#         Role: Developer
#         Scopes: [✓] api, [✓] read_api
#       
#       Затем добавьте в CI/CD Variables:
#       Key: GITLAB_API_TOKEN
#       Value: (скопированный токен)
#       Flags: [✓] Mask variable, [✓] Protect variable
#       
#       Для включения расширенных прав CI_JOB_TOKEN (GitLab 15+):
#       Settings → CI/CD → Token Access → 
#         [✓] Limit access to this project
#
# 2. Проверьте доступность прокси:
#    - Proxy URL должен быть доступен из GitLab Runner
#    - Если на localhost - использовать внешний IP
#    - Проверьте firewall правила
#
# 3. Настройка модели (опционально):
#    Измените переменную REVIEW_MODEL на нужную:
#      - qwen2.5-coder:7b (default, лучший для Go)
#      - deepseek-coder:6.7b (быстрый)
#      - codellama:7b (универсальный)
#
# 4. Доступные модели можно проверить:
#    curl http://YOUR_PROXY:8085/v1/models \
#      -H "Authorization: Bearer $API_KEY"
#
# 5. Workflow:
#    1. Создаете MR в GitLab
#    2. Pipeline автоматически запускает analyze_merge_request
#    3. AI анализирует изменения
#    4. Генерируется Markdown файл с полным отчетом (ai-review-{pipeline_id}.md)
#    5. Файл загружается в GitLab и сохраняется как артефакт (30 дней)
#    6. Комментарий с кратким review и ссылкой на полный отчет появляется в MR
#    7. Если ответ >50KB - автоматически разделяется на несколько комментариев
#
# 6. Artifacts:
#    - AI review reports сохраняются как artifacts в течение 30 дней
#    - Доступны через: Pipeline → Job → Browse artifacts → ai-review-*.md
#    - Также доступны через ссылку в комментарии к MR
#
# ============================================================================

