<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Log - AIGateway Platform Admin</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/notifications.css">
</head>
<body class="dashboard-page">
    <!-- Top Navigation inserted by navbar.js -->
    <div id="navigation-placeholder"></div>

    <!-- Main Content -->
    <main class="dashboard-main">
        <div class="dashboard-container">
            <!-- Page Header -->
            <header class="page-header">
                <div>
                    <h1>🔍 Audit Log</h1>
                    <p class="page-description">System event monitoring and security audit trail</p>
                </div>
                <div style="display: flex; gap: 12px;">
                    <a href="/admin.html" class="btn btn-secondary">Back to Admin</a>
                </div>
            </header>

            <!-- Content Area with Background -->
            <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; min-height: calc(100vh - 280px);">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card danger">
                    <h3>Critical Events</h3>
                    <div class="value" id="critical-events">-</div>
                </div>
                <div class="stat-card warning">
                    <h3>Warning Events</h3>
                    <div class="value" id="warning-events">-</div>
                </div>
                <div class="stat-card info">
                    <h3>Info Events</h3>
                    <div class="value" id="info-events">-</div>
                </div>
                <div class="stat-card">
                    <h3>Failed Logins (24h)</h3>
                    <div class="value" id="failed-logins">-</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="card mt-lg">
                <div class="card-header">
                    <h2 class="card-title">Filters</h2>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Event Type</label>
                            <select class="form-control" id="filter-event-type">
                                <option value="">All Events</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Severity</label>
                            <select class="form-control" id="filter-severity">
                                <option value="">All Severities</option>
                                <option value="critical">Critical</option>
                                <option value="warning">Warning</option>
                                <option value="info">Info</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Resource</label>
                            <select class="form-control" id="filter-resource">
                                <option value="">All Resources</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Status</label>
                            <select class="form-control" id="filter-status">
                                <option value="">All</option>
                                <option value="success">Success</option>
                                <option value="failure">Failure</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">From Date</label>
                            <input type="datetime-local" class="form-control" id="filter-from-date">
                        </div>
                        <div class="form-group">
                            <label class="form-label">To Date</label>
                            <input type="datetime-local" class="form-control" id="filter-to-date">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Actor ID</label>
                            <input type="text" class="form-control" id="filter-actor-id" placeholder="User ID or API Key">
                        </div>
                    </div>
                    <div class="btn-group mt-md">
                        <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
                        <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
                        <button class="btn btn-success" onclick="exportToCSV()">Export to CSV</button>
                    </div>
                </div>
            </div>

            <!-- Audit Events Table -->
            <div class="card mt-lg">
                <div class="card-header">
                    <h2 class="card-title">Audit Events</h2>
                    <div id="total-events" class="text-muted">Loading...</div>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table id="audit-events-table">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Event Type</th>
                                    <th>Severity</th>
                                    <th>Actor</th>
                                    <th>Action</th>
                                    <th>Resource</th>
                                    <th>Status</th>
                                    <th>IP Address</th>
                                </tr>
                            </thead>
                            <tbody id="audit-events-tbody">
                                <tr>
                                    <td colspan="8" class="table-empty">
                                        <div class="loading"></div> Loading audit events...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="d-flex justify-between align-center mt-md">
                        <div id="page-info">Page 1 of 1</div>
                        <div class="btn-group">
                            <button class="btn btn-secondary" id="prev-page-btn" onclick="prevPage()" disabled>Previous</button>
                            <button class="btn btn-secondary" id="next-page-btn" onclick="nextPage()">Next</button>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </main>

    <script src="/js/auth-guard.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils/notifications.js"></script>
    <script src="/js/components/navbar.js"></script>
    <script src="/js/admin-audit.js"></script>
    <!-- AIGateway UI Framework (v3.1.0) -->
    <script src="/framework/framework.js"></script>
    <link rel="stylesheet" href="/framework/framework.css">
</body>
</html>
