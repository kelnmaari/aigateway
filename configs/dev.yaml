# Development Configuration для AIGateway Platform v3.0.5+
# Migration: Now using inference.backend instead of separate ollama/yzma configs

server:
  port: 8085
  host: "0.0.0.0"
  read_timeout: "30m"     # 15 минут - для AI review с большими моделями
  write_timeout: "30m"    # 15 минут - для streaming с большими моделями
  idle_timeout: "120s"    # 2 минуты
  max_header_bytes: 1048576  # 1MB

# Inference Configuration (v3.0.5+: Unified Backend)
inference:
  backend: "yzma"  # Only yzma is supported (v3.0.6+)
  max_loaded_models: 3    # Keep 3 models in memory (yzma only)
  gpu_layers: -1          # GPU offloading (v3.0.6+): -1=auto (all layers to GPU), 0=CPU only, >0=specific layers count
  
  # yzma Configuration (Primary Backend)
  yzma:
    enabled: true
    lib_path: "C:/llama" # Path to directory containing llama.cpp DLLs
    models_dir: "./data/models"
    context_size: 4096
    batch_size: 2048
    ubatch_size: 2048
    temperature: 0.7
    top_k: 40
    top_p: 0.9
    min_p: 0.1
    verbose: true  # Enable verbose logging from llama.cpp


auth:
  enabled: true   # Включено для тестирования API Key Management
  storage_type: "json"
  storage_path: "data/api_keys.json"
  admin_key: "sk-admin-dev-key-12345"
  
  # Rate limiting
  rate_limiting:
    enabled: true
    default_requests_per_minute: 60
    default_requests_per_hour: 1000
    
    # Redis для distributed rate limiting (K8S NodePort)
    redis:
      enabled: true                                # Enable Redis (v3.0.6+)
      url: "redis://192.168.1.101:30897"
      key_prefix: "aigateway_rl:"                  # Key prefix for rate limiting
      db: 0                                        # Redis database number
      max_retries: 3
      pool_size: 10
  
  # JWT для user authentication (Version 1.3.0+)
  jwt:
    secret: "dev-jwt-secret-change-this-in-production-use-at-least-32-chars"
    access_token_expiry: "15m"    # Access token живет 15 минут
    refresh_token_expiry: "168h"  # Refresh token живет 7 дней
  
  # User Registration (Version 2.3.0+: Invitation System)
  registration:
    mode: "open"  # "open" | "invitation_only" | "disabled"
    require_email_verification: false  # Требовать верификацию email после регистрации
    allow_username_login: true  # Разрешить логин по username (не только email)
  
  # Invitation System (Version 2.3.0+)
  invitations:
    enabled: true  # Включить систему приглашений
    default_expiry_days: 7  # Срок действия приглашения по умолчанию (0 = без ограничения)
    max_uses_default: 1  # Сколько раз можно использовать одно приглашение
    allow_email_restriction: true  # Разрешить привязку приглашения к email
    
    # Rate limiting для создания приглашений
    rate_limit:
      creation_per_admin_hour: 10  # Максимум приглашений от одного админа в час
      validation_per_ip_minute: 10  # Максимум проверок токена с одного IP в минуту

  # OIDC/Keycloak SSO (Version 1.11.1+: Enterprise Suite)
  oidc:
    enabled: false  # Отключено по умолчанию в dev (требует Keycloak сервер)
    provider: "keycloak"
    issuer: "https://keycloak.example.com/realms/myrealm"
    client_id: "ollama-proxy"
    client_secret: "${OIDC_CLIENT_SECRET}"  # Из environment variable
    redirect_uri: "http://localhost:8085/auth/oidc/callback"
    scopes:
      - openid
      - profile
      - email
      - groups
    
    # Claims mapping (default values)
    claims:
      user_id: "sub"
      username: "preferred_username"
      email: "email"
      name: "name"
      groups: "groups"
      roles: "realm_roles"
    
    # User provisioning
    auto_create_user: true   # Автоматически создавать пользователя при первом логине
    auto_update_user: true   # Автоматически обновлять данные при каждом логине
    default_role: "user"     # Роль по умолчанию для новых пользователей
    
    # Session management
    session_store: "memory"  # memory или redis
    session_ttl: "10m"       # 10 минут на OIDC flow
    
    # Tenant provisioning from OIDC groups (Version 1.11.2+: Auto-tenant Provisioning)
    tenant_provisioning:
      enabled: true  # Автоматическое создание tenants из OIDC groups
      auto_create_tenants: true  # Создавать tenants если они не существуют
      sync_on_login: true  # Синхронизировать tenants при каждом логине
      remove_orphaned_memberships: false  # Не удалять membership если группа удалена
      
      # Group → Tenant mapping rules
      group_mapping:
        mode: "prefix"  # "direct" (1:1) или "prefix" (extract after prefix)
        prefix: "/engineering/"  # Для prefix mode: "/engineering/backend" → "backend"
        
        # Groups которые дают admin роль в tenant
        admin_groups:
          - "engineering-admins"
          - "tenant-admins"
          - "/admins"
  
  # LDAP/Active Directory (Version 1.11.3+: Enterprise Suite)
  ldap:
    enabled: false  # Отключено по умолчанию (требует LDAP сервер)
    
    # LDAP Server
    url: "ldap://ldap.example.com:389"  # или ldaps://ldap.example.com:636 для TLS
    bind_dn: "cn=admin,dc=example,dc=com"
    bind_password: "${LDAP_BIND_PASSWORD}"  # Из environment variable
    
    # User Search
    user_base_dn: "ou=users,dc=example,dc=com"
    user_filter: "(uid={username})"  # OpenLDAP; для AD: "(sAMAccountName={username})"
    user_id_attribute: "uid"  # для AD: "sAMAccountName"
    user_email_attribute: "mail"
    user_name_attribute: "cn"
    
    # Group Search (optional)
    group_base_dn: "ou=groups,dc=example,dc=com"
    group_filter: "(member={userdn})"  # для AD: "(memberOf={userdn})"
    group_name_attribute: "cn"
    
    # TLS/SSL
    start_tls: false  # Использовать StartTLS для ldap:// connections
    skip_verify: false  # НЕ ВКЛЮЧАЙТЕ в production!
    ca_cert_file: ""  # Путь к CA certificate (optional)
    
    # User Provisioning
    auto_create_user: true  # Создавать пользователя при первом логине
    auto_update_user: true  # Обновлять email/name при каждом логине
    
    # Tenant Provisioning from LDAP Groups (reuse OIDC-02 logic)
    tenant_provisioning:
      enabled: true
      auto_create_tenants: true
      sync_on_login: true
      remove_orphaned_memberships: false
      
      group_mapping:
        mode: "direct"  # или "prefix"
        prefix: ""  # Для prefix mode
        admin_groups:
          - "Domain Admins"
          - "Administrators"
    
    # Timeout
    timeout: "30s"

# 💾 DATABASE - User Management & Multi-Tenancy (Version 1.3.0+)
database:
  # Database type: sqlite or postgresql
  type: "postgresql"
  
  # SQLite Configuration (для development)
  sqlite:
    path: "data/aigateway.db"
    journal_mode: "WAL"      # Write-Ahead Logging для лучшей concurrency
    busy_timeout: 5000        # ms - ожидание при locked БД
    cache_size: 10000         # KB - размер кеша SQLite
  
  # PostgreSQL Configuration (K8S NodePort)
  postgresql:
    host: "192.168.1.101"
    port: 32316
    user: "proxy_user"
    password: "secure_password_change_me"
    database: "ollama_proxy"
    sslmode: "disable"       # disable для dev, require для prod
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime: "5m"

logging:
  level: "debug"
  format: "text"  # text или json
  output: "both"  # both = файл И консоль, stdout = только консоль, file = только файл
  file_path: "logs/proxy-dev.log"
  max_size: 100    # MB - размер файла до ротации
  max_backups: 5   # Количество старых файлов
  max_age: 30      # days - удалять файлы старше
  compress: true   # Сжимать старые логи (gzip)
  
  # Separate error log file (errors and warnings only)
  error_log_enabled: true
  error_log_file_path: "logs/proxy-errors.log"
  error_log_max_size: 50      # MB (default: same as max_size)
  error_log_max_backups: 10   # Keep more error log backups
  error_log_max_age: 90       # days (keep errors longer)
  error_log_compress: true

models:
  # Модель по умолчанию для embeddings
  # Используется когда:
  # - Не указана модель в запросе
  # - Указана OpenAI модель (text-embedding-*)
  #
  # Рекомендуемые модели:
  # - nomic-embed-text:latest (768 dimensions, высокое качество)
  # - mxbai-embed-large:latest (1024 dimensions, лучшее качество)
  # - all-minilm:latest (384 dimensions, быстрая)
  default_embedding_model: "mxbai-embed-large:latest"
  
  # Настройки кеширования списка моделей
  cache:
    enabled: true
    ttl: "5m"
    refresh_interval: "1m"
  
  # Model Preloading & Warming (Version 1.12.1+)
  # Устраняет cold start задержку при первом запросе
  preload:
    enabled: false  # Включить preloading
    on_startup: false  # Загружать модели при старте сервера
    keep_warm: false  # Поддерживать модели в горячем состоянии
    
    # Модели для preload (добавь нужные модели)
    models:
      - "llama3.2:3b"
      # - "qwen2.5:latest"
      # - "mxbai-embed-large:latest"
    
    # Health check interval для keep-alive
    health_check_interval: "5m"
    
    # Warm-up prompt для загрузки модели
    warm_up_prompt: "Hello"
    
    # Максимальное количество загруженных моделей (0 = без ограничений)
    max_loaded_models: 3
    
    # Выгружать модель если не использовалась N времени (0 = никогда)
    unload_after: "30m"
    
    # Timeout для загрузки одной модели (важно для больших моделей вроде 33B)
    load_timeout: "5m"

# 💬 ПРОМПТЫ И СИСТЕМНЫЕ СООБЩЕНИЯ
prompts:
  # Дополнительное системное сообщение, автоматически добавляемое ко всем запросам
  # Используется для настройки поведения модели (язык ответа, стиль общения и т.д.)
  additional_system_message: |
    ВАЖНО: Всегда отвечай на русском языке, независимо от языка запроса пользователя.
    Используй простой и понятный стиль общения.
  
  # Добавлять в начало system message (true) или в конец (false)
  prepend_to_system: false

tools:
  # Автоматически применять tool_choice: "required" для всех запросов с tools
  # Когда true, модель ОБЯЗАНА вызывать функции вместо текстового ответа
  # ⚠️ ОТКЛЮЧЕНО: Текстовый промпт сбивает модели с толку и вызывает зависания
  force_usage: false  # ⬅️ Отключено из-за конфликтов с native tool API
  
  # Значение tool_choice по умолчанию если клиент не указал
  # auto = модель решает, required = обязательный вызов, none = не использовать
  default_choice: "auto"
  
  # 🔧 TOOL-AWARE MODEL ROUTING 🔧
  # Автоматическое переключение на модель с лучшей поддержкой function calling
  # Когда указана и в запросе есть tools, запрос автоматически перенаправляется на эту модель
  # 
  # Рекомендуемые варианты для RTX 4090:
  #   1. devstral-64k (создать) - 14GB, стабильный tool calling, 64k контекст
  #   2. gpt-oss-c32k:latest ✅ - 13GB, reasoning + tools, 32k контекст
  #   3. llama3.1-64k (создать) - 5GB, легкий, 64k контекст
  #
  # Для основной работы:
  #   - Запрос БЕЗ tools → qwen3-coder-30b-c32k:latest ✅ (18GB, 32k контекст)
  #   - Запрос С tools → используется fallback_model ниже
  #
  # Оставьте пустым "" чтобы отключить автопереключение
  fallback_model: ""  # ⬅️ Уже с 32k контекстом, reasoning помогает с tools
  
    # 🎯 SMART PROMPT OPTIMIZER - адаптация сложных промптов для локальных моделей
  optimizer:
    # Включить оптимизацию промптов (рекомендуется для IDE с большими system messages)
    enabled: false  # ⬅️ ВКЛЮЧЕНО
    
    # Упрощать system message убирая избыточные инструкции
    # Сохраняются только критичные секции: Tool Use, Communication
    # РЕЗУЛЬТАТ: Сокращение на 80% (6370 → 1219 символов)
    simplify_system_message: false
    
    # Умная фильтрация tools по релевантности к запросу пользователя
    # ⚠️ ОТКЛЮЧЕНО: Плохо работает с русскими запросами, выбирает не те tools
    smart_tool_filtering: false
    
    # Максимум tools в одном запросе (0 = без лимита)
    # ⚠️ УВЕЛИЧЕНО: devstral может обрабатывать больше tools
    max_tools_per_request: 14
    
    # Дополнительные инструкции для сохранения в system message
    preserve_instructions:
      - "When user asks to find/list/show files, use find_path or list_directory tool."
      - "When user asks to read a file, use read_file tool."
      - "When user asks to edit or create a file, use edit_file tool."
      - "Use grep tool to search code content, not paths."

metrics:
  enabled: true
  prometheus_path: "/metrics"
  
  # Внутренние метрики
  collection:
    enabled: true
    buffer_size: 1000
    flush_interval: "10s"

tui:
  enabled: true
  refresh_rate: "1s"
  theme: "default"
  
  # Настройки экранов
  dashboard:
    charts_history: 100
    auto_refresh: true
  
  request_monitor:
    max_requests: 1000
    auto_scroll: true

development:
  hot_reload: true
  debug_mode: true
  profile_enabled: true
  pprof_enabled: true
  race_detection: true

# 🔍 OBSERVABILITY - Distributed Tracing & Monitoring (Version 1.6.0+)
observability:
  # OpenTelemetry Distributed Tracing
  tracing:
    enabled: false  # Отключено - Jaeger недоступен
    provider: "jaeger"  # Поддержка: "jaeger" или "zipkin"
    service_name: "ollama-proxy"
    sampling_rate: 1.0  # 1.0 = 100% traces, 0.1 = 10% traces
    
    # Jaeger configuration (если provider = "jaeger")
    jaeger:
      endpoint: "http://localhost:4318"
    
    # Zipkin configuration (если provider = "zipkin")
    zipkin:
      endpoint: "http://localhost:9411/api/v2/spans"
  
  # Performance Monitoring (Version 1.6.2+)
  performance:
    enabled: true  # Отключено по умолчанию для development
    collection_interval: "30s"  # Как часто собирать метрики
    memory_threshold_mb: 1024  # Alert если heap > 1GB
    goroutine_threshold: 1000  # Alert если goroutines > 1000
    slow_request_threshold: "5s"  # Log requests медленнее 5 секунд
    gc_percentage: 100  # GOGC value (default: 100)
    leak_detection: true  # Включить leak detection
    pprof_enabled: true  # Включить pprof endpoints (/debug/pprof)

# ══════════════════════════════════════════════════════════════════════════════
# FILE STORAGE CONFIGURATION (Version 1.10.0+)
# ══════════════════════════════════════════════════════════════════════════════
file_storage:
  backend: "local"  # "local" или "s3"
  
  # Local filesystem storage
  local:
    base_path: "./data/files"
    max_file_size: "100MB"  # Максимальный размер одного файла
    max_total_size: "10GB"   # Максимальный размер всех файлов пользователя
    allowed_extensions:
      - ".pdf"
      - ".docx"
      - ".doc"
      - ".txt"
      - ".csv"
      - ".xlsx"
      - ".xls"
      - ".md"
      - ".rtf"
    scan_viruses: false  # ClamAV integration (future)
    validate_content: true  # Проверка magic number
  
  # S3-compatible storage (MinIO K8S NodePort)
  s3:
    endpoint: "http://192.168.1.101:30900"
    bucket: "user-files"
    access_key: "minioadmin"
    secret_key: "minioadmin123"
    use_ssl: false
    region: "us-east-1"
    public_bucket: "public-files"
    signed_url_expiry: "1h"
    max_file_size: "500MB"

# ══════════════════════════════════════════════════════════════════════════════
# DOCUMENT EXTRACTORS CONFIGURATION (Version 1.10.0+)
# ══════════════════════════════════════════════════════════════════════════════
extractors:
  # PDF extraction
  pdf:
    method: "auto"  # "auto", "pdftotext", "go-pdf" (auto выбирает лучший доступный)
    preserve_layout: false
    extract_images: false  # Для будущей IMAGE-01 интеграции
    ocr_enabled: false     # Для отсканированных PDF (future)
    max_pages: 1000
  
  # DOCX extraction
  docx:
    extract_tables: true
    extract_images: false
    extract_comments: false
  
  # Text files
  text:
    max_size: "10MB"
    encoding: "utf-8"
    fallback_encodings:
      - "windows-1251"
      - "iso-8859-1"
  
  # CSV files
  csv:
    delimiter: ","
    max_rows: 100000
    encoding: "utf-8"
    auto_detect_delimiter: true
  
  # General settings
  timeout: "30s"  # Таймаут на extraction одного файла
  parallel_workers: 4  # Количество воркеров для batch processing

# ================================================================================
# Web Fetch Configuration (Version 1.10.4+)
# ================================================================================
web_fetch:
  enabled: true
  timeout: "30s"
  
  # Security (SSRF protection)
  block_private_ips: true
  block_localhost: true
  allowed_domains: []  # Empty = all domains allowed
  blocked_domains: []  # Blacklist specific domains
  
  # Rate limiting
  rate_limit_enabled: true
  default_requests_per_min: 10
  
  # Cache
  cache_enabled: true
  cache_ttl: "1h"  # How long to cache fetched pages

# 📚 RAG SYSTEM - Retrieval-Augmented Generation (Version 1.13.0+)
rag:
  enabled: true  # Включить RAG систему (K8S PostgreSQL + pgvector)
  
  # Vector Store Configuration (K8S PostgreSQL NodePort)
  vector_store:
    type: "pgvector"  # Только pgvector поддерживается
    connection_string: "postgres://proxy_user:secure_password_change_me@192.168.1.101:32316/ollama_proxy?sslmode=disable"
    dimensions: 1024  # Размерность embeddings (зависит от модели: mxbai-embed-large)
    distance_metric: "cosine"  # cosine, l2, dot_product
    hnsw_ef_construction: 200
    hnsw_m: 16
  
  # File Storage for uploaded documents (K8S MinIO)
  file_storage:
    type: "s3"  # local или s3 (используем MinIO K8S)
    s3_endpoint: "http://192.168.1.101:30900"
    s3_bucket: "rag-documents"
    s3_access_key: "minioadmin"
    s3_secret_key: "minioadmin123"
    local_path: "./data/rag_files"  # Fallback для local type
    max_file_size: "100MB"
  
  # Embeddings Configuration
  embeddings:
    provider: "yzma"
    model: "mxbai-embed-large"  # или nomic-embed-text
    batch_size: 32
    timeout: "30s"
  
  # Processing Configuration
  processing:
    workers: 4  # Количество worker threads для обработки
    queue_size: 100
    chunk_size: 512  # Размер чанков в токенах
    chunk_overlap: 50  # Перекрытие между чанками
    splitter_type: "semantic"  # semantic или simple
  
  # Retrieval Configuration
  retrieval:
    default_top_k: 5  # Количество chunks для retrieval
    max_top_k: 20
    min_similarity_score: 0.7  # Минимальный similarity score
    rerank_enabled: true
  
  # Job Queue Configuration
  queue:
    type: "postgres"  # postgres или memory
    cleanup_interval: "1h"
    max_retries: 3
    visibility_timeout: "5m"
  
  # Security Configuration
  security:
    encryption_key: "12345678901234567890123456789012"  # 32 bytes для AES-256 (замените в production!)
    credentials_encryption_enabled: true

# Model Registry System Configuration (Version 2.3.0+: REGISTRY-01)
# v3.0.6+: DISABLED for YZMA backend (uses its own model management)
model_registry:
  enabled: false  # Отключено - YZMA использует свою систему управления моделями
  
  # Auto-Discovery Configuration
  auto_discovery:
    enabled: false  # Отключено для YZMA (не нужен Ollama discovery)
    interval: "30m"  # Интервал между повторными auto-discovery (0 = только при старте)
  
  # Provider Health Check
  health_check:
    enabled: false  # Отключено для YZMA
    interval: "5m"  # Интервал между health checks

# ================================================================================
# Agentic AI Configuration (Version 2.5.0+: AGENT-01)
# ================================================================================
agent:
  enabled: true  # Включить Agent систему
  
  # Planning Model Configuration
  # ⚠️ ВАЖНО: Модель должна поддерживать structured JSON output для planning
  plan_model: "llama3.2:3b"  # Модель для task planning и reasoning
  
  # Recommended Models (в порядке приоритета):
  # 1. qwen2.5:7b     - ✅ Лучшая для JSON generation и reasoning (РЕКОМЕНДУЕТСЯ)
  # 2. llama3.2:3b    - ✅ Хороший баланс скорость/качество
  # 3. mistral:7b     - ✅ Стабильная для structured output
  # 4. deepseek-r1:1.5b - ⚠️ Может давать некорректный JSON (не рекомендуется)
  
  # Reasoning Configuration
  reasoning:
    max_iterations: 10  # Максимальное количество ReAct loop iterations
    temperature: 0.3  # Низкая temperature для deterministic reasoning
    top_p: 0.9
    num_predict: 512  # Ограничение длины response для faster iterations
    timeout: "120s"  # Таймаут на одну reasoning operation
  
  # Tool Configuration
  tools:
    enabled: true
    base_dir: "."  # Базовая директория для file operations (security boundary)
    
    # File Tools
    file:
      read_enabled: true
      write_enabled: true
      delete_enabled: true
      list_enabled: true
      max_file_size: "10MB"
    
    # Terminal Tools
    terminal:
      enabled: false  # ⚠️ ОПАСНО: включать только в trusted environments
      allowed_commands: []  # Whitelist команд (empty = all allowed if enabled)
    
    # MCP Tools (Model Context Protocol)
    mcp:
      enabled: true
      discovery_interval: "5m"  # Интервал поиска новых MCP servers
  
  # Safety & Approval Configuration
  safety:
    approval_required: true  # Требовать одобрение для dangerous operations
    dangerous_operations:
      - "file.delete"
      - "file.write"
      - "terminal.execute"
    
    # Auto-approve for safe operations
    auto_approve_safe: true
    safe_operations:
      - "file.read"
      - "file.list"
  
  # Loop Detection
  loop_detection:
    enabled: true
    max_identical_actions: 2  # Trigger completion после N одинаковых действий
  
  # Event Streaming
  streaming:
    enabled: true  # WebSocket streaming для real-time updates
    buffer_size: 100  # Размер буфера для events

