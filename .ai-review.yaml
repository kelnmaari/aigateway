# ==============================================================================
# AI Review Configuration для Ollama-OpenAI Proxy Project
# ==============================================================================
# 
# Это пример конфигурации для AI code review через ваш Ollama-OpenAI Proxy.
# 
# Использование:
#   1. Скопируйте этот файл: cp .ai-review.yaml.example .ai-review.yaml
#   2. Настройте параметры ниже под ваше окружение
#   3. Закоммитьте .ai-review.yaml в репозиторий
# 
# Документация: docs/AI_REVIEW_SETUP.md
# ==============================================================================

# ------------------------------------------------------------------------------
# LLM Configuration - Ollama через ваш Proxy
# ------------------------------------------------------------------------------
llm:
  provider: OPENAI  # Proxy совместим с OpenAI API, оставляем OPENAI
  
  meta:
    # Рекомендуемые модели для Go code review:
    # - qwen2.5-coder:7b     (оптимальный баланс скорость/качество)
    # - deepseek-coder:6.7b  (хорошее качество)
    # - deepseek-coder:33b   (максимальное качество, медленно)
    model: qdeepseek-coder:33b
    
    # Параметры генерации
    max_tokens: 128000      # Достаточно для большинства MR
    temperature: 0.3       # Низкая temperature = более детерминированный output
    
    # Опционально: дополнительные параметры Ollama
    # top_p: 0.9
    # top_k: 40
    # repeat_penalty: 1.1
    # num_ctx: 8192        # Context window size
  
  http_client:
    # ⚠️ ВАЖНО: Замените на URL вашего proxy
    # Примеры:
    #   - http://10.0.0.5:8080/v1
    #   - http://ollama-proxy.internal:8080/v1
    #   - https://ollama.company.com/v1
    api_url: ${LLM_API_URL:-http://176.53.180.178:8085/v1}
    
    # API ключ для proxy (создайте в WebUI)
    # Используйте env variable для безопасности
    api_token: ${OLLAMA_PROXY_API_KEY}
    
    # Таймаут (увеличен для локальных моделей)
    timeout: 3000  # 50 минут

# ------------------------------------------------------------------------------
# VCS Configuration - GitLab
# ------------------------------------------------------------------------------
vcs:
  provider: GITLAB
  
  pipeline:
    # Эти переменные автоматически доступны в GitLab CI
    project_id: ${CI_PROJECT_ID}
    merge_request_id: ${CI_MERGE_REQUEST_IID}
  
  http_client:
    api_url: ${CI_SERVER_URL:-https://gitlab.alexue4.dev}
    api_token: ${CI_JOB_TOKEN}
    timeout: 120

# ------------------------------------------------------------------------------
# Review Policy - Что анализировать
# ------------------------------------------------------------------------------
policy:
  # Включить только Go файлы и важные конфиги
  include:
    - "**/*.go"
    - "*.yaml"
    - "*.yml"
    - "Dockerfile"
    - "go.mod"
  
  # Исключить тесты, vendor, generated код
  exclude:
    - "**/*_test.go"           # Тесты
    - "**/vendor/**"           # Vendor зависимости
    - "**/testdata/**"         # Test fixtures
    - "**/*.pb.go"             # Protobuf generated
    - "**/*_gen.go"            # Generated code
    - "**/bin/**"              # Binaries
    - "**/dist/**"             # Distribution
    - "**/data/**"             # Data files
    - "**/logs/**"             # Log files
    - "**/.git/**"             # Git files
    - "**/node_modules/**"     # Node (для WebUI если есть)
    - "**/web/assets/**"       # Static assets
    - "**/docs/**"             # Документация (опционально)
    - "**/BACKLOG/**"          # Backlog документы
  
  # Максимальный размер файла для анализа
  max_file_size: 150000  # 150 KB (большие файлы пропускаем)
  
  # Максимальное количество файлов в одном review
  # ⚠️ ВАЖНО: Большие модели (deepseek-coder:33b) не справляются с 15+ файлами (timeout)
  # Рекомендации:
  #   - deepseek-coder:6.7b   → max 10-15 файлов
  #   - qwen2.5-coder:7b      → max 15-20 файлов
  #   - deepseek-coder:33b    → max 5-10 файлов (медленная!)
  max_files: 10  # Ограничено для производительности и стабильности

# ------------------------------------------------------------------------------
# Modes Configuration
# ------------------------------------------------------------------------------
modes:
  # Inline comments - построчные комментарии к коду
  inline:
    enabled: true
    max_comments: 30  # Ограничение чтобы не заспамить MR
    min_severity: low  # low | medium | high
  
  # Summary comment - общий обзор изменений
  summary:
    enabled: true
    include_statistics: true
    include_recommendations: true
  
  # Context review - анализ архитектурного контекста
  context:
    enabled: true
    analyze_dependencies: true
    check_breaking_changes: true

# ------------------------------------------------------------------------------
# Prompts Customization - Специфично для Go проекта
# ------------------------------------------------------------------------------
prompts:
  # Inline review prompt
  inline: |
    You are an expert Go code reviewer for Ollama-OpenAI Proxy project.
    
    Review this code change and identify issues in these categories:
    
    🔴 CRITICAL (must fix before merge):
    - Goroutine leaks (missing context cancellation, WaitGroup.Done)
    - Race conditions (concurrent access without synchronization)
    - SQL injection vulnerabilities
    - Path traversal vulnerabilities
    - Unhandled errors (especially in defer, goroutines, handlers)
    - Resource leaks (unclosed connections, files)
    - API key security issues
    
    🟡 IMPORTANT (should fix):
    - False sharing in concurrent structures (check cache line padding)
    - Inefficient database queries (N+1, missing indexes)
    - Missing context usage or wrong context
    - Poor error handling (errors not wrapped with %w)
    - Performance issues (unnecessary allocations, blocking in hot path)
    - Breaking changes in public APIs
    
    💡 SUGGESTIONS (nice to have):
    - Code organization improvements
    - Better naming conventions
    - Additional validation
    - Optimization opportunities
    
    Project-specific checks:
    - OpenAI API compatibility maintained
    - Consistency with existing storage interfaces
    - Proper use of middleware chain
    - Configuration validation
    - Database migration if schema changed
    
    Language: Russian
    Format: Be concise, provide line numbers, suggest fixes with code examples.
    Only comment on real issues, skip style preferences unless critical.
  
  # Summary review prompt
  summary: |
    Provide a comprehensive Go code review summary in Russian.
    
    Structure:
    
    ## Общая оценка
    - Качество кода: ⭐⭐⭐⭐⭐ (1-5 звезд)
    - Готовность к merge: ✅ READY / ⚠️ CONDITIONAL / ❌ NEEDS WORK
    
    ## Критичные проблемы (блокируют merge)
    - [Список проблем с ссылками на строки]
    
    ## Важные замечания (должны быть исправлены)
    - [Список проблем]
    
    ## Предложения по улучшению
    - [Опциональные улучшения]
    
    ## Что сделано хорошо ✅
    - [Положительные моменты]
    
    ## Чек-лист
    - [ ] Тесты добавлены/обновлены
    - [ ] OpenAI API совместимость сохранена
    - [ ] Конфигурация обратно совместима
    - [ ] Миграция БД если нужна
    - [ ] Документация обновлена
    - [ ] Нет breaking changes
    
    ## Влияние изменений
    - Security impact: [оценка]
    - Performance impact: [оценка]
    - Breaking changes: [да/нет]
    
    Be constructive and educational. Focus on helping improve the code.
  
  # Context review prompt
  context: |
    Analyze the architectural impact of these changes (Russian).
    
    Review:
    1. **Архитектура**: Соответствие существующим паттернам проекта
    2. **Зависимости**: Новые зависимости оправданы?
    3. **Интерфейсы**: Изменения в публичных API
    4. **Тестируемость**: Легко ли покрыть тестами?
    5. **Масштабируемость**: Как поведет себя под нагрузкой?
    6. **Поддерживаемость**: Легко ли будет поддерживать?
    
    Provide high-level insights, not line-by-line review.

# ------------------------------------------------------------------------------
# Artifacts - Сохранение результатов review
# ------------------------------------------------------------------------------
artifacts:
  enabled: true
  output_dir: .ai-review-artifacts
  
  # Форматы вывода
  formats:
    - json      # Машиночитаемый
    - markdown  # Человекочитаемый
  
  # Сохранять промежуточные данные для отладки
  save_intermediate: false

# ------------------------------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------------------------------
logging:
  level: INFO  # DEBUG | INFO | WARNING | ERROR
  format: structured  # structured | plain
  
  # Логировать запросы к LLM (для отладки)
  log_llm_requests: false
  log_llm_responses: false

# ------------------------------------------------------------------------------
# Performance Tuning
# ------------------------------------------------------------------------------
performance:
  # Параллельная обработка файлов
  max_concurrent_reviews: 5
  
  # Кеширование (опционально)
  cache:
    enabled: false
    ttl: 3600  # 1 час
  
  # Retry настройки для LLM запросов
  retry:
    max_attempts: 3
    backoff_multiplier: 2
    initial_delay: 1

# ------------------------------------------------------------------------------
# Advanced Options
# ------------------------------------------------------------------------------
advanced:
  # Включить experimental features
  experimental:
    enabled: false
  
  # Детальная диагностика
  debug:
    enabled: false
    save_prompts: false
    save_raw_responses: false

# ==============================================================================
# NOTES:
# ==============================================================================
# 
# 1. Переменные окружения имеют приоритет над этим файлом
#    Например: LLM__META__MODEL переопределит llm.meta.model
# 
# 2. В GitLab CI используйте переменные формата:
#    LLM__PROVIDER: "OPENAI"
#    LLM__META__MODEL: "qwen2.5-coder:7b"
# 
# 3. API ключ НИКОГДА не храните в этом файле
#    Используйте GitLab CI/CD Variables
# 
# 4. Для разных окружений создайте отдельные конфиги:
#    - .ai-review.yaml (development)
#    - .ai-review.production.yaml (production)
# 
# 5. Тестирование конфигурации:
#    ai-review validate-config
# 
# ==============================================================================

