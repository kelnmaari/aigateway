<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Log - Ollama-OpenAI Proxy Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .back-link {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            transition: background 0.3s;
        }

        .back-link:hover {
            background: rgba(255,255,255,0.3);
        }

        .content {
            padding: 30px;
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card.critical {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
        }

        .stat-card.warning {
            background: linear-gradient(135deg, #feca57 0%, #ff9ff3 100%);
        }

        .stat-card.info {
            background: linear-gradient(135deg, #48dbfb 0%, #0abde3 100%);
            color: white;
        }

        .stat-card h3 {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
        }

        /* Filters Section */
        .filters {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .filters h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 13px;
            font-weight: 500;
            color: #666;
            margin-bottom: 5px;
        }

        .filter-group select,
        .filter-group input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-export {
            background: #28a745;
            color: white;
        }

        .btn-export:hover {
            background: #218838;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .severity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .severity-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .severity-warning {
            background: #fff3cd;
            color: #856404;
        }

        .severity-critical {
            background: #f8d7da;
            color: #721c24;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
        }

        .status-failure {
            background: #f8d7da;
            color: #721c24;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }

        .pagination-info {
            color: #666;
            font-size: 14px;
        }

        .pagination-controls {
            display: flex;
            gap: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Audit Log</h1>
            <a href="/web/admin.html" class="back-link">← Back to Admin</a>
        </div>

        <div class="content">
            <!-- Stats Section -->
            <div class="stats-grid" id="stats-grid">
                <div class="stat-card critical">
                    <h3>Critical Events</h3>
                    <div class="value" id="stat-critical">-</div>
                </div>
                <div class="stat-card warning">
                    <h3>Warning Events</h3>
                    <div class="value" id="stat-warning">-</div>
                </div>
                <div class="stat-card info">
                    <h3>Info Events</h3>
                    <div class="value" id="stat-info">-</div>
                </div>
                <div class="stat-card">
                    <h3>Failed Logins (24h)</h3>
                    <div class="value" id="stat-failed-logins">-</div>
                </div>
            </div>

            <!-- Filters Section -->
            <div class="filters">
                <h3>Filters</h3>
                <div class="filter-row">
                    <div class="filter-group">
                        <label for="filter-event-type">Event Type</label>
                        <select id="filter-event-type">
                            <option value="">All Events</option>
                            <option value="LOGIN_SUCCESS">Login Success</option>
                            <option value="LOGIN_FAILED">Login Failed</option>
                            <option value="LOGOUT">Logout</option>
                            <option value="OIDC_LOGIN">OIDC Login</option>
                            <option value="LDAP_LOGIN">LDAP Login</option>
                            <option value="PASSWORD_CHANGED">Password Changed</option>
                            <option value="PERMISSION_DENIED">Permission Denied</option>
                            <option value="ROLE_CHANGED">Role Changed</option>
                            <option value="API_KEY_CREATED">API Key Created</option>
                            <option value="API_KEY_DELETED">API Key Deleted</option>
                            <option value="API_KEY_REVOKED">API Key Revoked</option>
                            <option value="TENANT_CREATED">Tenant Created</option>
                            <option value="TENANT_DELETED">Tenant Deleted</option>
                            <option value="TENANT_MEMBER_ADDED">Tenant Member Added</option>
                            <option value="TENANT_MEMBER_REMOVED">Tenant Member Removed</option>
                            <option value="USER_CREATED">User Created</option>
                            <option value="USER_DELETED">User Deleted</option>
                            <option value="BACKUP_CREATED">Backup Created</option>
                            <option value="BACKUP_RESTORED">Backup Restored</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="filter-severity">Severity</label>
                        <select id="filter-severity">
                            <option value="">All Severities</option>
                            <option value="info">Info</option>
                            <option value="warning">Warning</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="filter-resource">Resource</label>
                        <select id="filter-resource">
                            <option value="">All Resources</option>
                            <option value="authentication">Authentication</option>
                            <option value="user">User</option>
                            <option value="tenant">Tenant</option>
                            <option value="api_key">API Key</option>
                            <option value="backup">Backup</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="filter-status">Status</label>
                        <select id="filter-status">
                            <option value="">All</option>
                            <option value="success">Success</option>
                            <option value="failure">Failure</option>
                        </select>
                    </div>
                </div>

                <div class="filter-row">
                    <div class="filter-group">
                        <label for="filter-from-date">From Date</label>
                        <input type="date" id="filter-from-date">
                    </div>

                    <div class="filter-group">
                        <label for="filter-to-date">To Date</label>
                        <input type="date" id="filter-to-date">
                    </div>

                    <div class="filter-group">
                        <label for="filter-actor-id">Actor ID</label>
                        <input type="text" id="filter-actor-id" placeholder="User ID or API Key">
                    </div>
                </div>

                <div class="filter-actions">
                    <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
                    <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
                    <button class="btn btn-export" onclick="exportToCSV()">Export to CSV</button>
                </div>
            </div>

            <!-- Error Display -->
            <div id="error-message" class="error" style="display: none;"></div>

            <!-- Audit Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Event Type</th>
                            <th>Severity</th>
                            <th>Actor</th>
                            <th>Action</th>
                            <th>Resource</th>
                            <th>Status</th>
                            <th>IP Address</th>
                        </tr>
                    </thead>
                    <tbody id="audit-table-body">
                        <tr>
                            <td colspan="8" class="loading">Loading audit events...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <div class="pagination-info" id="pagination-info">
                    Showing 0 of 0 events
                </div>
                <div class="pagination-controls">
                    <button class="btn btn-secondary" onclick="previousPage()" id="btn-prev">Previous</button>
                    <button class="btn btn-secondary" onclick="nextPage()" id="btn-next">Next</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentOffset = 0;
        const limit = 50;
        let totalEvents = 0;

        // Load stats on page load
        loadStats();
        loadAuditEvents();

        async function loadStats() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/admin/audit/stats', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load stats');
                }

                const data = await response.json();
                
                document.getElementById('stat-critical').textContent = data.stats.by_severity.critical;
                document.getElementById('stat-warning').textContent = data.stats.by_severity.warning;
                document.getElementById('stat-info').textContent = data.stats.by_severity.info;
                document.getElementById('stat-failed-logins').textContent = data.stats.security_events.failed_logins;
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        async function loadAuditEvents() {
            try {
                const token = localStorage.getItem('token');
                
                // Build query string
                const params = new URLSearchParams();
                params.append('limit', limit);
                params.append('offset', currentOffset);

                // Add filters
                const eventType = document.getElementById('filter-event-type').value;
                if (eventType) params.append('event_type', eventType);

                const severity = document.getElementById('filter-severity').value;
                if (severity) params.append('severity', severity);

                const resource = document.getElementById('filter-resource').value;
                if (resource) params.append('resource', resource);

                const status = document.getElementById('filter-status').value;
                if (status) params.append('status', status);

                const fromDate = document.getElementById('filter-from-date').value;
                if (fromDate) params.append('from_date', fromDate);

                const toDate = document.getElementById('filter-to-date').value;
                if (toDate) params.append('to_date', toDate);

                const actorID = document.getElementById('filter-actor-id').value;
                if (actorID) params.append('actor_id', actorID);

                const response = await fetch(`/api/admin/audit?${params.toString()}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load audit events');
                }

                const data = await response.json();
                totalEvents = data.total;

                displayAuditEvents(data.events);
                updatePagination();
                hideError();
            } catch (error) {
                console.error('Failed to load audit events:', error);
                showError('Failed to load audit events. Please try again.');
            }
        }

        function displayAuditEvents(events) {
            const tbody = document.getElementById('audit-table-body');
            
            if (!events || events.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-state">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            <p>No audit events found</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = events.map(event => `
                <tr>
                    <td>${new Date(event.timestamp).toLocaleString()}</td>
                    <td>${event.event_type}</td>
                    <td><span class="severity-badge severity-${event.severity}">${event.severity}</span></td>
                    <td title="${event.actor_id}">${event.actor_id.substring(0, 8)}...</td>
                    <td>${event.action}</td>
                    <td>${event.resource}</td>
                    <td><span class="status-badge status-${event.status}">${event.status}</span></td>
                    <td>${event.ip_address}</td>
                </tr>
            `).join('');
        }

        function updatePagination() {
            const start = currentOffset + 1;
            const end = Math.min(currentOffset + limit, totalEvents);
            
            document.getElementById('pagination-info').textContent = 
                `Showing ${start}-${end} of ${totalEvents} events`;

            document.getElementById('btn-prev').disabled = currentOffset === 0;
            document.getElementById('btn-next').disabled = end >= totalEvents;
        }

        function applyFilters() {
            currentOffset = 0;
            loadAuditEvents();
        }

        function resetFilters() {
            document.getElementById('filter-event-type').value = '';
            document.getElementById('filter-severity').value = '';
            document.getElementById('filter-resource').value = '';
            document.getElementById('filter-status').value = '';
            document.getElementById('filter-from-date').value = '';
            document.getElementById('filter-to-date').value = '';
            document.getElementById('filter-actor-id').value = '';
            currentOffset = 0;
            loadAuditEvents();
        }

        function previousPage() {
            if (currentOffset > 0) {
                currentOffset -= limit;
                loadAuditEvents();
            }
        }

        function nextPage() {
            if (currentOffset + limit < totalEvents) {
                currentOffset += limit;
                loadAuditEvents();
            }
        }

        async function exportToCSV() {
            try {
                const token = localStorage.getItem('token');
                
                // Build query string (same as current filters)
                const params = new URLSearchParams();

                const eventType = document.getElementById('filter-event-type').value;
                if (eventType) params.append('event_type', eventType);

                const severity = document.getElementById('filter-severity').value;
                if (severity) params.append('severity', severity);

                const resource = document.getElementById('filter-resource').value;
                if (resource) params.append('resource', resource);

                const status = document.getElementById('filter-status').value;
                if (status) params.append('status', status);

                const fromDate = document.getElementById('filter-from-date').value;
                if (fromDate) params.append('from_date', fromDate);

                const toDate = document.getElementById('filter-to-date').value;
                if (toDate) params.append('to_date', toDate);

                const actorID = document.getElementById('filter-actor-id').value;
                if (actorID) params.append('actor_id', actorID);

                // Download CSV
                const response = await fetch(`/api/admin/audit/export?${params.toString()}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to export audit log');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `audit_log_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Failed to export audit log:', error);
                showError('Failed to export audit log. Please try again.');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }
    </script>
</body>
</html>
