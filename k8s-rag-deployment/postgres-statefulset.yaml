---
# ConfigMap с init скриптами для PostgreSQL
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: rag-infrastructure
data:
  01-init.sql: |
    -- Enable pgvector extension
    CREATE EXTENSION IF NOT EXISTS vector;
    
    -- Создание таблиц для RAG
    CREATE TABLE IF NOT EXISTS document_embeddings (
      id SERIAL PRIMARY KEY,
      document_id VARCHAR(255) NOT NULL,
      chunk_index INTEGER NOT NULL,
      embedding vector(1536),
      content TEXT,
      metadata JSONB,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      UNIQUE(document_id, chunk_index)
    );
    
    -- Индекс для быстрого поиска по векторам (создастся после добавления данных)
    -- CREATE INDEX document_embeddings_vector_idx 
    --   ON document_embeddings 
    --   USING ivfflat (embedding vector_cosine_ops)
    --   WITH (lists = 100);
    
    -- Индекс для быстрого поиска по document_id
    CREATE INDEX IF NOT EXISTS document_embeddings_document_id_idx 
      ON document_embeddings(document_id);

---
# Secret с паролями
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: rag-infrastructure
type: Opaque
stringData:
  POSTGRES_PASSWORD: secure_password_change_me
  POSTGRES_USER: proxy_user
  POSTGRES_DB: ollama_proxy

---
# Service для PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rag-infrastructure
  labels:
    app: postgres
spec:
  ports:
  - port: 5432
    name: postgres
    targetPort: 5432
  clusterIP: None  # Headless service для StatefulSet
  selector:
    app: postgres

---
# StatefulSet для PostgreSQL + pgvector
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: rag-infrastructure
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        resources:
          limits:
            memory: 4Gi
            cpu: 2000m
          requests:
            memory: 2Gi
            cpu: 1000m
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi

---
# ClusterIP Service для доступа к PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: rag-infrastructure
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres

