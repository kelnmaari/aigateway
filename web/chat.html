<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Ollama Proxy</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/notifications.css">
    <!-- Markdown rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
</head>
<body class="chat-page">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>🤖 Ollama Proxy</h2>
            <button class="btn btn-icon" id="new-chat-btn" title="New Chat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M12 5v14M5 12h14" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>

        <div class="sidebar-content">
            <div id="conversations-list" class="conversations-list">
                <!-- Conversations will be loaded here -->
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="user-info" id="user-info">
                <span id="user-name">Loading...</span>
            </div>
            <button class="btn btn-secondary btn-block" id="logout-btn">
                Logout
            </button>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-main">
        <!-- Chat Header -->
        <header class="chat-header">
            <button class="btn btn-icon" id="sidebar-toggle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 12h18M3 6h18M3 18h18" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            
            <div class="chat-title">
                <h3 id="current-chat-title">New Chat</h3>
            </div>

            <div class="chat-controls">
                <select id="model-select" class="model-select">
                    <option value="">Loading models...</option>
                </select>
            </div>
            
            <div class="chat-nav-links">
                <a href="/dashboard.html" class="nav-link" title="Dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <rect x="3" y="3" width="7" height="7" stroke-width="2"/>
                        <rect x="14" y="3" width="7" height="7" stroke-width="2"/>
                        <rect x="14" y="14" width="7" height="7" stroke-width="2"/>
                        <rect x="3" y="14" width="7" height="7" stroke-width="2"/>
                    </svg>
                    Dashboard
                </a>
                <div id="admin-link-placeholder"></div>
            </div>
        </header>

        <!-- Messages Container -->
        <div class="messages-container" id="messages-container">
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-content">
                    <h1>👋 Welcome to Ollama Proxy</h1>
                    <p>Start a conversation by typing a message below</p>
                    <div class="welcome-features">
                        <div class="feature">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke-width="2"/>
                            </svg>
                            <span>Real-time streaming responses</span>
                        </div>
                        <div class="feature">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke-width="2"/>
                                <path d="M14 2v6h6" stroke-width="2"/>
                            </svg>
                            <span>Markdown & code highlighting</span>
                        </div>
                        <div class="feature">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" stroke-width="2"/>
                            </svg>
                            <span>Save & manage conversations</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="messages-list" class="messages-list">
                <!-- Messages will be appended here -->
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <form id="chat-form" class="chat-form">
                <textarea 
                    id="message-input" 
                    class="message-input"
                    placeholder="Type your message here... (Shift+Enter for new line)"
                    rows="1"
                    required
                ></textarea>
                <button type="submit" class="btn btn-primary send-btn" id="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </div>
    </main>

    <!-- Scripts -->
    <!-- Auth Guard MUST be loaded FIRST to protect the page -->
    <script src="/js/auth-guard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils/notifications.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
