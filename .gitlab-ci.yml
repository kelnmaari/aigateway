# AI Review через Ollama-OpenAI Proxy
# Документация: https://github.com/Nikita-Filonov/ai-review

stages:
  - review

# ============================================================================
# Hidden job: Generate AI Review Config (reusable)
# ============================================================================
.generate-config:
  before_script:
    # Generate .ai-review.yaml from environment variables
    - bash scripts/generate-ai-review-config.sh

# ============================================================================
# Полный AI Review (inline + summary)
# ============================================================================
ai-review:full:
  extends: .generate-config
  stage: review
  image: nikitafilonov/ai-review:latest
  when: manual
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
  script:
    - ai-review run
  variables:
    # =========================================================================
    # LLM Configuration (Ollama через ваш Proxy)
    # =========================================================================
    LLM__PROVIDER: "OPENAI"  # Proxy совместим с OpenAI API
    
    # НАСТРОЙТЕ: URL вашего Ollama-OpenAI Proxy
    # Примеры:
    #   - http://proxy.example.com:8080/v1
    #   - https://ollama-proxy.internal/v1
    #   - http://10.0.0.5:8080/v1
    LLM__HTTP_CLIENT__API_URL: "http://176.53.180.178:8085/v1"
    
    # НАСТРОЙТЕ: API ключ для вашего proxy
    # Создайте переменную в GitLab: Settings → CI/CD → Variables
    LLM__HTTP_CLIENT__API_TOKEN: "$OLLAMA_PROXY_API_KEY"
    
    # НАСТРОЙТЕ: Модель из Ollama
    # 
    # ⚠️ ВАЖНО: AI-review требует модели с хорошей JSON поддержкой!
    # 
    # Рекомендуемые модели (проверены с AI-review):
    #   ✅ deepseek-coder:6.7b    - Хороший JSON, быстрый
    #   ✅ deepseek-coder:33b     - Отличный JSON, медленный (ТЕКУЩАЯ)
    #   ✅ qwen2.5-coder:7b       - Хороший JSON, средний
    #   ✅ qwen2.5-coder:14b      - Отличный JSON, медленный
    #   ⚠️ llama3.2:latest        - Иногда оборачивает JSON в markdown
    #   ❌ НЕ используйте:        - devstral, mistral (markdown wrapper)
    # 
    # См. docs/BUGFIX_AI_REVIEW_COMPATIBILITY.md для деталей
    LLM__META__MODEL: "deepseek-coder:33b"
    
    # Параметры генерации
    LLM__META__MAX_TOKENS: "15000"
    LLM__META__TEMPERATURE: "0.3"
    
    # Таймауты (увеличены для локальных моделей)
    LLM__HTTP_CLIENT__TIMEOUT: "300"  # 5 минут на запрос
    
    # =========================================================================
    # GitLab VCS Configuration
    # =========================================================================
    VCS__PROVIDER: "GITLAB"
    VCS__PIPELINE__PROJECT_ID: "$CI_PROJECT_ID"
    VCS__PIPELINE__MERGE_REQUEST_ID: "$CI_MERGE_REQUEST_IID"
    VCS__HTTP_CLIENT__API_URL: "$CI_SERVER_URL"
    # ВАЖНО: CI_JOB_TOKEN имеет ограниченные права!
    # Используйте Project/Personal Access Token с scope 'api'
    VCS__HTTP_CLIENT__API_TOKEN: "$GITLAB_API_TOKEN"
    VCS__HTTP_CLIENT__TIMEOUT: "120"
    
    # =========================================================================
    # AI Review Policy (Generated Config)
    # =========================================================================
    # Эти переменные используются в scripts/generate-ai-review-config.sh
    AI_REVIEW_MAX_FILES: "10"        # Максимум файлов в одном review
    AI_REVIEW_MAX_FILE_SIZE: "150000" # 150 KB максимальный размер файла
    AI_REVIEW_MAX_COMMENTS: "30"     # Максимум inline комментариев
    # AI_REVIEW_MAX_TOKENS и AI_REVIEW_TEMPERATURE берутся из LLM__META__*
    
  allow_failure: true
  timeout: 30m  # Увеличенный таймаут для больших MR

# ============================================================================
# Только Inline Review (построчные комментарии)
# ============================================================================
ai-review:inline:
  extends: ai-review:full
  script:
    - ai-review run-inline
  timeout: 30m

# ============================================================================
# Только Summary Review (общий комментарий)
# ============================================================================
ai-review:summary:
  extends: ai-review:full
  script:
    - ai-review run-summary
  timeout: 30m

# ============================================================================
# Context Review (анализ архитектуры и контекста)
# ============================================================================
ai-review:context:
  extends: ai-review:full
  script:
    - ai-review run-context
  timeout: 30m

# ============================================================================
# Reply Review (ответ на существующие комментарии)
# ============================================================================
ai-review:inline-reply:
  extends: ai-review:full
  script:
    - ai-review run-inline-reply
  timeout: 30m

ai-review:summary-reply:
  extends: ai-review:full
  script:
    - ai-review run-summary-reply
  timeout: 30m

# ============================================================================
# NOTES:
# ============================================================================
# 
# 1. ОБЯЗАТЕЛЬНО создайте GitLab CI/CD переменные:
#
#    a) OLLAMA_PROXY_API_KEY (для LLM):
#       Settings → CI/CD → Variables → Add Variable
#       Key: OLLAMA_PROXY_API_KEY
#       Value: ваш API ключ из proxy (создается в WebUI)
#       Flags: [✓] Mask variable
#
#    b) GITLAB_API_TOKEN (для GitLab API):
#       Сначала создайте Access Token:
#       - Project Access Token (рекомендуется):
#         Settings → Access Tokens → Add new token
#         Name: ai-review-token
#         Role: Developer (минимум)
#         Scopes: [✓] api, [✓] read_api, [✓] write_repository
#       
#       - ИЛИ Personal Access Token:
#         User Settings → Access Tokens
#         Name: ai-review-pat
#         Scopes: [✓] api, [✓] read_api, [✓] write_repository
#       
#       Затем добавьте в CI/CD Variables:
#       Key: GITLAB_API_TOKEN
#       Value: (скопированный токен)
#       Flags: [✓] Mask variable, [✓] Protect variable
#
# 2. Динамическая конфигурация:
#    
#    .ai-review.yaml генерируется автоматически через:
#      scripts/generate-ai-review-config.sh
#    
#    Переменные для настройки (опционально):
#      - AI_REVIEW_MAX_FILES        - Максимум файлов (default: 10)
#      - AI_REVIEW_MAX_FILE_SIZE    - Размер файла (default: 150000)
#      - AI_REVIEW_MAX_COMMENTS     - Максимум комментариев (default: 30)
#    
#    Пример: Разные настройки для разных размеров MR:
#    
#    ai-review:small-mr:
#      extends: ai-review:full
#      rules:
#        - if: '$CI_MERGE_REQUEST_DIFF_SIZE < 500'  # < 500 строк
#      variables:
#        AI_REVIEW_MAX_FILES: "15"
#        LLM__META__MODEL: "deepseek-coder:6.7b"
#        AI_REVIEW_MAX_COMMENTS: "50"
#    
#    ai-review:large-mr:
#      extends: ai-review:full
#      rules:
#        - if: '$CI_MERGE_REQUEST_DIFF_SIZE >= 500'  # >= 500 строк
#      variables:
#        AI_REVIEW_MAX_FILES: "5"
#        LLM__META__MODEL: "qwen2.5-coder:7b"
#        AI_REVIEW_MAX_COMMENTS: "20"
#      script:
#        - ai-review run-summary  # Только summary для больших MR
#
# 3. Проверьте доступность proxy из GitLab Runner:
#    - Если proxy на localhost - не будет работать (runner в контейнере)
#    - Используйте внешний IP или DNS имя
#    - Убедитесь что firewall разрешает доступ
#
# 4. Доступные модели Ollama можно посмотреть:
#    curl http://YOUR_PROXY_HOST:8080/v1/models \
#      -H "Authorization: Bearer $API_KEY"
#
# 5. Для быстрого тестирования используйте маленькие модели:
#    - qwen2.5-coder:1.5b (быстрая, хорошая для кода)
#    - llama3.2:3b (универсальная)
#
# 6. Для production используйте большие модели:
#    - deepseek-coder:33b (лучшая для кода, но медленная для 15+ файлов)
#    - qwen2.5-coder:7b (хороший баланс)
#
# 7. Jobs запускаются вручную (when: manual)
#    Запуск: MR → Pipelines → ▶️ Play на нужном job
#
# 8. Скрипт генерации конфигурации:
#    scripts/generate-ai-review-config.sh создает .ai-review.yaml
#    автоматически перед каждым review job (.generate-config:before_script)
#
# ============================================================================

