# AI Code Review через Ollama-OpenAI Proxy
# Адаптировано для Go проекта aigateway-desktop

stages:
  - analyze
  - build

variables:
  # Настройки прокси (используйте GitLab CI/CD Variables)
  PROXY_URL: "http://176.53.180.178:8085/v1/chat/completions"
  # PROXY_API_KEY должен быть настроен в Settings → CI/CD → Variables
  
  # Модель для code review
  # Рекомендуемые модели:
  #   🏆 qwen2.5-coder:7b - лучший для Go кода
  #   ⭐ deepseek-coder:6.7b - хороший для анализа
  #   ✅ codellama:7b - универсальный
  REVIEW_MODEL: "gpt-oss-tuned:latest"

# Общие настройки для review jobs (YAML anchor)
.review_base:
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq bash git

# ============================================================================
# AI Code Review для Merge Requests
# ============================================================================

# Job 1: Быстрая проверка последнего коммита (автоматически при push)
analyze_latest_commit:
  extends: .review_base
  stage: analyze
  script:
    - |
      echo "🚀 AI Code Review: Latest Commit (Fast)"
      echo "📥 Fetching latest commit changes..."
      
      # ⚠️ SECURITY: Never echo $API_TOKEN to logs!
      API_TOKEN="${GITLAB_API_TOKEN:-$CI_JOB_TOKEN}"
      DIFF_RAW=$(curl -s --header "PRIVATE-TOKEN: $API_TOKEN" \
        "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/repository/commits/$CI_COMMIT_SHA/diff")
      
      if [ -z "$DIFF_RAW" ] || [ "$DIFF_RAW" = "null" ]; then
        echo "❌ Ошибка: Не удалось получить diff"
        exit 1
      fi
      
      # Извлекаем diff текст (формат зависит от API endpoint)
      # Для коммита: массив объектов diff
      # Для MR: .changes[] с полями
      DIFF_TEXT=$(echo "$DIFF_RAW" | jq -r '
        if type == "array" then
          .[] | "File: \(.new_path // .old_path)\nDiff:\n\(.diff // "No diff")\n---\n"
        else
          .changes[]? | "File: \(.new_path // .old_path)\nStatus: \(.new_file // false | if . then "new" else "modified" end)\nDiff:\n\(.diff // "No diff")\n---\n"
        end' | head -c 100000 || true)
      
      if [ -z "$DIFF_TEXT" ]; then
        echo "⚠️ Diff пустой, пропускаем review"
        exit 0
      fi
      
      echo "📊 Diff size: $(echo "$DIFF_TEXT" | wc -c) bytes"
      
      # Создаем OpenAI-совместимый запрос
      echo "🧠 Отправка в AI модель ($REVIEW_MODEL)..."
      
      SYSTEM_PROMPT="Ты опытный Go разработчик проводящий code review. Проанализируй изменения и дай ТОП-5 замечаний. Укажи файл и строки для каждого замечания. Фокусируйся на безопасность производительность читаемость Go best practices. Игнорируй мелочи. КРАТКИЙ ответ максимум 3000 символов. Формат ответа Markdown с разделами Положительное Замечания Рекомендации. Отвечай на русском языке кратко."
      
      REQUEST_JSON=$(jq -n \
        --arg model "$REVIEW_MODEL" \
        --arg system "$SYSTEM_PROMPT" \
        --arg user "Проанализируй следующий diff:\n\n$DIFF_TEXT" \
        '{
          "model": $model,
          "messages": [
            {"role": "system", "content": $system},
            {"role": "user", "content": $user}
          ],
          "temperature": 0.3,
          "max_tokens": 5000,
          "stream": false
        }')
      
      # Отправляем в прокси
      RESPONSE=$(curl -s -X POST "$PROXY_URL" \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer $PROXY_API_KEY" \
        -d "$REQUEST_JSON")
      
      # Проверяем ошибки
      ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error.message // empty')
      if [ -n "$ERROR_MSG" ]; then
        echo "❌ Ошибка от proxy: $ERROR_MSG"
        exit 1
      fi
      
      # Извлекаем ответ AI
      AI_RESPONSE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
      
      if [ -z "$AI_RESPONSE" ]; then
        echo "❌ Ошибка: пустой ответ от AI"
        echo "Response: $RESPONSE"
        exit 1
      fi
      
      echo "✅ AI analysis completed"
      
      # Создаем MD файл с полным отчетом (безопасное экранирование через jq)
      REPORT_FILE="ai-review-commit-${CI_COMMIT_SHORT_SHA}.md"
      DIFF_SIZE=$(echo "$DIFF_TEXT" | wc -c)
      RESPONSE_SIZE=$(echo "$AI_RESPONSE" | wc -c)
      REPORT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
      
      # Используем printf для безопасного форматирования
      {
        printf "# 🤖 AI Code Review Report (Latest Commit)\n\n"
        printf "**Pipeline ID:** %s\n" "$CI_PIPELINE_ID"
        printf "**Model:** %s\n" "$REVIEW_MODEL"
        printf "**Date:** %s\n" "$REPORT_DATE"
        printf "**Commit:** %s\n\n" "$CI_COMMIT_SHORT_SHA"
        printf -- "---\n\n"
        printf "## 📊 Analysis Summary\n\n"
        printf "**Diff Size:** %s bytes\n" "$DIFF_SIZE"
        printf "**Response Length:** %s characters\n\n" "$RESPONSE_SIZE"
        printf -- "---\n\n"
        printf "## 🔍 AI Review\n\n"
        # AI_RESPONSE через printf %s безопасно экранируется
        printf "%s\n\n" "$AI_RESPONSE"
        printf -- "---\n\n"
        printf "*Generated by Ollama-OpenAI Proxy CI/CD Pipeline*\n"
      } > "$REPORT_FILE"
      
      echo "📄 Report file created: $REPORT_FILE"
      
      # Загружаем файл в GitLab
      echo "📤 Uploading report file to GitLab..."
      UPLOAD_RESULT=$(curl -s --request POST \
        --header "PRIVATE-TOKEN: $API_TOKEN" \
        --form "file=@$REPORT_FILE" \
        "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/uploads")
      
      UPLOAD_MARKDOWN=$(echo "$UPLOAD_RESULT" | jq -r '.markdown // empty')
      UPLOAD_URL=$(echo "$UPLOAD_RESULT" | jq -r '.url // empty')
      
      if [ -n "$UPLOAD_URL" ]; then
        echo "✅ File uploaded: $UPLOAD_URL"
        FULL_REPORT_LINK="[📄 Полный отчет]($CI_SERVER_URL/$CI_PROJECT_PATH$UPLOAD_URL)"
      else
        echo "⚠️ Failed to upload file"
        FULL_REPORT_LINK=""
      fi
      
      # Проверяем длину ответа (GitLab лимит ~64KB на комментарий)
      RESPONSE_LENGTH=$(echo "$AI_RESPONSE" | wc -c)
      echo "📏 Response length: $RESPONSE_LENGTH bytes"
      
      # Если ответ длиннее 60000 символов - разрезаем на части
      MAX_CHUNK_SIZE=50000
      
      if [ "$RESPONSE_LENGTH" -gt "$MAX_CHUNK_SIZE" ]; then
        echo "⚠️ Response too long, splitting into multiple comments..."
        
        # Разрезаем на части по 50KB
        TEMP_FILE=$(mktemp)
        echo "$AI_RESPONSE" > "$TEMP_FILE"
        
        TOTAL_CHUNKS=$(( ($RESPONSE_LENGTH + $MAX_CHUNK_SIZE - 1) / $MAX_CHUNK_SIZE ))
        CHUNK_NUM=1
        
        while [ $CHUNK_NUM -le $TOTAL_CHUNKS ]; do
          CHUNK_START=$(( ($CHUNK_NUM - 1) * $MAX_CHUNK_SIZE ))
          CHUNK_TEXT=$(dd if="$TEMP_FILE" bs=1 skip=$CHUNK_START count=$MAX_CHUNK_SIZE 2>/dev/null || true)
          
          COMMENT_BODY=$(jq -n \
            --arg model "$REVIEW_MODEL" \
            --arg response "$CHUNK_TEXT" \
            --arg pipeline "$CI_PIPELINE_ID" \
            --arg part "$CHUNK_NUM" \
            --arg total "$TOTAL_CHUNKS" \
            --arg report "$FULL_REPORT_LINK" \
            '{body: ("🤖 **AI Code Review** [Part " + $part + "/" + $total + "] (Model: " + $model + ")\n\n" + $response + "\n\n---\n" + $report + " | Pipeline ID: " + $pipeline)}')
          
          echo "💬 Adding comment part $CHUNK_NUM/$TOTAL_CHUNKS..."
          curl -s --request POST \
            --header "PRIVATE-TOKEN: $API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$COMMENT_BODY" \
            "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" > /dev/null
          
          CHUNK_NUM=$(($CHUNK_NUM + 1))
          sleep 1  # Небольшая задержка между комментариями
        done
        
        rm -f "$TEMP_FILE"
        echo "✅ All comment parts added successfully"
      else
        # Ответ влезает в один комментарий
        COMMENT_BODY=$(jq -n \
          --arg model "$REVIEW_MODEL" \
          --arg response "$AI_RESPONSE" \
          --arg pipeline "$CI_PIPELINE_ID" \
          --arg report "$FULL_REPORT_LINK" \
          '{body: ("🤖 **AI Code Review** (Model: " + $model + ")\n\n---\n\n" + $response + "\n\n---\n" + $report + " | *Powered by Ollama-OpenAI Proxy | Review ID: " + $pipeline + "*")}')
        
        echo "💬 Adding comment to MR..."
        COMMENT_RESULT=$(curl -s --request POST \
          --header "PRIVATE-TOKEN: $API_TOKEN" \
          --header "Content-Type: application/json" \
          --data "$COMMENT_BODY" \
          "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes")
        
        COMMENT_ID=$(echo "$COMMENT_RESULT" | jq -r '.id // empty')
        if [ -n "$COMMENT_ID" ]; then
          echo "✅ Comment added successfully (ID: $COMMENT_ID)"
        else
          echo "⚠️ Failed to add comment"
          echo "$COMMENT_RESULT" | jq '.'
        fi
      fi

  artifacts:
    paths:
      - ai-review-commit-*.md
    expire_in: 30 days
    when: always
  rules:
    - if: '$CI_MERGE_REQUEST_IID'  # Только для MR (автоматически)
  allow_failure: true
  timeout: 10m

# Job 2: Полный анализ MR (запускается вручную для детального review)
analyze_full_mr:
  extends: .review_base
  stage: analyze
  script:
    - |
      echo "🔍 AI Code Review: Full MR Analysis (Comprehensive)"
      echo "📥 Fetching FULL MR changes..."
      
      # ⚠️ SECURITY: Never echo $API_TOKEN to logs!
      API_TOKEN="${GITLAB_API_TOKEN:-$CI_JOB_TOKEN}"
      DIFF_RAW=$(curl -s --header "PRIVATE-TOKEN: $API_TOKEN" \
        "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/changes")
      
      if [ -z "$DIFF_RAW" ] || [ "$DIFF_RAW" = "null" ]; then
        echo "❌ Ошибка: Не удалось получить diff"
        exit 1
      fi
      
      # Извлекаем diff текст (до 100KB для полного анализа)
      DIFF_TEXT=$(echo "$DIFF_RAW" | jq -r '
        if type == "array" then
          .[] | "File: \(.new_path // .old_path)\nDiff:\n\(.diff // "No diff")\n---\n"
        else
          .changes[]? | "File: \(.new_path // .old_path)\nStatus: \(.new_file // false | if . then "new" else "modified" end)\nDiff:\n\(.diff // "No diff")\n---\n"
        end' | head -c 100000 || true)
      
      if [ -z "$DIFF_TEXT" ]; then
        echo "⚠️ Diff пустой, пропускаем review"
        exit 0
      fi
      
      echo "📊 Diff size: $(echo "$DIFF_TEXT" | wc -c) bytes"
      
      # Создаем OpenAI-совместимый запрос для ПОЛНОГО анализа
      echo "🧠 Отправка в AI модель ($REVIEW_MODEL) для детального анализа..."
      
      # Более детальный промпт для полного MR
      SYSTEM_PROMPT="Ты опытный Go разработчик проводящий ПОЛНЫЙ code review всего MR. Проанализируй ВСЕ изменения детально и дай исчерпывающий отчет. Укажи файлы и строки для каждого замечания. Фокусируйся на архитектуру безопасность производительность читаемость Go best practices тестирование. Формат ответа Markdown с разделами Архитектура Безопасность Производительность Замечания Рекомендации. Отвечай на русском языке подробно."
      
      REQUEST_JSON=$(jq -n \
        --arg model "$REVIEW_MODEL" \
        --arg system "$SYSTEM_PROMPT" \
        --arg user "Проанализируй следующий полный diff MR:\n\n$DIFF_TEXT" \
        '{
          "model": $model,
          "messages": [
            {"role": "system", "content": $system},
            {"role": "user", "content": $user}
          ],
          "temperature": 0.3,
          "max_tokens": 50000,
          "stream": false
        }')
      
      # Отправляем в прокси
      RESPONSE=$(curl -s -X POST "$PROXY_URL" \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer $PROXY_API_KEY" \
        -d "$REQUEST_JSON")
      
      # Проверяем ошибки
      ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error.message // empty')
      if [ -n "$ERROR_MSG" ]; then
        echo "❌ Ошибка от proxy: $ERROR_MSG"
        exit 1
      fi
      
      # Извлекаем ответ AI
      AI_RESPONSE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
      
      # Debug: показываем usage stats
      PROMPT_TOKENS=$(echo "$RESPONSE" | jq -r '.usage.prompt_tokens // 0')
      COMPLETION_TOKENS=$(echo "$RESPONSE" | jq -r '.usage.completion_tokens // 0')
      echo "📊 Tokens: prompt=$PROMPT_TOKENS, completion=$COMPLETION_TOKENS"
      
      # Проверка на пустой ответ (баг некоторых моделей)
      if [ -z "$AI_RESPONSE" ] || [ "$AI_RESPONSE" = "null" ]; then
        echo "❌ Ошибка: Модель вернула пустой content"
        echo "⚠️  Это может быть баг модели $REVIEW_MODEL"
        echo "💡 Рекомендация: Попробуйте другую модель (qwen2.5-coder:7b, deepseek-coder:6.7b)"
        echo ""
        echo "Debug Response:"
        echo "$RESPONSE" | jq '.'
        
        # Создаем fallback отчет (используем переменные для безопасности)
        AI_RESPONSE="## AI Review Failed

Модель $REVIEW_MODEL вернула пустой ответ.

Debug Info:
- Prompt tokens: $PROMPT_TOKENS
- Completion tokens: $COMPLETION_TOKENS  
- Model: $REVIEW_MODEL

Рекомендации:
1. Попробуйте другую модель в переменной REVIEW_MODEL:
   - qwen2.5-coder:7b (рекомендуется для Go)
   - deepseek-coder:6.7b (быстрая альтернатива)
   - codellama:7b (универсальная)

2. Проверьте что модель загружена: ollama list

3. Проверьте логи Ollama на сервере прокси

Diff Stats:
- Size: $(echo "$DIFF_TEXT" | wc -c) bytes
- Files changed: $(echo "$DIFF_RAW" | jq -r '.changes | length // 0')
"
        echo "⚠️ Создаем fallback report..."
      fi
      
      echo "✅ AI analysis completed"
      
      # Создаем MD файл с полным отчетом
      REPORT_FILE="ai-review-mr-${CI_MERGE_REQUEST_IID}-full.md"
      DIFF_SIZE=$(echo "$DIFF_TEXT" | wc -c)
      RESPONSE_SIZE=$(echo "$AI_RESPONSE" | wc -c)
      REPORT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
      
      {
        printf "# 🔍 AI Code Review Report (Full MR)\n\n"
        printf "**Pipeline ID:** %s\n" "$CI_PIPELINE_ID"
        printf "**Model:** %s\n" "$REVIEW_MODEL"
        printf "**Date:** %s\n" "$REPORT_DATE"
        printf "**MR:** !%s\n\n" "$CI_MERGE_REQUEST_IID"
        printf -- "---\n\n"
        printf "## 📊 Analysis Summary\n\n"
        printf "**Diff Size:** %s bytes\n" "$DIFF_SIZE"
        printf "**Response Length:** %s characters\n"  "$RESPONSE_SIZE"
        printf "**Analysis Type:** Full MR (Comprehensive)\n\n"
        printf -- "---\n\n"
        printf "## 🔍 Detailed AI Review\n\n"
        printf "%s\n\n" "$AI_RESPONSE"
        printf -- "---\n\n"
        printf "*Generated by Ollama-OpenAI Proxy CI/CD Pipeline (Full MR Analysis)*\n"
      } > "$REPORT_FILE"
      
      echo "📄 Report file created: $REPORT_FILE"
      
      # Загружаем файл в GitLab
      echo "📤 Uploading full MR report to GitLab..."
      UPLOAD_RESULT=$(curl -s --request POST \
        --header "PRIVATE-TOKEN: $API_TOKEN" \
        --form "file=@$REPORT_FILE" \
        "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/uploads")
      
      UPLOAD_URL=$(echo "$UPLOAD_RESULT" | jq -r '.url // empty')
      
      if [ -n "$UPLOAD_URL" ]; then
        echo "✅ File uploaded: $UPLOAD_URL"
        FULL_REPORT_LINK="[📄 Полный отчет MR]($CI_SERVER_URL/$CI_PROJECT_PATH$UPLOAD_URL)"
      else
        echo "⚠️ Failed to upload file"
        FULL_REPORT_LINK=""
      fi
      
      # Формируем комментарий (full MR всегда компактный т.к. summarized)
      COMMENT_BODY=$(jq -n \
        --arg model "$REVIEW_MODEL" \
        --arg response "$AI_RESPONSE" \
        --arg pipeline "$CI_PIPELINE_ID" \
        --arg report "$FULL_REPORT_LINK" \
        --arg mr "$CI_MERGE_REQUEST_IID" \
        '{body: ("🔍 **Full MR Analysis** (Model: " + $model + ")\n\n**MR:** !" + $mr + "\n\n---\n\n" + $response + "\n\n---\n" + $report + " | *Pipeline ID: " + $pipeline + "*")}')
      
      echo "💬 Adding full MR review comment..."
      curl -s --request POST \
        --header "PRIVATE-TOKEN: $API_TOKEN" \
        --header "Content-Type: application/json" \
        --data "$COMMENT_BODY" \
        "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" > /dev/null
      
      echo "✅ Full MR review posted successfully"

  artifacts:
    paths:
      - ai-review-mr-*-full.md
    expire_in: 30 days
    when: always
  rules:
    - if: '$CI_MERGE_REQUEST_IID'  # Только для MR
      when: manual  # Запускается вручную
  allow_failure: true
  timeout: 20m  # Больше времени для полного анализа

# ============================================================================
# Go Build (опционально)
# ============================================================================
build:
  stage: build
  image: golang:1.25.3-alpine
  before_script:
    - apk add --no-cache git make
  script:
    - echo "🔨 Building Go project..."
    - make build
  artifacts:
    paths:
      - bin/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'  # Только для main ветки
    - if: '$CI_MERGE_REQUEST_IID'  # И для MR
  allow_failure: false
  timeout: 15m

# ============================================================================
# SETUP INSTRUCTIONS:
# ============================================================================
# 
# 1. Создайте GitLab CI/CD переменные:
#
#    a) PROXY_API_KEY (Required):
#       Settings → CI/CD → Variables → Add Variable
#       Key: PROXY_API_KEY
#       Value: ваш API ключ из Ollama-OpenAI Proxy
#       Flags: [✓] Mask variable, [✓] Protect variable
#
#    b) GITLAB_API_TOKEN (Optional):
#       По умолчанию используется CI_JOB_TOKEN (автоматический).
#       
#       Если CI_JOB_TOKEN не работает (GitLab < 15 или ограниченные права):
#       Создайте Project Access Token:
#         Settings → Access Tokens → Add new token
#         Name: ai-review-token
#         Role: Developer
#         Scopes: [✓] api, [✓] read_api
#       
#       Затем добавьте в CI/CD Variables:
#       Key: GITLAB_API_TOKEN
#       Value: (скопированный токен)
#       Flags: [✓] Mask variable, [✓] Protect variable
#       
#       Для включения расширенных прав CI_JOB_TOKEN (GitLab 15+):
#       Settings → CI/CD → Token Access → 
#         [✓] Limit access to this project
#
# 2. Проверьте доступность прокси:
#    - Proxy URL должен быть доступен из GitLab Runner
#    - Если на localhost - использовать внешний IP
#    - Проверьте firewall правила
#
# 3. Настройка модели (опционально):
#    Измените переменную REVIEW_MODEL на нужную:
#      - qwen2.5-coder:7b (default, лучший для Go)
#      - deepseek-coder:6.7b (быстрый)
#      - codellama:7b (универсальный)
#
# 4. Доступные модели можно проверить:
#    curl http://YOUR_PROXY:8085/v1/models \
#      -H "Authorization: Bearer $API_KEY"
#
# 5. Workflow (Две джобы для разных сценариев):
#
#    🚀 Job 1: analyze_latest_commit (АВТОМАТИЧЕСКИ при каждом push)
#    ──────────────────────────────────────────────────────────────
#    1. Создаете/обновляете MR в GitLab
#    2. Pipeline АВТОМАТИЧЕСКИ запускает analyze_latest_commit
#    3. AI анализирует ТОЛЬКО ПОСЛЕДНИЙ КОММИТ (быстрая проверка)
#    4. Генерируется MD файл: ai-review-commit-{sha}.md
#    5. Краткий ТОП-5 review появляется в комментарии к MR
#    6. Время выполнения: ~1-3 минуты
#
#    🔍 Job 2: analyze_full_mr (ВРУЧНУЮ для детального анализа)
#    ──────────────────────────────────────────────────────────
#    1. Открываете Pipeline в GitLab CI/CD
#    2. ВРУЧНУЮ запускаете analyze_full_mr (кнопка ▶️ Play)
#    3. AI анализирует ВЕСЬ MR целиком (все коммиты)
#    4. Генерируется MD файл: ai-review-mr-{iid}-full.md
#    5. Детальный отчет по архитектуре/безопасности/производительности
#    6. Время выполнения: ~5-10 минут (в зависимости от размера MR)
#
# 6. API Endpoints (различия):
#    - analyze_latest_commit: /repository/commits/{sha}/diff
#    - analyze_full_mr: /merge_requests/{iid}/changes
#
# 7. Prompts (различия):
