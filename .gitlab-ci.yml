# AIGateway (Ollama-OpenAI Proxy) CI/CD Pipeline
# Build, test, and package for Rocky Linux (RPM)

stages:
  - test
  - security
  - build
  - package
  - scripts
  - release

variables:
  # Go configuration
  GO_VERSION: "1.26.1"
  GOPROXY: "https://proxy.golang.org,direct"
  CGO_ENABLED: "0"
  
  # Node.js for WebUI
  NODE_VERSION: "20"
  
  # RPM repository (optional - for publishing)
  # RPM_REPO_URL: "https://your-rpm-repo.example.com"

# Compute version based on context:
# - Tags: version=X.Y.Z, release=1
# - Branches: version=X.Y.Z, release=branch.jobid (RPM-safe format)
.compute_version: &compute_version
  - |
    BASE_VERSION=$(cat VERSION 2>/dev/null || echo "0.0.0")
    if [ -n "$CI_COMMIT_TAG" ]; then
      # Release build from tag
      export RPM_VERSION="${CI_COMMIT_TAG#v}"
      export RPM_RELEASE="1"
      export BUILD_VERSION="${RPM_VERSION}"
    else
      # Branch build: sanitize branch name (replace / and _ with .)
      BRANCH_SAFE=$(echo "$CI_COMMIT_REF_NAME" | tr '/' '.' | tr '_' '.' | tr '-' '.' | cut -c1-20)
      export RPM_VERSION="${BASE_VERSION}"
      export RPM_RELEASE="${BRANCH_SAFE}.${CI_JOB_ID}"
      export BUILD_VERSION="${RPM_VERSION}-${BRANCH_SAFE}-${CI_JOB_ID}"
    fi
    echo "BUILD_VERSION=$BUILD_VERSION"
    echo "RPM_VERSION=$RPM_VERSION"
    echo "RPM_RELEASE=$RPM_RELEASE"

# Cache Go modules and npm packages
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .go/pkg/mod/
    - web-svelte/node_modules/

# ==============================================================================
# TEST STAGE - Split by component (1 component = 1 job)
# ==============================================================================

# Excluded packages (legacy code issues):
#   - internal/auth
#   - internal/circuit
#   - internal/rag
#   - internal/notifications
#   - internal/services/rag
#   - cmd/webui

# Common test configuration template (fast - no race detector)
.test_template: &test_template
  stage: test
  image: golang:${GO_VERSION}
  variables:
    CGO_ENABLED: "0"  # No CGO needed without -race
  before_script:
    - apt-get update && apt-get install -y git
    - mkdir -p .go
    - export GOPATH="$CI_PROJECT_DIR/.go"
    - export PATH="$GOPATH/bin:$PATH"
    - go mod download
  allow_failure: true
  rules:
    # Don't run on tags
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

# Fast tests (parallel, no race detector) - runs on all branches
test:fast:
  <<: *test_template
  script:
    - |
      go test -short \
        ./internal/config/... \
        ./internal/concurrent/... \
        ./internal/types/... \
        ./internal/utils/... \
        ./internal/models/... \
        ./internal/cache/... \
        ./internal/health/... \
        ./internal/settings/... \
        ./cmd/server/... \
        ./cmd/tui/...
  timeout: 5m

# Full tests with race detector - only on MRs to main
test:race:
  stage: test
  image: golang:${GO_VERSION}
  variables:
    CGO_ENABLED: "1"
    GOMAXPROCS: "4"
  before_script:
    - apt-get update && apt-get install -y git gcc
    - mkdir -p .go
    - export GOPATH="$CI_PROJECT_DIR/.go"
    - export PATH="$GOPATH/bin:$PATH"
    - go mod download
  script:
    - |
      go test -race -p 2 \
        ./internal/config/... \
        ./internal/concurrent/... \
        ./internal/types/... \
        ./internal/utils/... \
        ./internal/models/... \
        ./internal/inference/...
  allow_failure: true
  timeout: 10m
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never

# ==============================================================================
# SECURITY STAGE
#
# Two complementary scanners:
#
#  security:trivy      — Aqua Trivy filesystem scan (Go + npm + misconfig).
#                        Outputs SARIF → GitLab Security Dashboard + MR widget.
#                        Covers ALL known CVEs in both ecosystems at once.
#
#  security:govulncheck — Go-specific callgraph-aware scanner (vuln.go.dev).
#                        Reports ONLY vulnerabilities in code paths that are
#                        actually reachable — zero false-positives from unused
#                        transitive deps.
#
# Both jobs use allow_failure: true so CI is non-blocking while the team
# triages findings.  Flip to allow_failure: false once the backlog is clean.
# ==============================================================================

# ── Trivy: broad CVE scan ──────────────────────────────────────────────────
# Scans go.sum + web-svelte/package.json for known CVEs in one pass.
# Outputs:
#   • SARIF  → artifacts.reports.sast  (GitLab Security Dashboard / MR widget)
#   • Table  → stdout (human-readable pipeline log)
#   • JSON   → trivy-report.json (downloadable artifact, CI_JOB_ARTIFACTS)
security:trivy:
  stage: security
  image:
    name: ghcr.io/aquasecurity/trivy:latest
    entrypoint: [""]
  variables:
    # Pull the vuln DB into a cache-friendly path
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivy-cache"
    # Don't fail the job on vuln findings — we collect the report first
    TRIVY_EXIT_CODE: "0"
    # Skip dev/test dependencies (less noise)
    TRIVY_SKIP_DEV_DEPENDENCIES: "true"
  cache:
    key: trivy-db-${CI_COMMIT_REF_SLUG}
    paths:
      - .trivy-cache/
  before_script:
    - mkdir -p .trivy-cache
    # Pre-download the vuln DB so it is cached between runs
    - trivy image --download-db-only --cache-dir .trivy-cache
  script:
    # ── 1. SARIF report for GitLab Security Dashboard ──────────────────────
    - |
      trivy fs \
        --cache-dir .trivy-cache \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --format sarif \
        --output trivy-report.sarif \
        .
    # ── 2. JSON report (full detail, downloadable artifact) ────────────────
    - |
      trivy fs \
        --cache-dir .trivy-cache \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --format json \
        --output trivy-report.json \
        .
    # ── 3. Human-readable table summary in the pipeline log ────────────────
    - |
      echo ""
      echo "╔══════════════════════════════════════════════════════════════╗"
      echo "║              Trivy — HIGH / CRITICAL findings                ║"
      echo "╚══════════════════════════════════════════════════════════════╝"
      trivy fs \
        --cache-dir .trivy-cache \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --format table \
        .
      # Exit non-zero if CRITICAL vulns found (surfaced in GitLab UI)
      trivy fs \
        --cache-dir .trivy-cache \
        --scanners vuln \
        --severity CRITICAL \
        --exit-code 1 \
        --format table \
        . || echo "⚠ CRITICAL vulnerabilities detected — see report"
  artifacts:
    when: always
    paths:
      - trivy-report.sarif
      - trivy-report.json
    reports:
      sast: trivy-report.sarif   # → GitLab Security Dashboard & MR Security tab
    expire_in: 4 weeks
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

# ── govulncheck: Go callgraph-aware scan ──────────────────────────────────
# Unlike Trivy (which flags every CVE present in go.sum), govulncheck traces
# actual call paths through the source.  If vulnerable code is imported but
# never called, it is NOT reported — dramatically fewer false positives.
security:govulncheck:
  stage: security
  image: golang:${GO_VERSION}
  variables:
    CGO_ENABLED: "0"
    GOPATH: "$CI_PROJECT_DIR/.go"
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-mods
    paths:
      - .go/pkg/mod/
  before_script:
    - apt-get update -qq && apt-get install -y -qq git 2>/dev/null
    - mkdir -p .go
    - export PATH="$GOPATH/bin:$PATH"
    - go mod download
    - go install golang.org/x/vuln/cmd/govulncheck@latest
  script:
    - |
      echo "╔══════════════════════════════════════════════════════════════╗"
      echo "║          govulncheck — Go callgraph CVE analysis             ║"
      echo "╚══════════════════════════════════════════════════════════════╝"
      echo ""
      # Build package list using only packages that compile.
      # `go list -e` continues past errors; we grep out the known-broken
      # packages so govulncheck doesn't abort before scanning anything.
      SCAN_PKGS=$(go list -e ./... 2>/dev/null \
        | grep -v -E '^aigateway/(internal/rag(/|$)|internal/rag/|internal/services/rag|cmd/webui)' \
        | tr '\n' ' ')
      PKG_COUNT=$(echo "$SCAN_PKGS" | wc -w | tr -d ' ')
      echo "Scanning ${PKG_COUNT} packages (broken packages excluded)"
      echo ""
      # JSON artifact — ignore non-zero exit so pipefail doesn't abort the job
      govulncheck -json $SCAN_PKGS 2>&1 | tee govulncheck-report.json || true
      # Human-readable output for the pipeline log
      govulncheck $SCAN_PKGS 2>&1 | tee govulncheck-report.txt || true
  after_script:
    - |
      VULNS=0
      if [ -f govulncheck-report.json ]; then
        VULNS=$(grep -c '"osv"' govulncheck-report.json 2>/dev/null || echo 0)
      fi
      echo ""
      echo "────────────────────────────────────────────────────────────────"
      if [ "${VULNS}" -gt "0" ] 2>/dev/null; then
        echo " ⚠  govulncheck: ${VULNS} OSV record(s) in reachable code"
        echo "    → see govulncheck-report.txt for details"
      else
        echo " ✓  govulncheck: no reachable vulnerabilities found"
      fi
      echo "────────────────────────────────────────────────────────────────"
  artifacts:
    when: always
    paths:
      - govulncheck-report.txt
      - govulncheck-report.json
    expire_in: 4 weeks
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

# ==============================================================================
# BUILD STAGE
# ==============================================================================

# Build Svelte WebUI first
build:webui:
  stage: build
  image: node:${NODE_VERSION}-alpine
  cache: []  # Disable cache for this job - platform-specific deps
  before_script:
    - cd web-svelte
    # Clean install for Linux (package-lock.json may have Windows deps)
    - rm -rf node_modules package-lock.json
    - npm cache clean --force
    - npm install
  script:
    # Clean Paraglide cache and regenerate messages
    - rm -rf src/lib/paraglide project.inlang/cache
    - npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
    # Generate SvelteKit types before build
    - npx svelte-kit sync
    - npm run build
    - ls -la build/
  artifacts:
    paths:
      - web-svelte/build/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Build Go binary for Linux amd64 (depends on webui)
# Using debian-based image for glibc compatibility with RHEL/Rocky
build:binary:
  stage: build
  image: golang:${GO_VERSION}
  needs:
    - job: build:webui
      artifacts: true
  before_script:
    - apt-get update && apt-get install -y git
    - mkdir -p .go
    - export GOPATH="$CI_PROJECT_DIR/.go"
  script:
    - *compute_version
    - BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
    - GIT_COMMIT=${CI_COMMIT_SHORT_SHA}
    - echo "Building version $BUILD_VERSION"
    
    # Copy Svelte build to embed directory
    - echo "Copying Svelte UI to internal/web/svelte-build/"
    - rm -rf internal/web/svelte-build/*
    - mkdir -p internal/web/svelte-build
    - cp -r web-svelte/build/* internal/web/svelte-build/
    - ls -la internal/web/svelte-build/
    
    # Build Go binary with embedded WebUI
    - |
      go build -ldflags "\
        -X aigateway/internal/version.Version=${BUILD_VERSION} \
        -X aigateway/internal/version.BuildDate=${BUILD_TIME} \
        -X aigateway/internal/version.GitCommit=${GIT_COMMIT} \
        -s -w" \
        -o bin/aigateway-linux-amd64 \
        cmd/server/main.go
    - chmod +x bin/aigateway-linux-amd64
    - ls -la bin/
    
    # Save version info for later stages
    - echo "$BUILD_VERSION" > bin/BUILD_VERSION
    - echo "$RPM_VERSION" > bin/RPM_VERSION
    - echo "$RPM_RELEASE" > bin/RPM_RELEASE
  artifacts:
    paths:
      - bin/aigateway-linux-amd64
      - bin/BUILD_VERSION
      - bin/RPM_VERSION
      - bin/RPM_RELEASE
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ==============================================================================
# PACKAGE STAGE - Build RPMs
# ==============================================================================

# Build main application RPM (tags only)
package:rpm:
  stage: package
  image: rockylinux:9
  needs:
    - build:binary  # WebUI is already embedded in binary
  before_script:
    - dnf install -y rpm-build rpmdevtools
    - rpmdev-setuptree
  script:
    # Read version info from build stage
    - RPM_VERSION=$(cat bin/RPM_VERSION 2>/dev/null || cat VERSION 2>/dev/null || echo "0.0.0")
    - RPM_RELEASE=$(cat bin/RPM_RELEASE 2>/dev/null || echo "1")
    - BUILD_VERSION=$(cat bin/BUILD_VERSION 2>/dev/null || echo "$RPM_VERSION")
    - echo "Building RPM version=$RPM_VERSION release=$RPM_RELEASE (full=$BUILD_VERSION)"
    
    # Copy sources to rpmbuild
    - cp bin/aigateway-linux-amd64 ~/rpmbuild/SOURCES/aigateway-linux-amd64
    - cp packaging/rpm/oop.service ~/rpmbuild/SOURCES/
    - cp packaging/rpm/ollama-openai-proxy.spec ~/rpmbuild/SPECS/
    
    # Build RPM with version and release
    - |
      rpmbuild \
        --define "version $RPM_VERSION" \
        --define "release $RPM_RELEASE" \
        -bb ~/rpmbuild/SPECS/ollama-openai-proxy.spec
    
    # Copy RPM to artifacts
    - mkdir -p dist
    - cp ~/rpmbuild/RPMS/*/*.rpm dist/
    - ls -la dist/
    
    # Log built packages
    - |
      for f in dist/*.rpm; do
        echo "Built: $f (version: $RPM_VERSION, release: $RPM_RELEASE)"
      done
  artifacts:
    paths:
      - dist/*.rpm
    expire_in: 4 weeks
  rules:
    - if: $CI_COMMIT_TAG  # Only for tags

# ==============================================================================
# RELEASE STAGE
# ==============================================================================

# Publish RPM to GitLab Generic Package Registry (tags only)
publish:rpm:
  stage: release
  image: curlimages/curl:latest
  needs:
    - package:rpm
    - job: build:binary
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG  # Only for tags
  script:
    - RPM_VERSION=$(cat bin/RPM_VERSION)
    - RPM_RELEASE=$(cat bin/RPM_RELEASE)
    - BUILD_VERSION=$(cat bin/BUILD_VERSION)
    
    - |
      echo "Publishing RPM to GitLab Generic Package Registry"
      echo "  Version: ${RPM_VERSION}"
      echo "  Release: ${RPM_RELEASE}"
      echo "  Build: ${BUILD_VERSION}"
    
    # Upload RPM to GitLab Generic Package Registry
    - |
      for RPM_FILE in dist/*.rpm; do
        if [ -f "$RPM_FILE" ]; then
          RPM_NAME=$(basename ${RPM_FILE})
          echo "Uploading: ${RPM_NAME}"
          curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
               --upload-file "${RPM_FILE}" \
               "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ollama-openai-proxy/${BUILD_VERSION}/${RPM_NAME}"
        fi
      done
    
    # Upload install script
    - |
      cat > /tmp/install.sh << 'SCRIPT'
      #!/bin/bash
      set -e
      
      GITLAB_URL="https://gitlab.alexue4.dev"
      PROJECT_ID="__PROJECT_ID__"
      VERSION="__VERSION__"
      RPM_NAME="__RPM_NAME__"
      
      echo "╔══════════════════════════════════════════════════════════════╗"
      echo "║           AIGateway (Ollama OpenAI Proxy) Installer          ║"
      echo "╚══════════════════════════════════════════════════════════════╝"
      echo ""
      echo "Version: ${VERSION}"
      echo ""
      
      # Download RPM
      echo "→ Downloading RPM package..."
      curl -fsSL "${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages/generic/ollama-openai-proxy/${VERSION}/${RPM_NAME}" -o /tmp/${RPM_NAME}
      
      # Install RPM (use rpm directly - no dependencies, no repo metadata refresh)
      echo "→ Installing package..."
      sudo rpm -Uvh --nodeps /tmp/${RPM_NAME}
      
      # Cleanup
      rm -f /tmp/${RPM_NAME}
      
      echo ""
      echo "✓ Installation complete!"
      echo ""
      echo "Next steps:"
      echo "  1. Edit config: sudo vim /opt/ollama-openai-proxy/configs/dev.yaml"
      echo "  2. Start service: sudo systemctl enable --now oop"
      echo "  3. Check status: sudo systemctl status oop"
      SCRIPT
    
    # Replace placeholders in install script
    - RPM_NAME=$(ls dist/*.rpm | head -1 | xargs basename)
    - sed -i "s|__PROJECT_ID__|${CI_PROJECT_ID}|g" /tmp/install.sh
    - sed -i "s|__VERSION__|${BUILD_VERSION}|g" /tmp/install.sh
    - sed -i "s|__RPM_NAME__|${RPM_NAME}|g" /tmp/install.sh
    
    # Upload install script for this version
    - |
      echo "Uploading: install.sh (version: ${BUILD_VERSION})"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "/tmp/install.sh" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ollama-openai-proxy/${BUILD_VERSION}/install.sh"
    
    # Create/update latest install script (always points to newest build)
    - |
      cat > /tmp/install-latest.sh << 'SCRIPT'
      #!/bin/bash
      set -e
      
      GITLAB_URL="https://gitlab.alexue4.dev"
      PROJECT_ID="146"
      PACKAGE_NAME="ollama-openai-proxy"
      
      echo "╔══════════════════════════════════════════════════════════════╗"
      echo "║           AIGateway (Ollama OpenAI Proxy) Installer          ║"
      echo "╚══════════════════════════════════════════════════════════════╝"
      echo ""
      
      # Get latest version from GitLab Package Registry (exclude "latest" pseudo-version)
      echo "→ Finding latest version..."
      LATEST_VERSION=$(curl -fsSL "${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages?package_name=${PACKAGE_NAME}&order_by=created_at&sort=desc&per_page=10" | grep -o '"version":"[^"]*"' | cut -d'"' -f4 | grep -v "^latest$" | head -1)
      
      if [ -z "$LATEST_VERSION" ]; then
          echo "Error: Could not determine latest version"
          exit 1
      fi
      
      echo "   Latest version: ${LATEST_VERSION}"
      echo ""
      
      # Find RPM filename from package files
      echo "→ Finding RPM package..."
      PACKAGE_ID=$(curl -fsSL "${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages?package_name=${PACKAGE_NAME}&package_version=${LATEST_VERSION}" | grep -o '"id":[0-9]*' | head -1 | cut -d':' -f2)
      
      if [ -n "$PACKAGE_ID" ]; then
          RPM_NAME=$(curl -fsSL "${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages/${PACKAGE_ID}/package_files" | grep -o '"file_name":"[^"]*\.rpm"' | head -1 | cut -d'"' -f4)
      fi
      
      if [ -z "$RPM_NAME" ]; then
          # Fallback: try common patterns
          for suffix in "el9.x86_64.rpm" "x86_64.rpm"; do
              TEST_NAME="${PACKAGE_NAME}-${LATEST_VERSION}.${suffix}"
              if curl -fsSL --head "${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${LATEST_VERSION}/${TEST_NAME}" 2>/dev/null | grep -q "200"; then
                  RPM_NAME="$TEST_NAME"
                  break
              fi
          done
      fi
      
      if [ -z "$RPM_NAME" ]; then
          echo "Error: Could not find RPM package"
          exit 1
      fi
      
      RPM_URL="${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${LATEST_VERSION}/${RPM_NAME}"
      echo "   Package: ${RPM_NAME}"
      echo ""
      
      # Download RPM
      echo "→ Downloading..."
      curl -fsSL "${RPM_URL}" -o "/tmp/${RPM_NAME}"
      
      # Install (use rpm directly - no dependencies, no repo metadata refresh)
      echo "→ Installing..."
      sudo rpm -Uvh --nodeps "/tmp/${RPM_NAME}"
      
      # Cleanup
      rm -f "/tmp/${RPM_NAME}"
      
      echo ""
      echo "╔══════════════════════════════════════════════════════════════╗"
      echo "║                    Installation complete!                    ║"
      echo "╚══════════════════════════════════════════════════════════════╝"
      echo ""
      
      # Show service status
      echo "→ Service status:"
      echo ""
      sudo systemctl status oop --no-pager 2>/dev/null || echo "  Service not running (first install)"
      echo ""
      echo "Commands:"
      echo "  Start:   sudo systemctl enable --now oop"
      echo "  Status:  sudo systemctl status oop"
      echo "  Logs:    journalctl -u oop -f"
      echo ""
      SCRIPT
    
    # Upload latest install script
    - |
      echo "Uploading: install.sh (latest)"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "/tmp/install-latest.sh" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ollama-openai-proxy/latest/install.sh"
    
    - |
      echo ""
      echo "╔══════════════════════════════════════════════════════════════╗"
      echo "║                    RPM published successfully!               ║"
      echo "╚══════════════════════════════════════════════════════════════╝"
      echo ""
      echo "┌──────────────────────────────────────────────────────────────┐"
      echo "│ Install LATEST (always newest version):                      │"
      echo "└──────────────────────────────────────────────────────────────┘"
      echo ""
      echo "  curl -fsSL https://gitlab.alexue4.dev/api/v4/projects/146/packages/generic/ollama-openai-proxy/latest/install.sh | sudo bash"
      echo ""
      echo "┌──────────────────────────────────────────────────────────────┐"
      echo "│ Install THIS version (${BUILD_VERSION}):                     │"
      echo "└──────────────────────────────────────────────────────────────┘"
      echo ""
      echo "  curl -fsSL https://gitlab.alexue4.dev/api/v4/projects/146/packages/generic/ollama-openai-proxy/${BUILD_VERSION}/install.sh | sudo bash"
      echo ""
      echo "┌──────────────────────────────────────────────────────────────┐"
      echo "│ Browse packages:                                             │"
      echo "└──────────────────────────────────────────────────────────────┘"
      echo ""
      echo "  ${CI_PROJECT_URL}/-/packages"
      echo ""

# Update install script independently (runs on .gitlab-ci.yml changes)
# This allows fixing install.sh without rebuilding RPM
update:install-script:
  stage: scripts
  image: alpine:latest
  rules:
    # Always run when .gitlab-ci.yml changes (any branch/tag)
    - changes:
        - .gitlab-ci.yml
      when: always
    # Also run manually anytime
    - when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache curl bash
  script:
    - |
      echo "╔══════════════════════════════════════════════════════════════╗"
      echo "║           Updating install.sh (latest)                       ║"
      echo "╚══════════════════════════════════════════════════════════════╝"
      echo ""
    
    # Create latest install script
    - |
      cat > /tmp/install-latest.sh << 'SCRIPT'
      #!/bin/bash
      set -e
      
      GITLAB_URL="https://gitlab.alexue4.dev"
      PROJECT_ID="146"
      PACKAGE_NAME="ollama-openai-proxy"
      
      echo "╔══════════════════════════════════════════════════════════════╗"
      echo "║           AIGateway (Ollama OpenAI Proxy) Installer          ║"
      echo "╚══════════════════════════════════════════════════════════════╝"
      echo ""
      
      # Get latest version from GitLab Package Registry (exclude "latest" pseudo-version)
      echo "→ Finding latest version..."
      LATEST_VERSION=$(curl -fsSL "${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages?package_name=${PACKAGE_NAME}&order_by=created_at&sort=desc&per_page=10" | grep -o '"version":"[^"]*"' | cut -d'"' -f4 | grep -v "^latest$" | head -1)
      
      if [ -z "$LATEST_VERSION" ]; then
          echo "Error: Could not determine latest version"
          exit 1
      fi
      
      echo "   Latest version: ${LATEST_VERSION}"
      echo ""
      
      # Find RPM filename from package files
      echo "→ Finding RPM package..."
      PACKAGE_ID=$(curl -fsSL "${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages?package_name=${PACKAGE_NAME}&package_version=${LATEST_VERSION}" | grep -o '"id":[0-9]*' | head -1 | cut -d':' -f2)
      
      if [ -n "$PACKAGE_ID" ]; then
          RPM_NAME=$(curl -fsSL "${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages/${PACKAGE_ID}/package_files" | grep -o '"file_name":"[^"]*\.rpm"' | head -1 | cut -d'"' -f4)
      fi
      
      if [ -z "$RPM_NAME" ]; then
          # Fallback: try common patterns
          for suffix in "el9.x86_64.rpm" "x86_64.rpm"; do
              TEST_NAME="${PACKAGE_NAME}-${LATEST_VERSION}.${suffix}"
              if curl -fsSL --head "${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${LATEST_VERSION}/${TEST_NAME}" 2>/dev/null | grep -q "200"; then
                  RPM_NAME="$TEST_NAME"
                  break
              fi
          done
      fi
      
      if [ -z "$RPM_NAME" ]; then
          echo "Error: Could not find RPM package"
          exit 1
      fi
      
      RPM_URL="${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${LATEST_VERSION}/${RPM_NAME}"
      echo "   Package: ${RPM_NAME}"
      echo ""
      
      # Download RPM
      echo "→ Downloading..."
      curl -fsSL "${RPM_URL}" -o "/tmp/${RPM_NAME}"
      
      # Install (use rpm directly - no dependencies, no repo metadata refresh)
      echo "→ Installing..."
      sudo rpm -Uvh --nodeps "/tmp/${RPM_NAME}"
      
      # Cleanup
      rm -f "/tmp/${RPM_NAME}"
      
      echo ""
      echo "╔══════════════════════════════════════════════════════════════╗"
      echo "║                    Installation complete!                    ║"
      echo "╚══════════════════════════════════════════════════════════════╝"
      echo ""
      
      # Show service status
      echo "→ Service status:"
      echo ""
      sudo systemctl status oop --no-pager 2>/dev/null || echo "  Service not running (first install)"
      echo ""
      echo "Commands:"
      echo "  Start:   sudo systemctl enable --now oop"
      echo "  Status:  sudo systemctl status oop"
      echo "  Logs:    journalctl -u oop -f"
      echo ""
      SCRIPT
    
    # Upload latest install script
    - |
      echo "Uploading: install.sh (latest)"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "/tmp/install-latest.sh" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ollama-openai-proxy/latest/install.sh"
    
    - |
      echo ""
      echo "✓ install.sh (latest) updated successfully!"
      echo ""
      echo "Test with:"
      echo "  curl -fsSL https://gitlab.alexue4.dev/api/v4/projects/146/packages/generic/ollama-openai-proxy/latest/install.sh | sudo bash"
      echo ""

# Create GitLab Release (tags only)
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - package:rpm
    - publish:rpm
    - job: build:binary
      artifacts: true
  script:
    - TAG_VERSION="${CI_COMMIT_TAG#v}"
    - echo "Creating release for version ${TAG_VERSION}"
    
    # Extract changelog for this version from CHANGELOG.md
    # Finds content between "## [X.Y.Z]" and the next "## [" header
    - |
      CHANGELOG_CONTENT=$(awk -v ver="${TAG_VERSION}" '
        BEGIN { found=0; content="" }
        /^## \[/ {
          if (found) exit
          if (index($0, "[" ver "]") > 0) found=1
        }
        found { content = content $0 "\n" }
        END { print content }
      ' CHANGELOG.md)
      
      if [ -z "$CHANGELOG_CONTENT" ]; then
        echo "Warning: No changelog found for version ${TAG_VERSION}"
        CHANGELOG_CONTENT="No changelog available for this version."
      fi
      
      echo "Extracted changelog:"
      echo "$CHANGELOG_CONTENT"
      
      # Write release description to file
      cat > release_description.md << EOF
      ## AIGateway $CI_COMMIT_TAG
      
      $CHANGELOG_CONTENT
      
      ---
      
      ### Quick Install (Rocky Linux 9 / RHEL 9)
      
      \`\`\`bash
      curl -fsSL https://gitlab.alexue4.dev/api/v4/projects/146/packages/generic/ollama-openai-proxy/latest/install.sh | sudo bash
      \`\`\`
      
      ### Post-Install
      
      \`\`\`bash
      # Configure
      sudo vim /opt/ollama-openai-proxy/configs/dev.yaml
      
      # Start service
      sudo systemctl enable --now oop
      sudo systemctl status oop
      
      # View logs
      journalctl -u oop -f
      \`\`\`
      
      ### Upgrade
      
      \`\`\`bash
      curl -fsSL https://gitlab.alexue4.dev/api/v4/projects/146/packages/generic/ollama-openai-proxy/latest/install.sh | sudo bash
      sudo systemctl restart oop
      \`\`\`
      
      ### Package Registry
      
      Browse all packages: ${CI_PROJECT_URL}/-/packages
      EOF
      
      echo "Release description generated:"
      cat release_description.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: 'AIGateway $CI_COMMIT_TAG'
    description: './release_description.md'
    assets:
      links:
        - name: 'Package Registry'
          url: '${CI_PROJECT_URL}/-/packages'
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG

