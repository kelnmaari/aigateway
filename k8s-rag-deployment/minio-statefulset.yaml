---
# Secret для MinIO credentials
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: rag-infrastructure
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin123

---
# Service для MinIO API
apiVersion: v1
kind: Service
metadata:
  name: minio-api
  namespace: rag-infrastructure
  labels:
    app: minio
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: api
  selector:
    app: minio

---
# Service для MinIO Console
apiVersion: v1
kind: Service
metadata:
  name: minio-console
  namespace: rag-infrastructure
  labels:
    app: minio
spec:
  type: ClusterIP
  ports:
  - port: 9001
    targetPort: 9001
    protocol: TCP
    name: console
  selector:
    app: minio

---
# StatefulSet для MinIO
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: rag-infrastructure
spec:
  serviceName: minio-api
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        command:
        - /bin/sh
        - -c
        - |
          minio server /data --console-address ":9001"
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_PASSWORD
        - name: MINIO_BROWSER
          value: "on"
        - name: MINIO_COMPRESS
          value: "on"
        - name: MINIO_COMPRESS_EXTENSIONS
          value: ".txt,.csv,.json,.pdf"
        volumeMounts:
        - name: minio-data
          mountPath: /data
        resources:
          limits:
            memory: 2Gi
            cpu: 1000m
          requests:
            memory: 512Mi
            cpu: 250m
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: minio-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Gi

---
# Job для создания buckets
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup-buckets
  namespace: rag-infrastructure
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: minio/mc:latest
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_PASSWORD
        command:
        - /bin/sh
        - -c
        - |
          # Ждем пока MinIO запустится
          sleep 30
          
          # Настраиваем alias
          mc alias set minio http://minio-api:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD
          
          # Создаем buckets
          mc mb --ignore-existing minio/user-files
          mc mb --ignore-existing minio/rag-documents
          mc mb --ignore-existing minio/embeddings-cache
          
          # Устанавливаем политику доступа
          mc anonymous set download minio/user-files
          
          echo "MinIO buckets created successfully"

