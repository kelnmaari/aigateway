{{/* Loaded models list - HTMX fragment */}}
<div id="loaded-models-list">
    {{if .models}}
    <ul class="loaded-models-list">
        {{range .models}}
        <li class="loaded-model-item">
            <i class="fas fa-cube text-success"></i>
            <span class="model-name">{{.name}}</span>
            <span class="model-path text-muted">{{.path}}</span>
        </li>
        {{end}}
    </ul>
    {{else}}
    <p class="text-muted text-center py-3">
        <i class="fas fa-info-circle"></i> No models loaded
    </p>
    {{end}}
</div>
