# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- security
- build
- package
- scripts
- release
variables:
  GO_VERSION: 1.26.1
  GOPROXY: https://proxy.golang.org,direct
  CGO_ENABLED: '0'
  NODE_VERSION: '20'
".compute_version":
- |
  BASE_VERSION=$(cat VERSION 2>/dev/null || echo "0.0.0")
  if [ -n "$CI_COMMIT_TAG" ]; then
    # Release build from tag
    export RPM_VERSION="${CI_COMMIT_TAG#v}"
    export RPM_RELEASE="1"
    export BUILD_VERSION="${RPM_VERSION}"
  else
    # Branch build: sanitize branch name (replace / and _ with .)
    BRANCH_SAFE=$(echo "$CI_COMMIT_REF_NAME" | tr '/' '.' | tr '_' '.' | tr '-' '.' | cut -c1-20)
    export RPM_VERSION="${BASE_VERSION}"
    export RPM_RELEASE="${BRANCH_SAFE}.${CI_JOB_ID}"
    export BUILD_VERSION="${RPM_VERSION}-${BRANCH_SAFE}-${CI_JOB_ID}"
  fi
  echo "BUILD_VERSION=$BUILD_VERSION"
  echo "RPM_VERSION=$RPM_VERSION"
  echo "RPM_RELEASE=$RPM_RELEASE"
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
  - ".go/pkg/mod/"
  - web-svelte/node_modules/
".test_template":
  stage: test
  image: golang:${GO_VERSION}
  variables:
    CGO_ENABLED: '0'
  before_script:
  - apt-get update && apt-get install -y git
  - mkdir -p .go
  - export GOPATH="$CI_PROJECT_DIR/.go"
  - export PATH="$GOPATH/bin:$PATH"
  - go mod download
  allow_failure: true
  rules:
  - if: "$CI_COMMIT_TAG"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  - if: "$CI_COMMIT_BRANCH"
test:fast:
  stage: test
  image: golang:${GO_VERSION}
  variables:
    CGO_ENABLED: '0'
  before_script:
  - apt-get update && apt-get install -y git
  - mkdir -p .go
  - export GOPATH="$CI_PROJECT_DIR/.go"
  - export PATH="$GOPATH/bin:$PATH"
  - go mod download
  allow_failure: true
  rules:
  - if: "$CI_COMMIT_TAG"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  - if: "$CI_COMMIT_BRANCH"
  script:
  - |
    go test -short \
      ./internal/config/... \
      ./internal/concurrent/... \
      ./internal/types/... \
      ./internal/utils/... \
      ./internal/models/... \
      ./internal/cache/... \
      ./internal/health/... \
      ./internal/settings/... \
      ./cmd/server/... \
      ./cmd/tui/...
  timeout: 5m
test:race:
  stage: test
  image: golang:${GO_VERSION}
  variables:
    CGO_ENABLED: '1'
    GOMAXPROCS: '4'
  before_script:
  - apt-get update && apt-get install -y git gcc
  - mkdir -p .go
  - export GOPATH="$CI_PROJECT_DIR/.go"
  - export PATH="$GOPATH/bin:$PATH"
  - go mod download
  script:
  - |
    go test -race -p 2 \
      ./internal/config/... \
      ./internal/concurrent/... \
      ./internal/types/... \
      ./internal/utils/... \
      ./internal/models/... \
      ./internal/inference/...
  allow_failure: true
  timeout: 10m
  rules:
  - if: "$CI_COMMIT_TAG"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: always
  - when: never
security:trivy:
  stage: security
  image:
    name: ghcr.io/aquasecurity/trivy:latest
    entrypoint:
    - ''
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivy-cache"
    TRIVY_EXIT_CODE: '0'
    TRIVY_SKIP_DEV_DEPENDENCIES: 'true'
  cache:
    key: trivy-db-${CI_COMMIT_REF_SLUG}
    paths:
    - ".trivy-cache/"
  before_script:
  - mkdir -p .trivy-cache
  - trivy image --download-db-only --cache-dir .trivy-cache
  script:
  - |
    trivy fs \
      --cache-dir .trivy-cache \
      --scanners vuln \
      --severity HIGH,CRITICAL \
      --format sarif \
      --output trivy-report.sarif \
      .
  - |
    trivy fs \
      --cache-dir .trivy-cache \
      --scanners vuln \
      --severity HIGH,CRITICAL \
      --format json \
      --output trivy-report.json \
      .
  - |
    echo ""
    echo "╔══════════════════════════════════════════════════════════════╗"
    echo "║              Trivy — HIGH / CRITICAL findings                ║"
    echo "╚══════════════════════════════════════════════════════════════╝"
    trivy fs \
      --cache-dir .trivy-cache \
      --scanners vuln \
      --severity HIGH,CRITICAL \
      --format table \
      .
    # Exit non-zero if CRITICAL vulns found (surfaced in GitLab UI)
    trivy fs \
      --cache-dir .trivy-cache \
      --scanners vuln \
      --severity CRITICAL \
      --exit-code 1 \
      --format table \
      . || echo "⚠ CRITICAL vulnerabilities detected — see report"
  artifacts:
    when: always
    paths:
    - trivy-report.sarif
    - trivy-report.json
    reports:
      sast: trivy-report.sarif
    expire_in: 4 weeks
  allow_failure: true
  rules:
  - if: "$CI_COMMIT_TAG"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  - if: "$CI_COMMIT_BRANCH"
security:govulncheck:
  stage: security
  image: golang:${GO_VERSION}
  variables:
    CGO_ENABLED: '0'
    GOPATH: "$CI_PROJECT_DIR/.go"
  cache:
    key: "${CI_COMMIT_REF_SLUG}-go-mods"
    paths:
    - ".go/pkg/mod/"
  before_script:
  - apt-get update -qq && apt-get install -y -qq git 2>/dev/null
  - mkdir -p .go
  - export PATH="$GOPATH/bin:$PATH"
  - go mod download
  - go install golang.org/x/vuln/cmd/govulncheck@latest
  script:
  - |
    echo "╔══════════════════════════════════════════════════════════════╗"
    echo "║          govulncheck — Go callgraph CVE analysis             ║"
    echo "╚══════════════════════════════════════════════════════════════╝"
    echo ""
    # Build package list using only packages that compile.
    # `go list -e` continues past errors; we grep out the known-broken
    # packages so govulncheck doesn't abort before scanning anything.
    SCAN_PKGS=$(go list -e ./... 2>/dev/null \
      | grep -v -E '^aigateway/(internal/rag(/|$)|internal/rag/|internal/services/rag|cmd/webui)' \
      | tr '\n' ' ')
    PKG_COUNT=$(echo "$SCAN_PKGS" | wc -w | tr -d ' ')
    echo "Scanning ${PKG_COUNT} packages (broken packages excluded)"
    echo ""
    # JSON artifact — ignore non-zero exit so pipefail doesn't abort the job
    govulncheck -json $SCAN_PKGS 2>&1 | tee govulncheck-report.json || true
    # Human-readable output for the pipeline log
    govulncheck $SCAN_PKGS 2>&1 | tee govulncheck-report.txt || true
  after_script:
  - |
    VULNS=0
    if [ -f govulncheck-report.json ]; then
      VULNS=$(grep -c '"osv"' govulncheck-report.json 2>/dev/null || echo 0)
    fi
    echo ""
    echo "────────────────────────────────────────────────────────────────"
    if [ "${VULNS}" -gt "0" ] 2>/dev/null; then
      echo " ⚠  govulncheck: ${VULNS} OSV record(s) in reachable code"
      echo "    → see govulncheck-report.txt for details"
    else
      echo " ✓  govulncheck: no reachable vulnerabilities found"
    fi
    echo "────────────────────────────────────────────────────────────────"
  artifacts:
    when: always
    paths:
    - govulncheck-report.txt
    - govulncheck-report.json
    expire_in: 4 weeks
  allow_failure: true
  rules:
  - if: "$CI_COMMIT_TAG"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  - if: "$CI_COMMIT_BRANCH"
build:webui:
  stage: build
  image: node:${NODE_VERSION}-alpine
  cache: []
  before_script:
  - cd web-svelte
  - rm -rf node_modules package-lock.json
  - npm cache clean --force
  - npm install
  script:
  - rm -rf src/lib/paraglide project.inlang/cache
  - npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
  - npx svelte-kit sync
  - npm run build
  - ls -la build/
  artifacts:
    paths:
    - web-svelte/build/
    expire_in: 1 week
  rules:
  - if: "$CI_COMMIT_BRANCH"
  - if: "$CI_COMMIT_TAG"
build:binary:
  stage: build
  image: golang:${GO_VERSION}
  needs:
  - job: build:webui
    artifacts: true
  before_script:
  - apt-get update && apt-get install -y git
  - mkdir -p .go
  - export GOPATH="$CI_PROJECT_DIR/.go"
  script:
  - - |
      BASE_VERSION=$(cat VERSION 2>/dev/null || echo "0.0.0")
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Release build from tag
        export RPM_VERSION="${CI_COMMIT_TAG#v}"
        export RPM_RELEASE="1"
        export BUILD_VERSION="${RPM_VERSION}"
      else
        # Branch build: sanitize branch name (replace / and _ with .)
        BRANCH_SAFE=$(echo "$CI_COMMIT_REF_NAME" | tr '/' '.' | tr '_' '.' | tr '-' '.' | cut -c1-20)
        export RPM_VERSION="${BASE_VERSION}"
        export RPM_RELEASE="${BRANCH_SAFE}.${CI_JOB_ID}"
        export BUILD_VERSION="${RPM_VERSION}-${BRANCH_SAFE}-${CI_JOB_ID}"
      fi
      echo "BUILD_VERSION=$BUILD_VERSION"
      echo "RPM_VERSION=$RPM_VERSION"
      echo "RPM_RELEASE=$RPM_RELEASE"
  - BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
  - GIT_COMMIT=${CI_COMMIT_SHORT_SHA}
  - echo "Building version $BUILD_VERSION"
  - echo "Copying Svelte UI to internal/web/svelte-build/"
  - rm -rf internal/web/svelte-build/*
  - mkdir -p internal/web/svelte-build
  - cp -r web-svelte/build/* internal/web/svelte-build/
  - ls -la internal/web/svelte-build/
  - |
    go build -ldflags "\
      -X aigateway/internal/version.Version=${BUILD_VERSION} \
      -X aigateway/internal/version.BuildDate=${BUILD_TIME} \
      -X aigateway/internal/version.GitCommit=${GIT_COMMIT} \
      -s -w" \
      -o bin/aigateway-linux-amd64 \
      cmd/server/main.go
  - chmod +x bin/aigateway-linux-amd64
  - ls -la bin/
  - echo "$BUILD_VERSION" > bin/BUILD_VERSION
  - echo "$RPM_VERSION" > bin/RPM_VERSION
  - echo "$RPM_RELEASE" > bin/RPM_RELEASE
  artifacts:
    paths:
    - bin/aigateway-linux-amd64
    - bin/BUILD_VERSION
    - bin/RPM_VERSION
    - bin/RPM_RELEASE
    expire_in: 1 week
  rules:
  - if: "$CI_COMMIT_BRANCH"
  - if: "$CI_COMMIT_TAG"
package:rpm:
  stage: package
  image: rockylinux:9
  needs:
  - build:binary
  before_script:
  - dnf install -y rpm-build rpmdevtools
  - rpmdev-setuptree
  script:
  - RPM_VERSION=$(cat bin/RPM_VERSION 2>/dev/null || cat VERSION 2>/dev/null || echo
    "0.0.0")
  - RPM_RELEASE=$(cat bin/RPM_RELEASE 2>/dev/null || echo "1")
  - BUILD_VERSION=$(cat bin/BUILD_VERSION 2>/dev/null || echo "$RPM_VERSION")
  - echo "Building RPM version=$RPM_VERSION release=$RPM_RELEASE (full=$BUILD_VERSION)"
  - cp bin/aigateway-linux-amd64 ~/rpmbuild/SOURCES/aigateway-linux-amd64
  - cp packaging/rpm/oop.service ~/rpmbuild/SOURCES/
  - cp packaging/rpm/ollama-openai-proxy.spec ~/rpmbuild/SPECS/
  - |
    rpmbuild \
      --define "version $RPM_VERSION" \
      --define "release $RPM_RELEASE" \
      -bb ~/rpmbuild/SPECS/ollama-openai-proxy.spec
  - mkdir -p dist
  - cp ~/rpmbuild/RPMS/*/*.rpm dist/
  - ls -la dist/
  - |
    for f in dist/*.rpm; do
      echo "Built: $f (version: $RPM_VERSION, release: $RPM_RELEASE)"
    done
  artifacts:
    paths:
    - dist/*.rpm
    expire_in: 4 weeks
  rules:
  - if: "$CI_COMMIT_TAG"
publish:rpm:
  stage: release
  image: curlimages/curl:latest
  needs:
  - package:rpm
  - job: build:binary
    artifacts: true
  rules:
  - if: "$CI_COMMIT_TAG"
  script:
  - RPM_VERSION=$(cat bin/RPM_VERSION)
  - RPM_RELEASE=$(cat bin/RPM_RELEASE)
  - BUILD_VERSION=$(cat bin/BUILD_VERSION)
  - |
    echo "Publishing RPM to GitLab Generic Package Registry"
    echo "  Version: ${RPM_VERSION}"
    echo "  Release: ${RPM_RELEASE}"
    echo "  Build: ${BUILD_VERSION}"
  - |
    for RPM_FILE in dist/*.rpm; do
      if [ -f "$RPM_FILE" ]; then
        RPM_NAME=$(basename ${RPM_FILE})
        echo "Uploading: ${RPM_NAME}"
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "${RPM_FILE}" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ollama-openai-proxy/${BUILD_VERSION}/${RPM_NAME}"
      fi
    done
  - |
    cat > /tmp/install.sh << 'SCRIPT'
    #!/bin/bash
    set -e

    GITLAB_URL="https://gitlab.alexue4.dev"
    PROJECT_ID="__PROJECT_ID__"
    VERSION="__VERSION__"
    RPM_NAME="__RPM_NAME__"

    echo "╔══════════════════════════════════════════════════════════════╗"
    echo "║           AIGateway (Ollama OpenAI Proxy) Installer          ║"
    echo "╚══════════════════════════════════════════════════════════════╝"
    echo ""
    echo "Version: ${VERSION}"
    echo ""

    # Download RPM
    echo "→ Downloading RPM package..."
    curl -fsSL "${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages/generic/ollama-openai-proxy/${VERSION}/${RPM_NAME}" -o /tmp/${RPM_NAME}

    # Install RPM (use rpm directly - no dependencies, no repo metadata refresh)
    echo "→ Installing package..."
    sudo rpm -Uvh --nodeps /tmp/${RPM_NAME}

    # Cleanup
    rm -f /tmp/${RPM_NAME}

    echo ""
    echo "✓ Installation complete!"
    echo ""
    echo "Next steps:"
    echo "  1. Edit config: sudo vim /opt/ollama-openai-proxy/configs/dev.yaml"
    echo "  2. Start service: sudo systemctl enable --now oop"
    echo "  3. Check status: sudo systemctl status oop"
    SCRIPT
  - RPM_NAME=$(ls dist/*.rpm | head -1 | xargs basename)
  - sed -i "s|__PROJECT_ID__|${CI_PROJECT_ID}|g" /tmp/install.sh
  - sed -i "s|__VERSION__|${BUILD_VERSION}|g" /tmp/install.sh
  - sed -i "s|__RPM_NAME__|${RPM_NAME}|g" /tmp/install.sh
  - |
    echo "Uploading: install.sh (version: ${BUILD_VERSION})"
    curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
         --upload-file "/tmp/install.sh" \
         "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ollama-openai-proxy/${BUILD_VERSION}/install.sh"
  - |
    cat > /tmp/install-latest.sh << 'SCRIPT'
    #!/bin/bash
    set -e

    GITLAB_URL="https://gitlab.alexue4.dev"
    PROJECT_ID="146"
    PACKAGE_NAME="ollama-openai-proxy"

    echo "╔══════════════════════════════════════════════════════════════╗"
    echo "║           AIGateway (Ollama OpenAI Proxy) Installer          ║"
    echo "╚══════════════════════════════════════════════════════════════╝"
    echo ""

    # Get latest version from GitLab Package Registry (exclude "latest" pseudo-version)
    echo "→ Finding latest version..."
    LATEST_VERSION=$(curl -fsSL "${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages?package_name=${PACKAGE_NAME}&order_by=created_at&sort=desc&per_page=10" | grep -o '"version":"[^"]*"' | cut -d'"' -f4 | grep -v "^latest$" | head -1)

    if [ -z "$LATEST_VERSION" ]; then
        echo "Error: Could not determine latest version"
        exit 1
    fi

    echo "   Latest version: ${LATEST_VERSION}"
    echo ""

    # Find RPM filename from package files
    echo "→ Finding RPM package..."
    PACKAGE_ID=$(curl -fsSL "${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages?package_name=${PACKAGE_NAME}&package_version=${LATEST_VERSION}" | grep -o '"id":[0-9]*' | head -1 | cut -d':' -f2)

    if [ -n "$PACKAGE_ID" ]; then
        RPM_NAME=$(curl -fsSL "${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages/${PACKAGE_ID}/package_files" | grep -o '"file_name":"[^"]*\.rpm"' | head -1 | cut -d'"' -f4)
    fi

    if [ -z "$RPM_NAME" ]; then
        # Fallback: try common patterns
        for suffix in "el9.x86_64.rpm" "x86_64.rpm"; do
            TEST_NAME="${PACKAGE_NAME}-${LATEST_VERSION}.${suffix}"
            if curl -fsSL --head "${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${LATEST_VERSION}/${TEST_NAME}" 2>/dev/null | grep -q "200"; then
                RPM_NAME="$TEST_NAME"
                break
            fi
        done
    fi

    if [ -z "$RPM_NAME" ]; then
        echo "Error: Could not find RPM package"
        exit 1
    fi

    RPM_URL="${GITLAB_URL}/api/v4/projects/${PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${LATEST_VERSION}/${RPM_NAME}"
    echo "   Package: ${RPM_NAME}"
    echo ""

    # Download RPM
    echo "→ Downloading..."
    curl -fsSL "${RPM_URL}" -o "/tmp/${RPM_NAME}"

    # Install (use rpm directly - no dependencies, no repo metadata refresh)
    echo "→ Installing..."
    sudo rpm -Uvh --nodeps "/tmp/${RPM_NAME}"

    # Cleanup
    rm -f "/tmp/${RPM_NAME}"

    echo ""
    echo "╔══════════════════════════════════════════════════════════════╗"
    echo "║                    Installation complete!                    ║"
    echo "╚══════════════════════════════════════════════════════════════╝"
    echo ""

    # Show service status
    echo "→ Service status:"
    echo ""
    sudo systemctl status oop --no-pager 2>/dev/null || echo "  Service not running (first install)"
    echo ""
    echo "Commands:"
    echo "  Start:   sudo systemctl enable --now oop"
    echo "  Status:  sudo systemctl status oop"
    echo "  Logs:    journalctl -u oop -f"
    echo ""
    SCRIPT
  - |
    echo "Uploading: install.sh (latest)"
    curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
         --upload-file "/tmp/install-latest.sh" \
         "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ollama-openai-proxy/latest/install.sh"
  - |
    echo ""
    echo "╔══════════════════════════════════════════════════════════════╗"
    echo "║                    RPM published successfully!               ║"
    echo "╚══════════════════════════════════════════════════════════════╝"
    echo ""
    echo "┌──────────────────────────────────────────────────────────────┐"
    echo "│ Install LATEST (always newest version):                      │"
    echo "└──────────────────────────────────────────────────────────────┘"
    echo ""
    echo "  curl -fsSL https://gitlab.alexue4.dev/api/v4/projects/146/packages/generic/ollama-openai-proxy/latest/install.sh | sudo bash"
    echo ""
    echo "┌──────────────────────────────────────────────────────────────┐"
    echo "│ Install THIS version (${BUILD_VERSION}):                     │"
    echo "└──────────────────────────────────────────────────────────────┘"
    echo ""
    echo "  curl -fsSL https://gitlab.alexue4.dev/api/v4/projects/146/packages/generic/ollama-openai-proxy/${BUILD_VERSION}/install.sh | sudo bash"
    echo ""
    echo "┌──────────────────────────────────────────────────────────────┐"
    echo "│ Browse packages:                                             │"
    echo "└──────────────────────────────────────────────────────────────┘"
    echo ""
    echo "  ${CI_PROJECT_URL}/-/packages"
    echo ""
update:install-script:
