# MVP Configuration без аутентификации для простого тестирования
# Backup конфигурация для быстрого возврата к MVP режиму

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"

ollama:
  url: "http://localhost:11434"
  timeout: "60s"
  retry_attempts: 3
  retry_delay: "2s"
  connection_pool_size: 10
  keep_alive: true
  
  circuit_breaker:
    enabled: true
    max_failures: 5
    reset_timeout: "60s"

# Аутентификация ОТКЛЮЧЕНА для простого MVP режима
auth:
  enabled: false
  rate_limiting:
    enabled: false

logging:
  level: "info"
  format: "json"
  output: "stdout"

models:
  cache:
    enabled: false  # Упрощенный режим

metrics:
  enabled: true
  prometheus_path: "/metrics"
