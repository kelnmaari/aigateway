---
# ConfigMap с конфигурацией Redis
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: rag-infrastructure
data:
  redis.conf: |
    # Persistence
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    save 60 10000
    
    # Memory management
    maxmemory 2gb
    maxmemory-policy allkeys-lru
    
    # Network
    bind 0.0.0.0
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    
    # Security (без пароля для совместимости с docker-compose)
    protected-mode no

---
# Service для Redis
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rag-infrastructure
  labels:
    app: redis
spec:
  ports:
  - port: 6379
    name: redis
    targetPort: 6379
  clusterIP: None  # Headless service для StatefulSet
  selector:
    app: redis

---
# StatefulSet для Redis
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: rag-infrastructure
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - /etc/redis/redis.conf
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-config
          mountPath: /etc/redis
        resources:
          limits:
            memory: 2Gi
            cpu: 1000m
          requests:
            memory: 512Mi
            cpu: 250m
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 8Gi

---
# ClusterIP Service для доступа к Redis
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: rag-infrastructure
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis

