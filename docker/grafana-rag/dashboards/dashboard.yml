# ═══════════════════════════════════════════════════════════════════════════
# Grafana Dashboard Provisioning
# ═══════════════════════════════════════════════════════════════════════════

apiVersion: 1

providers:
  - name: 'RAG Dashboards'
    orgId: 1
    folder: 'RAG Infrastructure'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true

