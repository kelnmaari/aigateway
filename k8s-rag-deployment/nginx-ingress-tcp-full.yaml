# Полный ConfigMap для всех TCP services через NGINX Ingress
# Применяется через: kubectl apply -f nginx-ingress-tcp-full.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: tcp-services
  namespace: nginx-ingress
data:
  # Existing service (сохраняем)
  "9000": nginx-ingress/ingress-nginx-1762145411-defaultbackend:80
  
  # PostgreSQL - порт 5432 презентуется как 30432
  "30432": rag-infrastructure/postgres-service:5432
  
  # Redis - порт 6379 презентуется как 30379  
  "30379": rag-infrastructure/redis-service:6379
  
  # pgAdmin - порт 80 презентуется как 30050
  "30050": rag-infrastructure/pgadmin:80
  
  # MinIO API - порт 9000 презентуется как 30900
  "30900": rag-infrastructure/minio-api:9000
  
  # MinIO Console - порт 9001 презентуется как 30901
  "30901": rag-infrastructure/minio-console:9001
  
  # Qdrant HTTP - порт 6333 презентуется как 30633
  "30633": rag-infrastructure/qdrant-service:6333
  
  # Qdrant gRPC - порт 6334 презентуется как 30634
  "30634": rag-infrastructure/qdrant-service:6334
  
  # Grafana - порт 3000 презентуется как 30300
  "30300": rag-infrastructure/grafana:3000

