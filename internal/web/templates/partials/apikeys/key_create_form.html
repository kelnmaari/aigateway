<div class="modal-header">
    <h3>Create New API Key</h3>
    <button class="btn-close" onclick="closeModal()">✕</button>
</div>

<form hx-post="/api/admin/keys"
      hx-target="#api-keys-list"
      hx-swap="beforeend"
      hx-on::after-request="closeModal(); showToast('API Key created successfully', 'success')">
    
    <div class="form-group">
        <label for="name">Key Name *</label>
        <input type="text" 
               id="name" 
               name="name" 
               placeholder="e.g., My App Key"
               required>
        <small>Human-readable name for this API key</small>
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" 
                  name="description" 
                  rows="2"
                  placeholder="Optional description..."></textarea>
    </div>

    <div class="form-group">
        <label>Model Access</label>
        <div class="checkbox-group">
            <label>
                <input type="checkbox" 
                       id="models_all" 
                       name="models_all" 
                       value="true"
                       onchange="document.querySelectorAll('.model-checkbox').forEach(cb => cb.disabled = this.checked)">
                All Models (Full Access)
            </label>
        </div>
        
        <small>Or select specific models:</small>
        <div class="models-checkboxes">
            {{range .Models}}
            <label>
                <input type="checkbox" 
                       class="model-checkbox"
                       name="models[]" 
                       value="{{.ModelID}}">
                {{.ModelName}} <code>({{.ModelID}})</code>
            </label>
            {{end}}
        </div>
    </div>

    <div class="form-group">
        <label for="rate_limit_per_minute">Rate Limit (requests/min)</label>
        <input type="number" 
               id="rate_limit_per_minute" 
               name="rate_limit_per_minute" 
               min="1"
               max="1000"
               value="60"
               placeholder="60">
        <small>Maximum requests per minute (default: 60)</small>
    </div>

    <div class="form-group">
        <label for="expires_at">Expiration Date (optional)</label>
        <input type="date" 
               id="expires_at" 
               name="expires_at"
               min="{{.Now}}">
        <small>Leave empty for no expiration</small>
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox" name="enabled" value="true" checked>
            Enable immediately
        </label>
    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">
            Cancel
        </button>
        <button type="submit" class="btn btn-primary">
            ➕ Create API Key
        </button>
    </div>
</form>

<div class="alert alert-warning" style="margin-top: 1rem;">
    <strong>⚠️ Important:</strong> The API key will be shown only once after creation. Make sure to copy it!
</div>
