<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Servers Catalog - Ollama Proxy</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/notifications.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-page">
    <!-- Top Navigation inserted by navbar.js -->
    
    <main class="dashboard-main">
    <div class="dashboard-container">
        <!-- Header -->
        <header class="page-header">
            <div>
                <h1>🔌 MCP Servers Catalog</h1>
                <p class="page-description">Model Context Protocol servers directory</p>
            </div>
        </header>

        <!-- Filters -->
        <div class="filters-section">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Search servers by name, description or tags..."
                    class="search-input">
            </div>

            <div class="filter-controls">
                <div class="filter-group">
                    <label for="category-filter">Category:</label>
                    <select id="category-filter" class="filter-select">
                        <option value="">All Categories</option>
                        <!-- Categories loaded dynamically -->
                    </select>
                </div>

                <div class="filter-group">
                    <label for="sort-by">Sort by:</label>
                    <select id="sort-by" class="filter-select">
                        <option value="created_at">Newest First</option>
                        <option value="name">Name (A-Z)</option>
                        <option value="category">Category</option>
                    </select>
                </div>

                <button id="clear-filters" class="btn btn-secondary btn-sm">
                    <i class="fas fa-times"></i> Clear Filters
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-bar">
            <span id="results-count">Loading...</span>
        </div>

        <!-- Servers Grid -->
        <div id="servers-grid" class="servers-grid">
            <div class="loading-placeholder">
                <i class="fas fa-spinner fa-spin"></i> Loading MCP servers...
            </div>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="pagination" style="display: none;">
            <button id="prev-page" class="btn btn-secondary btn-sm" disabled>
                <i class="fas fa-chevron-left"></i> Previous
            </button>
            <span id="page-info">Page 1</span>
            <button id="next-page" class="btn btn-secondary btn-sm">
                Next <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- Server Details Modal -->
    <div id="server-modal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="modal-title">Server Details</h2>
                <button class="modal-close" onclick="mcpCatalog.closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Server details loaded here -->
            </div>
        </div>
    </div>

    </div>
    </main>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/utils/notifications.js"></script>
    <script src="/js/components/navbar.js"></script>
    <script src="/js/mcp.js"></script>
</body>
</html>
