{{/* Single yzma model card - HTMX fragment */}}
<div class="model-card {{if .loaded}}model-loaded{{end}}" data-model-path="{{.path}}">
    <div class="model-header">
        <h3 class="model-name" title="{{.path}}">{{.name}}</h3>
        <span class="model-badge {{if .loaded}}badge-success{{else}}badge-secondary{{end}}">
            {{if .loaded}}LOADED{{else}}Available{{end}}
        </span>
    </div>
    <div class="model-info">
        <div class="info-item">
            <i class="fas fa-cube"></i>
            <span>yzma</span>
        </div>
        <div class="info-item">
            <i class="fas fa-file"></i>
            <span class="text-truncate">{{.path}}</span>
        </div>
    </div>
    <div class="model-actions">
        {{if .loaded}}
        <button 
            class="btn btn-sm btn-danger"
            hx-post="/api/ui/yzma/unload"
            hx-vals='{"model_path": "{{.path}}"}'
            hx-target="closest .model-card"
            hx-swap="outerHTML"
            hx-indicator="#loading-indicator">
            <i class="fas fa-eject"></i> Unload
        </button>
        {{else}}
        <button 
            class="btn btn-sm btn-primary"
            hx-post="/api/ui/yzma/load"
            hx-vals='{"model_path": "{{.path}}"}'
            hx-target="closest .model-card"
            hx-swap="outerHTML"
            hx-indicator="#loading-indicator">
            <i class="fas fa-download"></i> Load
        </button>
        {{end}}
    </div>
</div>
