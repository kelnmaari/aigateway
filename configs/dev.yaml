# Development Configuration для Ollama-OpenAI Proxy

server:
  port: 8085
  host: "0.0.0.0"
  read_timeout: "30m"     # 15 минут - для AI review с большими моделями
  write_timeout: "30m"    # 15 минут - для streaming с большими моделями
  idle_timeout: "120s"    # 2 минуты
  max_header_bytes: 1048576  # 1MB

ollama:
  url: "http://localhost:11434"
  timeout: "30m"          # 10 минут - для больших моделей и большого контекста
  retry_attempts: 3
  retry_delay: "2s"       # Увеличено с 1s до 2s
  connection_pool_size: 10
  keep_alive: true

auth:
  enabled: true   # Включено для тестирования API Key Management
  storage_type: "json"
  storage_path: "data/api_keys.json"
  admin_key: "sk-admin-dev-key-12345"
  
  # Rate limiting
  rate_limiting:
    enabled: true
    default_requests_per_minute: 60
    default_requests_per_hour: 1000
    
    # Redis для distributed rate limiting (опционально)
    redis:
      enabled: false
      url: "redis://localhost:6379"
      key_prefix: "ollama_proxy_rl:"
  
  # JWT для user authentication (Version 1.3.0+)
  jwt:
    secret: "dev-jwt-secret-change-this-in-production-use-at-least-32-chars"
    access_token_expiry: "15m"    # Access token живет 15 минут
    refresh_token_expiry: "168h"  # Refresh token живет 7 дней

  # OIDC/Keycloak SSO (Version 1.11.1+: Enterprise Suite)
  oidc:
    enabled: false  # Отключено по умолчанию в dev (требует Keycloak сервер)
    provider: "keycloak"
    issuer: "https://keycloak.example.com/realms/myrealm"
    client_id: "ollama-proxy"
    client_secret: "${OIDC_CLIENT_SECRET}"  # Из environment variable
    redirect_uri: "http://localhost:8085/auth/oidc/callback"
    scopes:
      - openid
      - profile
      - email
      - groups
    
    # Claims mapping (default values)
    claims:
      user_id: "sub"
      username: "preferred_username"
      email: "email"
      name: "name"
      groups: "groups"
      roles: "realm_roles"
    
    # User provisioning
    auto_create_user: true   # Автоматически создавать пользователя при первом логине
    auto_update_user: true   # Автоматически обновлять данные при каждом логине
    default_role: "user"     # Роль по умолчанию для новых пользователей
    
    # Session management
    session_store: "memory"  # memory или redis
    session_ttl: "10m"       # 10 минут на OIDC flow
    
    # Tenant provisioning from OIDC groups (Version 1.11.2+: Auto-tenant Provisioning)
    tenant_provisioning:
      enabled: true  # Автоматическое создание tenants из OIDC groups
      auto_create_tenants: true  # Создавать tenants если они не существуют
      sync_on_login: true  # Синхронизировать tenants при каждом логине
      remove_orphaned_memberships: false  # Не удалять membership если группа удалена
      
      # Group → Tenant mapping rules
      group_mapping:
        mode: "prefix"  # "direct" (1:1) или "prefix" (extract after prefix)
        prefix: "/engineering/"  # Для prefix mode: "/engineering/backend" → "backend"
        
        # Groups которые дают admin роль в tenant
        admin_groups:
          - "engineering-admins"
          - "tenant-admins"
          - "/admins"
  
  # LDAP/Active Directory (Version 1.11.3+: Enterprise Suite)
  ldap:
    enabled: false  # Отключено по умолчанию (требует LDAP сервер)
    
    # LDAP Server
    url: "ldap://ldap.example.com:389"  # или ldaps://ldap.example.com:636 для TLS
    bind_dn: "cn=admin,dc=example,dc=com"
    bind_password: "${LDAP_BIND_PASSWORD}"  # Из environment variable
    
    # User Search
    user_base_dn: "ou=users,dc=example,dc=com"
    user_filter: "(uid={username})"  # OpenLDAP; для AD: "(sAMAccountName={username})"
    user_id_attribute: "uid"  # для AD: "sAMAccountName"
    user_email_attribute: "mail"
    user_name_attribute: "cn"
    
    # Group Search (optional)
    group_base_dn: "ou=groups,dc=example,dc=com"
    group_filter: "(member={userdn})"  # для AD: "(memberOf={userdn})"
    group_name_attribute: "cn"
    
    # TLS/SSL
    start_tls: false  # Использовать StartTLS для ldap:// connections
    skip_verify: false  # НЕ ВКЛЮЧАЙТЕ в production!
    ca_cert_file: ""  # Путь к CA certificate (optional)
    
    # User Provisioning
    auto_create_user: true  # Создавать пользователя при первом логине
    auto_update_user: true  # Обновлять email/name при каждом логине
    
    # Tenant Provisioning from LDAP Groups (reuse OIDC-02 logic)
    tenant_provisioning:
      enabled: true
      auto_create_tenants: true
      sync_on_login: true
      remove_orphaned_memberships: false
      
      group_mapping:
        mode: "direct"  # или "prefix"
        prefix: ""  # Для prefix mode
        admin_groups:
          - "Domain Admins"
          - "Administrators"
    
    # Timeout
    timeout: "30s"

# 💾 DATABASE - User Management & Multi-Tenancy (Version 1.3.0+)
database:
  # Database type: sqlite or postgresql
  type: "sqlite"
  
  # SQLite Configuration (для development)
  sqlite:
    path: "data/proxy.db"
    journal_mode: "WAL"      # Write-Ahead Logging для лучшей concurrency
    busy_timeout: 5000        # ms - ожидание при locked БД
    cache_size: 10000         # KB - размер кеша SQLite
  
  # PostgreSQL Configuration (для production, если нужно)
  postgresql:
    host: "localhost"
    port: 5432
    user: "proxy"
    password: "proxy-dev-password"
    database: "ollama_proxy"
    sslmode: "disable"       # disable для dev, require для prod
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime: "5m"

logging:
  level: "debug"
  format: "text"  # text или json
  output: "both"  # both = файл И консоль, stdout = только консоль, file = только файл
  file_path: "logs/proxy-dev.log"
  max_size: 100    # MB - размер файла до ротации
  max_backups: 5   # Количество старых файлов
  max_age: 30      # days - удалять файлы старше
  compress: true   # Сжимать старые логи (gzip)

models:
  # Модель по умолчанию для embeddings
  # Используется когда:
  # - Не указана модель в запросе
  # - Указана OpenAI модель (text-embedding-*)
  #
  # Рекомендуемые модели:
  # - nomic-embed-text:latest (768 dimensions, высокое качество)
  # - mxbai-embed-large:latest (1024 dimensions, лучшее качество)
  # - all-minilm:latest (384 dimensions, быстрая)
  default_embedding_model: "mxbai-embed-large:latest"
  
  # Настройки кеширования списка моделей
  cache:
    enabled: true
    ttl: "5m"
    refresh_interval: "1m"

# 💬 ПРОМПТЫ И СИСТЕМНЫЕ СООБЩЕНИЯ
prompts:
  # Дополнительное системное сообщение, автоматически добавляемое ко всем запросам
  # Используется для настройки поведения модели (язык ответа, стиль общения и т.д.)
  additional_system_message: |
    ВАЖНО: Всегда отвечай на русском языке, независимо от языка запроса пользователя.
    Используй простой и понятный стиль общения.
  
  # Добавлять в начало system message (true) или в конец (false)
  prepend_to_system: false

tools:
  # Автоматически применять tool_choice: "required" для всех запросов с tools
  # Когда true, модель ОБЯЗАНА вызывать функции вместо текстового ответа
  # ⚠️ ОТКЛЮЧЕНО: Текстовый промпт сбивает модели с толку и вызывает зависания
  force_usage: false  # ⬅️ Отключено из-за конфликтов с native tool API
  
  # Значение tool_choice по умолчанию если клиент не указал
  # auto = модель решает, required = обязательный вызов, none = не использовать
  default_choice: "auto"
  
  # 🔧 TOOL-AWARE MODEL ROUTING 🔧
  # Автоматическое переключение на модель с лучшей поддержкой function calling
  # Когда указана и в запросе есть tools, запрос автоматически перенаправляется на эту модель
  # 
  # Рекомендуемые варианты для RTX 4090:
  #   1. devstral-64k (создать) - 14GB, стабильный tool calling, 64k контекст
  #   2. gpt-oss-c32k:latest ✅ - 13GB, reasoning + tools, 32k контекст
  #   3. llama3.1-64k (создать) - 5GB, легкий, 64k контекст
  #
  # Для основной работы:
  #   - Запрос БЕЗ tools → qwen3-coder-30b-c32k:latest ✅ (18GB, 32k контекст)
  #   - Запрос С tools → используется fallback_model ниже
  #
  # Оставьте пустым "" чтобы отключить автопереключение
  fallback_model: ""  # ⬅️ Уже с 32k контекстом, reasoning помогает с tools
  
    # 🎯 SMART PROMPT OPTIMIZER - адаптация сложных промптов для локальных моделей
  optimizer:
    # Включить оптимизацию промптов (рекомендуется для IDE с большими system messages)
    enabled: false  # ⬅️ ВКЛЮЧЕНО
    
    # Упрощать system message убирая избыточные инструкции
    # Сохраняются только критичные секции: Tool Use, Communication
    # РЕЗУЛЬТАТ: Сокращение на 80% (6370 → 1219 символов)
    simplify_system_message: false
    
    # Умная фильтрация tools по релевантности к запросу пользователя
    # ⚠️ ОТКЛЮЧЕНО: Плохо работает с русскими запросами, выбирает не те tools
    smart_tool_filtering: false
    
    # Максимум tools в одном запросе (0 = без лимита)
    # ⚠️ УВЕЛИЧЕНО: devstral может обрабатывать больше tools
    max_tools_per_request: 14
    
    # Дополнительные инструкции для сохранения в system message
    preserve_instructions:
      - "When user asks to find/list/show files, use find_path or list_directory tool."
      - "When user asks to read a file, use read_file tool."
      - "When user asks to edit or create a file, use edit_file tool."
      - "Use grep tool to search code content, not paths."

metrics:
  enabled: true
  prometheus_path: "/metrics"
  
  # Внутренние метрики
  collection:
    enabled: true
    buffer_size: 1000
    flush_interval: "10s"

tui:
  enabled: true
  refresh_rate: "1s"
  theme: "default"
  
  # Настройки экранов
  dashboard:
    charts_history: 100
    auto_refresh: true
  
  request_monitor:
    max_requests: 1000
    auto_scroll: true

development:
  hot_reload: true
  debug_mode: true
  profile_enabled: true
  pprof_enabled: true
  race_detection: true
  
  # Mock настройки (когда Ollama недоступен)
  mock_ollama:
    enabled: true
    response_delay: "500ms"
    random_errors: false
    error_rate: 0.1

# 🔍 OBSERVABILITY - Distributed Tracing & Monitoring (Version 1.6.0+)
observability:
  # OpenTelemetry Distributed Tracing
  tracing:
    enabled: false  # Отключено - Jaeger недоступен
    provider: "jaeger"  # Поддержка: "jaeger" или "zipkin"
    service_name: "ollama-proxy"
    sampling_rate: 1.0  # 1.0 = 100% traces, 0.1 = 10% traces
    
    # Jaeger configuration (если provider = "jaeger")
    jaeger:
      endpoint: "http://localhost:4318"
    
    # Zipkin configuration (если provider = "zipkin")
    zipkin:
      endpoint: "http://localhost:9411/api/v2/spans"
  
  # Performance Monitoring (Version 1.6.2+)
  performance:
    enabled: true  # Отключено по умолчанию для development
    collection_interval: "30s"  # Как часто собирать метрики
    memory_threshold_mb: 1024  # Alert если heap > 1GB
    goroutine_threshold: 1000  # Alert если goroutines > 1000
    slow_request_threshold: "5s"  # Log requests медленнее 5 секунд
    gc_percentage: 100  # GOGC value (default: 100)
    leak_detection: true  # Включить leak detection
    pprof_enabled: true  # Включить pprof endpoints (/debug/pprof)

# ══════════════════════════════════════════════════════════════════════════════
# FILE STORAGE CONFIGURATION (Version 1.10.0+)
# ══════════════════════════════════════════════════════════════════════════════
file_storage:
  backend: "local"  # "local" или "s3"
  
  # Local filesystem storage
  local:
    base_path: "./data/files"
    max_file_size: "100MB"  # Максимальный размер одного файла
    max_total_size: "10GB"   # Максимальный размер всех файлов пользователя
    allowed_extensions:
      - ".pdf"
      - ".docx"
      - ".doc"
      - ".txt"
      - ".csv"
      - ".xlsx"
      - ".xls"
      - ".md"
      - ".rtf"
    scan_viruses: false  # ClamAV integration (future)
    validate_content: true  # Проверка magic number
  
  # S3-compatible storage (MinIO) - для production
  s3:
    endpoint: "http://localhost:9000"
    bucket: "user-files"
    access_key: "${MINIO_ACCESS_KEY}"
    secret_key: "${MINIO_SECRET_KEY}"
    use_ssl: false
    region: "us-east-1"
    public_bucket: "public-files"
    signed_url_expiry: "1h"
    max_file_size: "500MB"

# ══════════════════════════════════════════════════════════════════════════════
# DOCUMENT EXTRACTORS CONFIGURATION (Version 1.10.0+)
# ══════════════════════════════════════════════════════════════════════════════
extractors:
  # PDF extraction
  pdf:
    method: "auto"  # "auto", "pdftotext", "go-pdf" (auto выбирает лучший доступный)
    preserve_layout: false
    extract_images: false  # Для будущей IMAGE-01 интеграции
    ocr_enabled: false     # Для отсканированных PDF (future)
    max_pages: 1000
  
  # DOCX extraction
  docx:
    extract_tables: true
    extract_images: false
    extract_comments: false
  
  # Text files
  text:
    max_size: "10MB"
    encoding: "utf-8"
    fallback_encodings:
      - "windows-1251"
      - "iso-8859-1"
  
  # CSV files
  csv:
    delimiter: ","
    max_rows: 100000
    encoding: "utf-8"
    auto_detect_delimiter: true
  
  # General settings
  timeout: "30s"  # Таймаут на extraction одного файла
  parallel_workers: 4  # Количество воркеров для batch processing

# ================================================================================
# Web Fetch Configuration (Version 1.10.4+)
# ================================================================================
web_fetch:
  enabled: true
  timeout: "30s"
  
  # Security (SSRF protection)
  block_private_ips: true
  block_localhost: true
  allowed_domains: []  # Empty = all domains allowed
  blocked_domains: []  # Blacklist specific domains
  
  # Rate limiting
  rate_limit_enabled: true
  default_requests_per_min: 10
  
  # Cache
  cache_enabled: true
  cache_ttl: "1h"  # How long to cache fetched pages