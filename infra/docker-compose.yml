# AIGateway Infrastructure Services
# docker-compose -f infra/docker-compose.yml up -d

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # PostgreSQL (main database)
  # ═══════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: aigateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proxy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ollama_proxy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxy_user} -d ${POSTGRES_DB:-ollama_proxy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aigateway

  # ═══════════════════════════════════════════════════════════════════════════
  # Redis for Rate Limiting & Caching
  # ═══════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: aigateway-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aigateway

  # ═══════════════════════════════════════════════════════════════════════════
  # MinIO S3-Compatible Object Storage
  # ═══════════════════════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: aigateway-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"     # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aigateway

  # MinIO Client for bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: aigateway-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/user-files --ignore-existing;
      mc mb myminio/public-files --ignore-existing;
      mc mb myminio/rag-documents --ignore-existing;
      mc anonymous set download myminio/public-files;
      echo 'Buckets created successfully';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    networks:
      - aigateway

  # ═══════════════════════════════════════════════════════════════════════════
  # Jaeger for Distributed Tracing (Optional)
  # ═══════════════════════════════════════════════════════════════════════════
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: aigateway-jaeger
    restart: unless-stopped
    profiles:
      - tracing  # Only starts with: docker-compose --profile tracing up
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"   # Jaeger UI
      - "${JAEGER_OTLP_PORT:-4318}:4318"   # OTLP HTTP
    networks:
      - aigateway

  # ═══════════════════════════════════════════════════════════════════════════
  # Qdrant Vector Database (for RAG)
  # ═══════════════════════════════════════════════════════════════════════════
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aigateway-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots
      QDRANT__STORAGE__OPTIMIZERS__INDEXING_THRESHOLD_KB: 20000
      QDRANT__STORAGE__OPTIMIZERS__MEMMAP_THRESHOLD_KB: 50000
      QDRANT__LOG_LEVEL: INFO
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"   # REST API
      - "${QDRANT_GRPC_PORT:-6334}:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aigateway

  # ═══════════════════════════════════════════════════════════════════════════
  # Keycloak for OIDC/SSO (Optional)
  # ═══════════════════════════════════════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: aigateway-keycloak
    restart: unless-stopped
    profiles:
      - auth  # Only starts with: docker-compose --profile auth up
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ollama_proxy}
      KC_DB_USERNAME: ${POSTGRES_USER:-proxy_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_me}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aigateway

volumes:
  postgres_data:
    name: aigateway_postgres_data
  redis_data:
    name: aigateway_redis_data
  minio_data:
    name: aigateway_minio_data
  qdrant_data:
    name: aigateway_qdrant_data
  qdrant_snapshots:
    name: aigateway_qdrant_snapshots

networks:
  aigateway:
    name: aigateway_network
    driver: bridge

