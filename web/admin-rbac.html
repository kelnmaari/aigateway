<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBAC Management - Admin Panel</title>
    <link rel="stylesheet" href="/css/theme.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <style>
        .permission-badge {
            margin: 2px;
            font-size: 0.85em;
        }
        .role-card {
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .role-card:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .role-card.selected {
            border: 2px solid #007bff;
        }
        .permission-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .permission-item {
            border: 1px solid #ddd;
            padding: 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
        }
        .permission-item input {
            margin-right: 8px;
        }
        .system-role-badge {
            background-color: #6c757d;
        }
        .custom-role-badge {
            background-color: #28a745;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin.html">
                <i class="fas fa-shield-alt"></i> RBAC Management
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin.html">
                            <i class="fas fa-arrow-left"></i> Back to Admin
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Tab Navigation -->
        <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="roles-tab" data-bs-toggle="tab" data-bs-target="#roles" type="button" role="tab">
                    <i class="fas fa-user-tag"></i> Roles Management
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="user-roles-tab" data-bs-toggle="tab" data-bs-target="#user-roles" type="button" role="tab">
                    <i class="fas fa-users-cog"></i> User Roles
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="permissions-tab" data-bs-toggle="tab" data-bs-target="#permissions" type="button" role="tab">
                    <i class="fas fa-key"></i> Permissions Reference
                </button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content">
            <!-- Roles Management Tab -->
            <div class="tab-pane fade show active" id="roles" role="tabpanel">
                <div class="row">
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5>Roles</h5>
                                <button class="btn btn-primary btn-sm" id="createRoleBtn">
                                    <i class="fas fa-plus"></i> New Role
                                </button>
                            </div>
                            <div class="card-body" id="rolesListContainer">
                                <div class="text-center">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card" id="roleDetailsCard" style="display: none;">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 id="roleDetailsTitle">Role Details</h5>
                                <div>
                                    <button class="btn btn-warning btn-sm" id="editRoleBtn">
                                        <i class="fas fa-edit"></i> Edit
                                    </button>
                                    <button class="btn btn-danger btn-sm" id="deleteRoleBtn">
                                        <i class="fas fa-trash"></i> Delete
                                    </button>
                                </div>
                            </div>
                            <div class="card-body" id="roleDetailsBody">
                                <!-- Details will be loaded here -->
                            </div>
                        </div>
                        <div class="text-muted text-center" id="roleSelectPrompt">
                            <i class="fas fa-hand-pointer fa-3x mb-3"></i>
                            <p>Select a role to view details</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- User Roles Tab -->
            <div class="tab-pane fade" id="user-roles" role="tabpanel">
                <div class="card">
                    <div class="card-header">
                        <h5>User Roles Management</h5>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="userSelect" class="form-label">Select User</label>
                                <select class="form-select" id="userSelect">
                                    <option value="">-- Select User --</option>
                                </select>
                            </div>
                        </div>
                        <div id="userRolesContainer" style="display: none;">
                            <h6>Current Roles</h6>
                            <div id="currentRolesList" class="mb-3">
                                <!-- User roles will be displayed here -->
                            </div>
                            <h6>Assign New Role</h6>
                            <div class="row">
                                <div class="col-md-4">
                                    <label for="roleToAssign" class="form-label">Role</label>
                                    <select class="form-select" id="roleToAssign">
                                        <option value="">-- Select Role --</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="tenantForRole" class="form-label">Tenant (optional)</label>
                                    <select class="form-select" id="tenantForRole">
                                        <option value="">-- Global --</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">&nbsp;</label>
                                    <button class="btn btn-primary w-100" id="assignRoleBtn">
                                        <i class="fas fa-plus"></i> Assign Role
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Permissions Reference Tab -->
            <div class="tab-pane fade" id="permissions" role="tabpanel">
                <div class="card">
                    <div class="card-header">
                        <h5>System Permissions Reference</h5>
                    </div>
                    <div class="card-body" id="permissionsListContainer">
                        <div class="text-center">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create/Edit Role Modal -->
    <div class="modal fade" id="roleModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="roleModalTitle">Create Role</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="roleForm">
                        <input type="hidden" id="roleId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="roleName" class="form-label">Name (identifier)</label>
                                <input type="text" class="form-control" id="roleName" required>
                                <small class="text-muted">e.g., content_manager</small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="roleDisplayName" class="form-label">Display Name</label>
                                <input type="text" class="form-control" id="roleDisplayName" required>
                                <small class="text-muted">e.g., Content Manager</small>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="roleDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="roleDescription" rows="2"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="roleScope" class="form-label">Scope</label>
                                <select class="form-select" id="roleScope" required>
                                    <option value="global">Global</option>
                                    <option value="tenant">Tenant</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3" id="tenantFieldContainer" style="display: none;">
                                <label for="roleTenant" class="form-label">Tenant</label>
                                <select class="form-select" id="roleTenant">
                                    <option value="">-- Select Tenant --</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Permissions</label>
                            <div class="permission-grid" id="permissionsGrid">
                                <!-- Permissions checkboxes will be loaded here -->
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveRoleBtn">Save Role</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="/js/components/navigation.js"></script>
    <script src="/js/admin-rbac.js"></script>
</body>
</html>
