{{/* HF Download Paused - HTMX Component */}}
<div class="download-started" id="download-{{.Download.ID}}">
    <div class="alert alert-warning">
        <h4>⏸️ Download Paused</h4>
        <div class="download-info">
            <p><strong>Model:</strong> {{.Download.ModelID}}</p>
            <p><strong>File:</strong> {{.Download.Filename}}</p>
            <p><strong>Status:</strong> <span class="status-badge status-paused">Paused</span></p>
            <p><strong>Progress:</strong> {{printf "%.1f" .Download.Progress}}%</p>
        </div>
        
        <div class="download-actions">
            <button class="btn btn-sm btn-success"
                    hx-post="/api/ui/huggingface/downloads/{{.Download.ID}}/resume"
                    hx-target="#download-{{.Download.ID}}"
                    hx-swap="outerHTML">
                ▶️ Resume
            </button>
            
            <button class="btn btn-sm btn-danger"
                    hx-post="/api/ui/huggingface/downloads/{{.Download.ID}}/cancel"
                    hx-target="#download-{{.Download.ID}}"
                    hx-swap="outerHTML"
                    hx-confirm="Are you sure you want to cancel this download?">
                ❌ Cancel
            </button>
        </div>
    </div>
</div>

<style>
.download-started {
    margin-top: 1rem;
}

.alert-warning {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.2) 0%, rgba(251, 191, 36, 0.1) 100%);
    border: 1px solid rgba(251, 191, 36, 0.3);
    border-radius: 8px;
    padding: 1.5rem;
}

.alert-warning h4 {
    color: #fbbf24;
    margin: 0 0 1rem 0;
    font-size: 1.2rem;
}

.download-info {
    margin: 1rem 0;
}

.download-info p {
    margin: 0.25rem 0;
    color: rgba(255, 255, 255, 0.9);
}

.download-info strong {
    color: rgba(255, 255, 255, 0.7);
}

.status-badge {
    padding: 0.35rem 0.85rem;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
}

.status-paused {
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    color: #fff;
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
}

.download-actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.5rem;
    flex-wrap: wrap;
}

.btn-sm {
    padding: 0.5rem 1rem;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s ease;
}

.btn-success {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: white;
    box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
}

.btn-success:hover {
    background: linear-gradient(135deg, #059669 0%, #047857 100%);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.5);
}

.btn-danger {
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    color: white;
    box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
}

.btn-danger:hover {
    background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.5);
}
</style>
