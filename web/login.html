<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ollama Proxy</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>🤖 Ollama Proxy</h1>
                <p>Sign in to continue</p>
            </div>

            <div id="error-message" class="error-message" style="display: none;"></div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="identifier">Username or Email</label>
                    <input 
                        type="text" 
                        id="identifier" 
                        name="identifier" 
                        placeholder="Enter your username or email"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="login-btn">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/register.html">Register</a></p>
            </div>
        </div>
    </div>

    <script>
        // Check system initialization status on page load
        async function checkInitStatus() {
            try {
                const response = await fetch('/api/system/init-status');
                const data = await response.json();
                
                // If system requires bootstrap, redirect to bootstrap page
                if (data.requires_bootstrap) {
                    window.location.href = '/bootstrap.html';
                    return;
                }
            } catch (error) {
                console.error('Failed to check init status:', error);
                // Continue to login if check fails
            }
        }
        
        // Run init check on page load
        checkInitStatus();
        
        // Login form handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const errorDiv = document.getElementById('error-message');
            const loginBtn = document.getElementById('login-btn');
            
            errorDiv.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            
            try {
                const identifier = document.getElementById('identifier').value;
                const password = document.getElementById('password').value;
                
                // Send as username (backend expects username or email field)
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username: identifier, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }
                
                // Save tokens (backend returns them in 'token' object)
                localStorage.setItem('access_token', data.token.access_token);
                localStorage.setItem('refresh_token', data.token.refresh_token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                console.log('✅ Login successful! Tokens saved:', {
                    hasAccessToken: !!localStorage.getItem('access_token'),
                    hasRefreshToken: !!localStorage.getItem('refresh_token'),
                    user: data.user.username
                });
                
                // Check if there's a return URL
                const returnUrl = localStorage.getItem('return_url');
                if (returnUrl && returnUrl !== window.location.href) {
                    localStorage.removeItem('return_url');
                    window.location.href = returnUrl;
                } else {
                    // Redirect to dashboard (not index.html - chat)
                    window.location.href = '/dashboard.html';
                }
                
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
