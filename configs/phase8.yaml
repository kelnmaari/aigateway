# Phase 8 Configuration - API Key Management System
# Порт 8081 для избежания конфликтов с MVP на порту 8080

server:
  host: "0.0.0.0"
  port: 8081  # Другой порт для Phase 8
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"
  max_header_bytes: 1048576
  
  # CORS настройки
  cors:
    enabled: true
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Authorization", "Content-Type", "X-API-Key"]
    max_age: 86400

ollama:
  url: "http://localhost:11434"
  timeout: "60s"
  retry_attempts: 3
  retry_delay: "2s"
  connection_pool_size: 10
  keep_alive: true
  
  # Health check
  health_check:
    enabled: true
    interval: "30s"
    timeout: "5s"
  
  # Circuit breaker
  circuit_breaker:
    enabled: true
    max_failures: 5
    reset_timeout: "60s"

# API Key Management включен в Phase 8
auth:
  enabled: true  # Включаем аутентификацию
  storage_type: "json"
  storage_path: "data/phase8_api_keys.json"
  admin_key: "sk-admin-phase8-test-key-12345"  # Временный admin ключ для тестирования
  
  # Rate limiting per API key
  rate_limiting:
    enabled: true
    default_requests_per_minute: 30
    default_requests_per_hour: 500
    
    # Redis для distributed rate limiting (опционально)
    redis:
      enabled: false
      url: "redis://localhost:6379"
      key_prefix: "ollama_proxy_rl:"
  
  # JWT для internal tokens
  jwt:
    secret: "phase8-jwt-secret-for-testing"
    expiry: "24h"

logging:
  level: "debug"  # Debug для Phase 8 разработки
  format: "json"
  output: "stdout"
  
  # Structured fields для всех логов
  structured_fields:
    service: "ollama-openai-proxy"
    environment: "phase8"
    phase: "api_key_management"

# Управление моделями (упрощенное)
models:
  # Кеширование отключено для Phase 8 (упрощение)
  cache:
    enabled: false

# Метрики включены для мониторинга API keys
metrics:
  enabled: true
  prometheus_path: "/metrics"
  
  collection:
    enabled: true
    buffer_size: 1000
    flush_interval: "10s"

# TUI настройки
tui:
  enabled: true
  refresh_rate: "1s"
  theme: "default"
  
  dashboard:
    charts_history: 100
    auto_refresh: true
  
  request_monitor:
    max_requests: 100
    auto_scroll: true

# Настройки для разработки Phase 8
development:
  hot_reload: false
  debug_mode: true
  profile_enabled: true
  pprof_enabled: true
  race_detection: false
  
  # Mock Ollama отключен в Phase 8
  mock_ollama:
    enabled: false
