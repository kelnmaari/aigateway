<div class="modal-header">
    <h3>{{if .IsEdit}}Edit Model{{else}}Add New Model{{end}}</h3>
    <button class="btn-close" onclick="closeModal()">✕</button>
</div>

<form {{if .IsEdit}}hx-put="/api/admin/registry/models/{{.Model.ID}}"{{else}}hx-post="/api/admin/registry/models"{{end}}
      hx-target="#models-table"
      hx-swap="innerHTML"
      hx-on::after-request="closeModal(); showToast('Model {{if .IsEdit}}updated{{else}}created{{end}} successfully', 'success')">
    
    <div class="form-group">
        <label for="model_id">Model ID *</label>
        <input type="text" 
               id="model_id" 
               name="model_id" 
               value="{{if .Model}}{{.Model.ModelID}}{{end}}"
               {{if .IsEdit}}readonly{{end}}
               placeholder="e.g., llama2:7b"
               required>
        <small>Unique identifier for the model</small>
    </div>

    <div class="form-group">
        <label for="model_name">Display Name *</label>
        <input type="text" 
               id="model_name" 
               name="model_name" 
               value="{{if .Model}}{{.Model.ModelName}}{{end}}"
               placeholder="e.g., Llama 2 7B"
               required>
        <small>Human-readable name</small>
    </div>

    <div class="form-group">
        <label for="provider_id">Provider *</label>
        <select id="provider_id" name="provider_id" required>
            <option value="">Select provider...</option>
            {{range .Providers}}
            <option value="{{.}}" {{if and $.Model (eq $.Model.ProviderID .)}}}selected{{end}}>{{.}}</option>
            {{end}}
        </select>
        <small>Provider that hosts this model</small>
    </div>

    <div class="form-group">
        <label for="capabilities">Capabilities</label>
        <div class="checkbox-group">
            <label>
                <input type="checkbox" name="capabilities[]" value="chat" 
                       {{if and .Model (contains .Model.Capabilities "chat")}}checked{{end}}>
                Chat
            </label>
            <label>
                <input type="checkbox" name="capabilities[]" value="embeddings"
                       {{if and .Model (contains .Model.Capabilities "embeddings")}}checked{{end}}>
                Embeddings
            </label>
            <label>
                <input type="checkbox" name="capabilities[]" value="vision"
                       {{if and .Model (contains .Model.Capabilities "vision")}}checked{{end}}>
                Vision
            </label>
            <label>
                <input type="checkbox" name="capabilities[]" value="function_calling"
                       {{if and .Model (contains .Model.Capabilities "function_calling")}}checked{{end}}>
                Function Calling
            </label>
        </div>
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox" name="requires_gpu" value="true"
                   {{if and .Model .Model.RequiresGPU}}checked{{end}}>
            Requires GPU
        </label>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="min_vram_gb">Min VRAM (GB)</label>
            <input type="number" 
                   id="min_vram_gb" 
                   name="min_vram_gb" 
                   min="0"
                   value="{{if and .Model .Model.MinVRAMGB}}{{.Model.MinVRAMGB}}{{end}}"
                   placeholder="e.g., 8">
        </div>

        <div class="form-group">
            <label for="context_length">Context Length</label>
            <input type="number" 
                   id="context_length" 
                   name="context_length" 
                   min="0"
                   value="{{if and .Model .Model.ContextLength}}{{.Model.ContextLength}}{{end}}"
                   placeholder="e.g., 4096">
        </div>
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" 
                  name="description" 
                  rows="3"
                  placeholder="Optional description...">{{if .Model}}{{.Model.Description}}{{end}}</textarea>
    </div>

    <div class="form-group">
        <label for="tags">Tags (comma-separated)</label>
        <input type="text" 
               id="tags" 
               name="tags" 
               value="{{if .Model}}{{join .Model.Tags ","}}{{end}}"
               placeholder="e.g., llama, 7b, instruct">
    </div>

    {{if .IsEdit}}
    <div class="form-group">
        <label for="status">Status</label>
        <select id="status" name="status">
            <option value="enabled" {{if eq .Model.Status "enabled"}}selected{{end}}>Enabled</option>
            <option value="disabled" {{if eq .Model.Status "disabled"}}selected{{end}}>Disabled</option>
        </select>
    </div>
    {{end}}

    <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">
            Cancel
        </button>
        <button type="submit" class="btn btn-primary">
            {{if .IsEdit}}💾 Save Changes{{else}}➕ Create Model{{end}}
        </button>
    </div>
</form>
