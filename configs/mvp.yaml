# MVP конфигурация для Ollama-OpenAI Proxy
# Базовые настройки для запуска MVP

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"
  max_header_bytes: 1048576
  
  # CORS настройки
  cors:
    enabled: true
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Authorization", "Content-Type", "X-API-Key"]
    max_age: 86400

ollama:
  url: "http://localhost:11434"
  timeout: "60s"
  retry_attempts: 3
  retry_delay: "2s"
  connection_pool_size: 10
  keep_alive: true
  
  # Health check
  health_check:
    enabled: true
    interval: "30s"
    timeout: "5s"
  
  # Circuit breaker для надежности
  circuit_breaker:
    enabled: true
    max_failures: 5
    reset_timeout: "60s"

# Аутентификация отключена в MVP
auth:
  enabled: false
  storage_type: "json"
  storage_path: "data/api_keys.json"

logging:
  level: "info"
  format: "json"
  output: "stdout"
  
  # Structured fields для всех логов
  structured_fields:
    service: "ollama-openai-proxy"
    environment: "mvp"

# Управление моделями
models:
  # Кеширование списка моделей для производительности
  cache:
    enabled: true
    ttl: "5m"
    refresh_interval: "1m"
  
  # Маппинг популярных OpenAI моделей на Ollama
  mapping:
    "gpt-3.5-turbo": "llama2"
    "gpt-3.5-turbo-0613": "llama2"
    "gpt-4": "llama2:70b"
    "gpt-4-0613": "llama2:70b"
    "gpt-4-turbo": "mistral"
    "text-davinci-003": "llama2"
  
  # Алиасы для удобства
  aliases:
    "chatgpt": "llama2"
    "gpt4": "llama2:70b"
    "llama": "llama2"
  
  # Скрытые модели (не показывать в /v1/models)
  hidden: []

# Метрики включены для мониторинга
metrics:
  enabled: true
  prometheus_path: "/metrics"
  
  collection:
    enabled: true
    buffer_size: 1000
    flush_interval: "10s"

# TUI настройки для мониторинга
tui:
  enabled: true
  refresh_rate: "1s"
  theme: "default"
  
  dashboard:
    charts_history: 100
    auto_refresh: true
  
  request_monitor:
    max_requests: 50
    auto_scroll: true

# Настройки для разработки
development:
  hot_reload: false
  debug_mode: false
  profile_enabled: false
  pprof_enabled: false
  race_detection: false
  
  # Mock Ollama для тестирования без реального сервера
  mock_ollama:
    enabled: false
    response_delay: "100ms"
    random_errors: false
    error_rate: 0.0
