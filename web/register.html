<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AIGateway</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>🤖 AIGateway</h1>
                <p>Create your account</p>
            </div>

            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="success-message" class="success-message" style="display: none;"></div>
            <div id="invitation-info" class="info-message" style="display: none;"></div>

            <form id="register-form" class="auth-form">
                <!-- Hidden invitation token field (AUTH-03) -->
                <input type="hidden" id="invitation_token" name="invitation_token" value="">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Choose a username"
                        required
                        autocomplete="username"
                        minlength="3"
                        maxlength="32"
                        pattern="[a-zA-Z0-9_\-]+"
                        title="Only alphanumeric characters, underscores, and hyphens"
                    >
                    <small>3-32 characters, alphanumeric, _ and -</small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="your@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="display_name">Display Name (Optional)</label>
                    <input 
                        type="text" 
                        id="display_name" 
                        name="display_name" 
                        placeholder="Your full name"
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Choose a strong password"
                        required
                        autocomplete="new-password"
                        minlength="8"
                    >
                    <small>At least 8 characters with uppercase, lowercase, digit, and special character</small>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        placeholder="Confirm your password"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="register-btn">
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login.html">Sign In</a></p>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        // AUTH-03: Check for invitation token in URL
        let invitationToken = null;
        let invitationEmail = null;

        async function checkInvitationToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('invite');
            
            if (!token) {
                // No invitation token - check if registration is open
                // For now, allow registration without token (will be validated by backend)
                return;
            }

            invitationToken = token;
            document.getElementById('invitation_token').value = token;

            try {
                // Validate invitation token
                const response = await api.validateInvitation(token);
                
                if (response.valid) {
                    // Show invitation info
                    const infoDiv = document.getElementById('invitation-info');
                    infoDiv.style.display = 'block';
                    infoDiv.textContent = '✅ Valid invitation token detected';
                    
                    // Pre-fill email if restricted
                    if (response.invitation && response.invitation.email) {
                        invitationEmail = response.invitation.email;
                        const emailInput = document.getElementById('email');
                        emailInput.value = invitationEmail;
                        emailInput.readOnly = true;
                        infoDiv.textContent = `✅ Valid invitation for ${invitationEmail}`;
                    }
                } else {
                    // Invalid invitation
                    const errorDiv = document.getElementById('error-message');
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = response.error || 'Invalid or expired invitation token';
                    
                    // Disable form
                    document.getElementById('register-form').style.opacity = '0.5';
                    document.getElementById('register-form').style.pointerEvents = 'none';
                }
            } catch (error) {
                console.error('Failed to validate invitation:', error);
                const errorDiv = document.getElementById('error-message');
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Failed to validate invitation token';
                
                // Disable form
                document.getElementById('register-form').style.opacity = '0.5';
                document.getElementById('register-form').style.pointerEvents = 'none';
            }
        }

        // Check invitation token on page load
        document.addEventListener('DOMContentLoaded', () => {
            checkInvitationToken();
        });

        // Register form handler
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const registerBtn = document.getElementById('register-btn');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }
            
            registerBtn.disabled = true;
            registerBtn.textContent = 'Creating account...';
            
            try {
                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const display_name = document.getElementById('display_name').value;
                const invitation_token = document.getElementById('invitation_token').value;
                
                const payload = {
                    username,
                    email,
                    password,
                    display_name: display_name || username
                };

                // Include invitation token if present (AUTH-03)
                if (invitation_token) {
                    payload.invitation_token = invitation_token;
                }
                
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Registration failed');
                }
                
                // Save tokens
                localStorage.setItem('access_token', data.token.access_token);
                localStorage.setItem('refresh_token', data.token.refresh_token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                successDiv.textContent = 'Account created successfully! Redirecting...';
                successDiv.style.display = 'block';
                
                // Redirect to chat after 1 second
                setTimeout(() => {
                    window.location.href = '/chat.html';
                }, 1000);
                
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
                registerBtn.disabled = false;
                registerBtn.textContent = 'Create Account';
            }
        });
    </script>

    <style>
        .info-message {
            padding: 12px 16px;
            margin-bottom: 20px;
            background-color: #10b98120;
            color: #10b981;
            border: 1px solid #10b981;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</body>
</html>
