<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Ollama Proxy</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/notifications.css">
    <link rel="stylesheet" href="/css/model-panel.css">
    <!-- Markdown rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
</head>
<body class="chat-page">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>🤖 Ollama Proxy</h2>
            <button class="btn btn-icon" id="new-chat-btn" title="New Chat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M12 5v14M5 12h14" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>

        <div class="sidebar-content">
            <div id="conversations-list" class="conversations-list">
                <!-- Conversations will be loaded here -->
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="user-info" id="user-info">
                <span id="user-name">Loading...</span>
            </div>
            <button class="btn btn-secondary btn-block" id="logout-btn">
                Logout
            </button>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-main">
        <!-- Chat Header -->
        <header class="chat-header">
            <button class="btn btn-icon" id="sidebar-toggle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 12h18M3 6h18M3 18h18" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            
            <div class="chat-title">
                <h3 id="current-chat-title">New Chat</h3>
            </div>
            
            <div class="chat-nav-links">
                <a href="/dashboard.html" class="nav-link" title="Dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <rect x="3" y="3" width="7" height="7" stroke-width="2"/>
                        <rect x="14" y="3" width="7" height="7" stroke-width="2"/>
                        <rect x="14" y="14" width="7" height="7" stroke-width="2"/>
                        <rect x="3" y="14" width="7" height="7" stroke-width="2"/>
                    </svg>
                    Dashboard
                </a>
                <div id="admin-link-placeholder"></div>
            </div>
        </header>

        <!-- Messages Container -->
        <div class="messages-container" id="messages-container">
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-content">
                    <h1>👋 Welcome to Ollama Proxy</h1>
                    <p>Start a conversation by typing a message below</p>
                    <div class="welcome-features">
                        <div class="feature">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke-width="2"/>
                            </svg>
                            <span>Real-time streaming responses</span>
                        </div>
                        <div class="feature">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke-width="2"/>
                                <path d="M14 2v6h6" stroke-width="2"/>
                            </svg>
                            <span>Markdown & code highlighting</span>
                        </div>
                        <div class="feature">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" stroke-width="2"/>
                            </svg>
                            <span>Save & manage conversations</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="messages-list" class="messages-list">
                <!-- Messages will be appended here -->
            </div>
        </div>

        <!-- Compact Model Control Panel (v1.9.1 - Cursor-style) -->
        <div class="chat-model-panel">
            <div class="model-control-row">
                <!-- Model Selector (Cursor-style compact) -->
                <div class="model-selector-compact">
                    <select id="chat-model-select" class="model-select-compact">
                        <option value="">Loading models...</option>
                    </select>
                </div>

                <!-- Context Indicator -->
                <div class="context-indicator" id="context-indicator" title="Context usage">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M3 12h18M3 6h18M3 18h18" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span id="context-text">0/4096</span>
                </div>

                <!-- Parameters Toggle (compact) -->
                <button type="button" id="params-toggle" class="btn-params-compact" aria-expanded="false" title="Model parameters">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M2 14h4m4-6h4m4 8h4" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <!-- Expandable Parameters Panel -->
            <div id="params-panel" class="params-collapse" hidden>
                <div class="params-grid">
                    <!-- Temperature -->
                    <div class="param-control">
                        <label for="chat-temperature">
                            Temperature
                            <span class="param-info" title="Controls randomness: 0.0 = focused, 2.0 = creative">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <circle cx="12" cy="12" r="10" stroke-width="2"/>
                                    <path d="M12 16v-4m0-4h.01" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </span>
                        </label>
                        <div class="param-slider-group">
                            <input type="range" id="chat-temperature" min="0" max="2" step="0.1" value="0.7" />
                            <input type="number" id="chat-temperature-value" min="0" max="2" step="0.1" value="0.7" class="param-number" />
                        </div>
                    </div>

                    <!-- Top P -->
                    <div class="param-control">
                        <label for="chat-top-p">
                            Top P
                            <span class="param-info" title="Nucleus sampling: limits token choices to top probability mass">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <circle cx="12" cy="12" r="10" stroke-width="2"/>
                                    <path d="M12 16v-4m0-4h.01" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </span>
                        </label>
                        <div class="param-slider-group">
                            <input type="range" id="chat-top-p" min="0" max="1" step="0.05" value="0.9" />
                            <input type="number" id="chat-top-p-value" min="0" max="1" step="0.05" value="0.9" class="param-number" />
                        </div>
                    </div>

                    <!-- Max Tokens -->
                    <div class="param-control">
                        <label for="chat-max-tokens">
                            Max Tokens
                            <span class="param-info" title="Maximum response length (-1 = unlimited)">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <circle cx="12" cy="12" r="10" stroke-width="2"/>
                                    <path d="M12 16v-4m0-4h.01" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </span>
                        </label>
                        <input type="number" id="chat-max-tokens" min="-1" max="4096" value="-1" class="param-input" />
                    </div>

                    <!-- Context Window -->
                    <div class="param-control">
                        <label for="chat-num-ctx">
                            Context Window
                            <span class="param-info" title="Number of context tokens (128-131072)">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <circle cx="12" cy="12" r="10" stroke-width="2"/>
                                    <path d="M12 16v-4m0-4h.01" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </span>
                        </label>
                        <input type="number" id="chat-num-ctx" min="128" max="131072" value="4096" class="param-input" />
                    </div>
                </div>

                <!-- Quick Presets -->
                <div class="params-presets">
                    <button type="button" class="preset-btn" data-preset="creative">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke-width="2"/>
                        </svg>
                        Creative
                    </button>
                    <button type="button" class="preset-btn" data-preset="balanced">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M12 3v18m-9-9h18" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        Balanced
                    </button>
                    <button type="button" class="preset-btn" data-preset="precise">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="10" stroke-width="2"/>
                            <circle cx="12" cy="12" r="3" fill="currentColor"/>
                        </svg>
                        Precise
                    </button>
                    <button type="button" class="preset-btn" data-preset="coding">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M16 18l6-6-6-6M8 6l-6 6 6 6" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        Coding
                    </button>
                </div>

                <!-- Reset Button -->
                <button type="button" class="btn-reset" id="reset-params-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" stroke-width="2" stroke-linecap="round"/>
                        <path d="M3 3v5h5" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Reset to Defaults
                </button>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <!-- Attached Files Preview (FILE-STORAGE-01: Phase 4) -->
            <div id="attached-files-preview" class="attached-files-preview" style="display: none;">
                <!-- Attached files will be shown here -->
            </div>

            <form id="chat-form" class="chat-form">
                <input 
                    type="file" 
                    id="file-input" 
                    accept=".txt,.pdf,.docx,.csv" 
                    multiple 
                    style="display: none;"
                />
                <button type="button" class="btn btn-icon attach-btn" id="attach-btn" title="Attach files">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <textarea 
                    id="message-input" 
                    class="message-input"
                    placeholder="Type your message here... (Shift+Enter for new line)"
                    rows="1"
                    required
                ></textarea>
                <button type="submit" class="btn btn-primary send-btn" id="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </div>
    </main>

    <!-- Scripts -->
    <!-- Auth Guard MUST be loaded FIRST to protect the page -->
    <script src="/js/auth-guard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils/notifications.js"></script>
    <script src="/js/model-panel.js"></script>
    <script src="/js/context-manager.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
