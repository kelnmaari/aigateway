version: '3.8'

services:
  # ================================
  # Production Setup (SQLite)
  # ================================
  
  # AIGateway Platform Server
  aigateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
      args:
        VERSION: "2.1.0"
        BUILD_TIME: "${BUILD_TIME:-unknown}"
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
    container_name: aigateway
    ports:
      - "8080:8080"
    environment:
      # Server settings
      - AIGATEWAY_SERVER_PORT=8080
      - AIGATEWAY_SERVER_HOST=0.0.0.0
      
      # Ollama settings
      - AIGATEWAY_OLLAMA_URL=http://ollama:11434
      - AIGATEWAY_OLLAMA_TIMEOUT=30s
      
      # Logging
      - AIGATEWAY_LOGGING_LEVEL=info
      - AIGATEWAY_LOGGING_FORMAT=json
      - AIGATEWAY_LOGGING_FILE=/app/logs/aigateway.log
      
      # Authentication
      - AIGATEWAY_AUTH_ENABLED=true
      - AIGATEWAY_AUTH_ADMIN_KEY=${ADMIN_KEY:-sk-admin-change-me}
      - AIGATEWAY_AUTH_JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - AIGATEWAY_AUTH_JWT_ACCESS_TOKEN_EXPIRY=15m
      - AIGATEWAY_AUTH_JWT_REFRESH_TOKEN_EXPIRY=168h
      
      # Database (SQLite for simple deployment)
      - AIGATEWAY_DATABASE_TYPE=sqlite
      - AIGATEWAY_DATABASE_SQLITE_PATH=/app/data/aigateway.db
      - AIGATEWAY_DATABASE_SQLITE_JOURNAL_MODE=WAL
    volumes:
      - AIGATEWAY_data:/app/data
      - AIGATEWAY_logs:/app/logs
      - ./configs:/app/configs:ro
    depends_on:
      - ollama
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Ollama сервер
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ollama_network
    restart: unless-stopped
    environment:
      - OLLAMA_ORIGINS=*
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - ollama

  # ================================
  # Production Setup (PostgreSQL)
  # ================================
  
  # Прокси с PostgreSQL
  proxy-postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
      args:
        VERSION: "1.3.0"
        BUILD_TIME: "${BUILD_TIME:-unknown}"
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
    container_name: ollama-openai-proxy-postgres
    ports:
      - "8080:8080"
    environment:
      # Server settings
      - AIGATEWAY_SERVER_PORT=8080
      - AIGATEWAY_SERVER_HOST=0.0.0.0
      
      # Ollama settings
      - AIGATEWAY_OLLAMA_URL=http://ollama:11434
      
      # Logging
      - AIGATEWAY_LOGGING_LEVEL=info
      - AIGATEWAY_LOGGING_FORMAT=json
      
      # Authentication
      - AIGATEWAY_AUTH_ENABLED=true
      - AIGATEWAY_AUTH_ADMIN_KEY=${ADMIN_KEY:-sk-admin-change-me}
      - AIGATEWAY_AUTH_JWT_SECRET=${JWT_SECRET:-change-this-in-production-minimum-32-chars}
      
      # Database (PostgreSQL for production)
      - AIGATEWAY_DATABASE_TYPE=postgresql
      - AIGATEWAY_DATABASE_POSTGRESQL_HOST=postgres
      - AIGATEWAY_DATABASE_POSTGRESQL_PORT=5432
      - AIGATEWAY_DATABASE_POSTGRESQL_DATABASE=ollama_proxy
      - AIGATEWAY_DATABASE_POSTGRESQL_USER=AIGATEWAY_user
      - AIGATEWAY_DATABASE_POSTGRESQL_PASSWORD=${DB_PASSWORD:-secure_password}
      - AIGATEWAY_DATABASE_POSTGRESQL_SSL_MODE=require
    volumes:
      - AIGATEWAY_logs:/app/logs
      - ./configs:/app/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles:
      - postgres

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: ollama-proxy-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ollama_proxy
      - POSTGRES_USER=AIGATEWAY_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secure_password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U AIGATEWAY_user -d ollama_proxy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - postgres

  # ================================
  # Development Setup
  # ================================
  
  proxy-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    container_name: ollama-openai-proxy-dev
    ports:
      - "8080:8080"
      - "2345:2345"  # Delve debugger
    environment:
      - AIGATEWAY_SERVER_PORT=8080
      - AIGATEWAY_SERVER_HOST=0.0.0.0
      - AIGATEWAY_OLLAMA_URL=http://ollama:11434
      - AIGATEWAY_LOGGING_LEVEL=debug
      - AIGATEWAY_LOGGING_FORMAT=text
      - AIGATEWAY_AUTH_ENABLED=false
      - AIGATEWAY_DATABASE_TYPE=sqlite
      - AIGATEWAY_DATABASE_SQLITE_PATH=/app/data/proxy-dev.db
      - GO_ENV=development
    volumes:
      - .:/app
      - AIGATEWAY_data_dev:/app/data
      - go_cache:/root/.cache/go-build
      - go_mod_cache:/go/pkg/mod
    depends_on:
      - ollama
    networks:
      - ollama_network
    profiles:
      - dev
    command: ["air", "-c", ".air.toml"]

  # ================================
  # Additional Services
  # ================================
  
  # Redis (для distributed rate limiting в production)
  redis:
    image: redis:7-alpine
    container_name: ollama-proxy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ollama_network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles:
      - redis
      - monitoring

  # Prometheus для метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: ollama-proxy-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ollama_network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  # Grafana для визуализации
  grafana:
    image: grafana/grafana:latest
    container_name: ollama-proxy-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana:/etc/grafana/provisioning:ro
    networks:
      - ollama_network
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # TUI контейнер
  tui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tui
    container_name: ollama-proxy-tui
    environment:
      - AIGATEWAY_URL=http://proxy:8080
    depends_on:
      - proxy
    networks:
      - ollama_network
    profiles:
      - tui
    stdin_open: true
    tty: true

volumes:
  ollama_data:
    driver: local
  AIGATEWAY_data:
    driver: local
  AIGATEWAY_data_dev:
    driver: local
  AIGATEWAY_logs:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  go_cache:
    driver: local
  go_mod_cache:
    driver: local

networks:
  ollama_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ================================
# Профили использования (Version 1.3.0):
# ================================
# 
# Простая установка (SQLite):
#   docker-compose up proxy
# 
# С Ollama:
#   docker-compose --profile ollama up
# 
# Production с PostgreSQL:
#   docker-compose --profile postgres --profile ollama up
# 
# Development:
#   docker-compose --profile dev --profile ollama up
# 
# С мониторингом:
#   docker-compose --profile postgres --profile monitoring up
# 
# С Redis rate limiting:
#   docker-compose --profile postgres --profile redis up
# 
# С TUI:
#   docker-compose --profile tui up
# 
# Полный стек:
#   docker-compose --profile postgres --profile ollama --profile monitoring up
#

